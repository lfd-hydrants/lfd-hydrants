<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LFD Hydrant Testing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#1a1a1a; --paper:#f6f5f1; --card:#fff; --red:#b3231c; --red-deep:#7d1712;
    --steel:#3c4c55; --line:#d8d5cc; --ok:#2f6b3a; --warn:#a8631b; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
  header{background:var(--ink);color:var(--paper);padding:16px;border-bottom:4px solid var(--red);
    position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;}
  header h1{font-size:18px;margin:0;}
  header .who{font-size:12px;opacity:.7;}
  header button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 10px;border-radius:5px;font-size:12px;}
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:9;overflow-x:auto;}
  .tab{flex:1;min-width:80px;text-align:center;padding:11px 4px;font-size:12.5px;font-weight:600;color:#8a8378;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
  .tab.active{color:var(--red-deep);border-bottom-color:var(--red);}
  main{padding:16px;max-width:680px;margin:0 auto;padding-bottom:60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--steel);margin-bottom:4px;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:10px;font-size:15px;border:1.5px solid var(--line);border-radius:5px;font-family:inherit;}
  textarea{min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  button.primary{width:100%;background:var(--red);color:#fff;font-weight:700;padding:13px;border:none;border-radius:6px;font-size:15px;cursor:pointer;}
  button.secondary{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--steel);padding:10px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:8px;}
  .calc-box{background:#f1efe8;border:1px dashed var(--line);border-radius:6px;padding:10px;margin-top:8px;font-size:13.5px;}
  .calc-row{display:flex;justify-content:space-between;padding:3px 0;}
  .calc-row .v{font-family:'Courier New',monospace;font-weight:700;}
  .entry{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px;background:var(--card);}
  .entry-top{display:flex;justify-content:space-between;font-size:13px;color:#9a9488;margin-bottom:4px;}
  .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:3px;}
  .tag-good{background:#e4efe6;color:var(--ok);} .tag-repair{background:#f5e9dd;color:var(--warn);} .tag-oos{background:#f5e0de;color:var(--red-deep);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:#f1efe8;border-radius:6px;padding:12px;text-align:center;}
  .stat .n{font-size:24px;font-weight:700;font-family:'Courier New',monospace;}
  .stat .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  select[multiple]{height:110px;}
  .login-wrap{max-width:360px;margin:60px auto;padding:20px;}
  .hint{font-size:12px;color:#9a9488;margin-top:6px;}
  .overdue{color:var(--red-deep);font-weight:700;}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG — safe to expose client-side (anon/public key only)
// ============================================================
const SUPABASE_URL = 'https://byddmktjldogehwhapog.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5ZGRta3RqbGRvZ2Vod2hhcG9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODQ2NTMsImV4cCI6MjEwMTk2MDY1M30.sP1cNPsw4XRLnySrmcCvPlTbBsiglHEWOgcHjRTIymw';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let state = {
  user: null,
  tab: 'new',
  companies: [], divisions: [], members: [], hydrants: [], settings: {},
};

// ============================================================
// AUTH
// ============================================================
async function checkSession(){
  const { data } = await sb.auth.getSession();
  state.user = data.session ? data.session.user : null;
  render();
}

function renderLogin(){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="card">
        <h2 style="margin-top:0;">LFD Hydrant Testing</h2>
        <div class="field"><label>Email</label><input id="loginEmail" type="email"></div>
        <div class="field"><label>Password</label><input id="loginPass" type="password"></div>
        <button class="primary" id="loginBtn">Sign In</button>
        <div class="hint">First time? Ask your admin to create your login in Supabase Authentication, or use "Sign Up" below if self-signup is enabled.</div>
        <button class="secondary" id="signupBtn">Create Account</button>
      </div>
    </div>`;
  document.getElementById('loginBtn').onclick = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ toast(error.message); } else { checkSession(); }
  };
  document.getElementById('signupBtn').onclick = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    if(!email || password.length < 6){ toast('Enter email + 6-char password'); return; }
    const { error } = await sb.auth.signUp({ email, password });
    if(error){ toast(error.message); } else { toast('Account created — check email if confirmation required'); }
  };
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadRefData(){
  const [c, d, m, h, s] = await Promise.all([
    sb.from('companies').select('*').order('name'),
    sb.from('divisions').select('*').order('name'),
    sb.from('members').select('*').eq('active', true).order('name'),
    sb.from('hydrants').select('*').eq('active', true).order('hydrant_number'),
    sb.from('app_settings').select('*'),
  ]);
  state.companies = c.data || [];
  state.divisions = d.data || [];
  state.members = m.data || [];
  state.hydrants = h.data || [];
  state.settings = {};
  (s.data || []).forEach(row => state.settings[row.key] = row.value);
}

// ============================================================
// SHELL
// ============================================================
function render(){
  if(!state.user){ renderLogin(); return; }
  app.innerHTML = `
    <header>
      <div>
        <h1>LFD Hydrant Testing</h1>
        <div class="who">${esc(state.user.email)}</div>
      </div>
      <button id="signOutBtn">Sign Out</button>
    </header>
    <div class="tabs">
      <div class="tab" data-tab="new">Session</div>
      <div class="tab" data-tab="log">Log</div>
      <div class="tab" data-tab="stats">Stats</div>
      <div class="tab" data-tab="admin">Admin</div>
    </div>
    <main id="main"></main>
  `;
  document.getElementById('signOutBtn').onclick = async ()=>{ await sb.auth.signOut(); state.user=null; render(); };
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.tab === state.tab);
    t.onclick = ()=>{ state.tab = t.dataset.tab; render(); };
  });
  loadRefData().then(()=>{
    if(state.tab === 'new') renderSessionTab();
    else if(state.tab === 'log') renderLog();
    else if(state.tab === 'stats') renderStats();
    else if(state.tab === 'admin') renderAdmin();
  });
}

// ============================================================
// SESSION WORKFLOW — Jobs vs. Shifts
// A JOB is the overall task for one Company + Division + Activity
// (e.g. "shovel out Engine 4 / Group 1 after this storm") and can
// span many days and many crews until it's explicitly marked complete.
// A SHIFT (stored in `sessions`) is one crew's single day of work on
// that job — its own OIC/crew/start-end time for accurate time tracking.
// "End Shift" closes today's shift only; the job (and its pending
// hydrant list) carries forward for the next crew. "Mark Job Complete"
// closes the whole job — the next storm starts a fresh, full list.
// ============================================================

let sessionCrew = []; // [{id, name}] while building/editing a session

function attachDatePicker(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('click', ()=>{ if(el.showPicker) el.showPicker(); });
}

async function renderSessionTab(){
  const cachedId = localStorage.getItem('lfd_active_session_id');
  if(cachedId){
    const { data, error } = await sb.from('sessions').select('*').eq('id', cachedId).single();
    if(!error && data && data.status === 'open'){
      state.activeSession = data;
      const { data: job } = await sb.from('jobs').select('*').eq('id', data.job_id).single();
      state.activeJob = job || null;
      renderHydrantEntry();
      return;
    }
    localStorage.removeItem('lfd_active_session_id');
  }
  renderFindSession();
}

function renderFindSession(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Start or Resume a Session</h3>
      <div class="hint" style="margin-bottom:12px;">Pick Company, Division, and Activity to start today's session, or resume one still in progress. Different activities for the same company/division run as separate sessions — a snow-removal job won't interfere with an in-progress flow test.</div>
      <div class="row2">
        <div class="field"><label>Company</label>
          <select id="find_company"><option value="">—</option>${state.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Division</label>
          <select id="find_division"><option value="">—</option>${state.divisions.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Activity</label>
        <select id="find_activity">
          <option value="flow_test">Flow Test</option>
          <option value="condition_check">Condition Check</option>
          <option value="snow_removal">Snow Removal</option>
          <option value="other">Other</option>
        </select>
      </div>
      <button class="primary" id="findBtn">Continue</button>
    </div>
  `;
  document.getElementById('findBtn').onclick = async ()=>{
    const companyId = document.getElementById('find_company').value;
    const divisionId = document.getElementById('find_division').value;
    const activityType = document.getElementById('find_activity').value;
    if(!companyId || !divisionId){ toast('Select both company and division'); return; }

    const { data: job, error: jobErr } = await sb.from('jobs').select('*')
      .eq('company_id', companyId).eq('division_id', divisionId)
      .eq('activity_type', activityType).eq('status', 'open')
      .order('created_at', { ascending:false }).limit(1).maybeSingle();

    if(jobErr){ toast('Error: ' + jobErr.message); return; }

    if(job){
      // Job already exists — is there a shift currently open under it (e.g. page refresh)?
      const { data: openShift } = await sb.from('sessions').select('*')
        .eq('job_id', job.id).eq('status', 'open')
        .order('started_at', { ascending:false }).limit(1).maybeSingle();

      if(openShift){
        state.activeJob = job;
        state.activeSession = openShift;
        localStorage.setItem('lfd_active_session_id', openShift.id);
        toast('Resumed in-progress shift');
        renderHydrantEntry();
      } else {
        // Job open, no shift running right now — start a new shift under it
        renderStartSession({ companyId, divisionId, activityType, job });
      }
    } else {
      // No open job — this will create both a new job and its first shift
      renderStartSession({ companyId, divisionId, activityType, job:null });
    }
  };
}

function renderStartSession(prefill, editingSession){
  const main = document.getElementById('main');
  const isEdit = !!editingSession;
  sessionCrew = isEdit
    ? (editingSession.crew_member_ids || []).map(id => state.members.find(m=>m.id===id)).filter(Boolean).map(m=>({id:m.id, name:m.name}))
    : [];
  const today = new Date().toISOString().slice(0,10);
  const activityLabels = {flow_test:'Flow Test', condition_check:'Condition Check', snow_removal:'Snow Removal', other:'Other'};

  const companyName = isEdit
    ? state.companies.find(c=>c.id===editingSession.company_id)?.name
    : state.companies.find(c=>c.id===prefill?.companyId)?.name;
  const divisionName = isEdit
    ? state.divisions.find(d=>d.id===editingSession.division_id)?.name
    : state.divisions.find(d=>d.id===prefill?.divisionId)?.name;
  const activityType = isEdit ? editingSession.activity_type : prefill?.activityType;

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">${isEdit ? 'Edit Shift Details' : 'Start Shift'}</h3>
      <div class="hint" style="margin-bottom:12px;">Job: ${esc(companyName||'—')} · ${esc(divisionName||'—')} · ${esc(activityLabels[activityType]||'—')}${isEdit ? ' <span style="opacity:.7;">(fixed for this job — start a new job from the find screen to change)</span>' : ''}</div>
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${isEdit ? editingSession.session_date : today}"></div>
      <div class="field"><label>OIC</label>
        <select id="f_oic"><option value="">—</option>${state.members.map(m=>`<option value="${m.id}" ${isEdit && editingSession.oic_member_id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Crew</label>
        <div class="row2">
          <select id="f_crew_pick"><option value="">Select a member…</option>${state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
          <button type="button" class="secondary" id="addCrewBtn" style="margin-top:0;">Add</button>
        </div>
        <div id="crewList" style="margin-top:10px;"></div>
      </div>
      <button class="primary" id="startBtn">${isEdit ? 'Save Changes' : 'Start Shift'}</button>
      ${isEdit ? '<button class="secondary" id="cancelEditBtn">Cancel</button>' : '<button class="secondary" id="backToFindBtn">← Back</button>'}
    </div>
  `;
  attachDatePicker('f_date');

  function renderCrewList(){
    const list = document.getElementById('crewList');
    if(sessionCrew.length === 0){
      list.innerHTML = '<div class="hint">No crew added yet.</div>';
      return;
    }
    list.innerHTML = sessionCrew.map(m => `
      <div style="display:flex;justify-content:space-between;align-items:center;background:#f1efe8;border-radius:5px;padding:7px 10px;margin-bottom:6px;font-size:13.5px;">
        <span>${esc(m.name)}</span>
        <button type="button" data-id="${m.id}" class="removeCrewBtn" style="background:none;border:none;color:var(--red-deep);font-weight:700;cursor:pointer;font-size:15px;">×</button>
      </div>
    `).join('');
    list.querySelectorAll('.removeCrewBtn').forEach(btn=>{
      btn.onclick = ()=>{
        sessionCrew = sessionCrew.filter(m => m.id !== btn.dataset.id);
        renderCrewList();
      };
    });
  }
  renderCrewList();

  document.getElementById('addCrewBtn').onclick = ()=>{
    const sel = document.getElementById('f_crew_pick');
    const id = sel.value;
    if(!id){ toast('Pick a crew member first'); return; }
    if(sessionCrew.some(m => m.id === id)){ toast('Already added'); return; }
    const member = state.members.find(m => m.id === id);
    sessionCrew.push({ id: member.id, name: member.name });
    sel.value = '';
    renderCrewList();
  };

  if(isEdit){
    document.getElementById('cancelEditBtn').onclick = ()=> renderHydrantEntry();
  } else {
    document.getElementById('backToFindBtn').onclick = ()=> renderFindSession();
  }

  document.getElementById('startBtn').onclick = async ()=>{
    const oic = document.getElementById('f_oic').value;
    if(!oic){ toast('Select an OIC'); return; }

    const payload = {
      session_date: document.getElementById('f_date').value,
      oic_member_id: oic,
      crew_member_ids: sessionCrew.map(m => m.id),
    };

    if(isEdit){
      const { data, error } = await sb.from('sessions').update(payload).eq('id', editingSession.id).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      state.activeSession = data;
      toast('Shift updated');
      renderHydrantEntry();
    } else {
      let job = prefill.job;
      if(!job){
        const { data: newJob, error: jobErr } = await sb.from('jobs').insert({
          company_id: prefill.companyId,
          division_id: prefill.divisionId,
          activity_type: prefill.activityType,
          status: 'open',
        }).select().single();
        if(jobErr){ toast('Error: ' + jobErr.message); return; }
        job = newJob;
      }

      const { data, error } = await sb.from('sessions').insert({
        ...payload,
        job_id: job.id,
        division_id: prefill.divisionId,
        company_id: prefill.companyId,
        activity_type: prefill.activityType,
        started_at: new Date().toISOString(),
        status: 'open',
      }).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      localStorage.setItem('lfd_active_session_id', data.id);
      state.activeJob = job;
      state.activeSession = data;
      toast('Shift started');
      renderHydrantEntry();
    }
  };
}

async function checkDuplicateToday(hydrantId){
  if(!hydrantId) return [];
  const today = new Date().toISOString().slice(0,10);
  const { data, error } = await sb.from('hydrant_tests')
    .select('*, sessions(company_id, session_date)')
    .eq('hydrant_id', hydrantId);
  if(error || !data) return [];
  return data.filter(t => t.sessions && t.sessions.session_date === today);
}

async function renderHydrantEntry(){
  const main = document.getElementById('main');
  const s = state.activeSession;
  const job = state.activeJob;
  const oicName = state.members.find(m => m.id === s.oic_member_id)?.name || '—';
  const companyName = state.companies.find(c => c.id === job.company_id)?.name || '—';
  const divisionName = state.divisions.find(d => d.id === job.division_id)?.name || '—';
  const startedLocal = new Date(s.started_at).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  const jobStartedLocal = new Date(job.created_at).toLocaleDateString([], {month:'short', day:'numeric'});

  // Pending = this job's company hydrants minus ones completed under ANY shift of this job
  const { data: jobShifts } = await sb.from('sessions').select('id').eq('job_id', job.id);
  const shiftIds = (jobShifts || []).map(r => r.id);
  const { data: doneRows } = await sb.from('hydrant_tests').select('hydrant_id').in('session_id', shiftIds.length ? shiftIds : ['00000000-0000-0000-0000-000000000000']);
  const doneIds = new Set((doneRows || []).map(r => r.hydrant_id));
  const companyHydrants = state.hydrants.filter(h => h.company_id === job.company_id);
  const pending = companyHydrants.filter(h => !doneIds.has(h.id));
  const completedCount = companyHydrants.length - pending.length;

  main.innerHTML = `
    <div class="card" style="background:#f1efe8;">
      <div style="font-size:13px;"><b>Job:</b> ${esc(companyName)} · ${esc(divisionName)} · ${esc(job.activity_type)} — open since ${esc(jobStartedLocal)}</div>
      <div style="font-size:12.5px;color:var(--steel);margin-top:2px;">This shift started ${esc(startedLocal)} · OIC: ${esc(oicName)} · Crew: ${(s.crew_member_ids||[]).length}</div>
      <div style="font-size:12.5px;color:var(--steel);margin-top:2px;">${completedCount} of ${companyHydrants.length} hydrants complete for this job</div>
      <div style="margin-top:8px;">
        <button type="button" id="editSessionBtn" style="width:100%;background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px;font-size:12px;font-weight:600;color:var(--steel);cursor:pointer;">Edit This Shift</button>
      </div>
    </div>

    <div class="card">
      <div class="field"><label>Hydrant Number ${pending.length===0 ? '— all done for this job!' : ''}</label>
        <select id="f_hydrant"><option value="">${pending.length ? 'Select hydrant…' : 'No hydrants remaining'}</option>${pending.map(h=>`<option value="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')}</option>`).join('')}</select>
      </div>
      <div id="dupWarning"></div>
      <div class="row3">
        <div class="field"><label>Static (psi)</label><input type="number" id="f_static"></div>
        <div class="field"><label>Residual (psi)</label><input type="number" id="f_residual"></div>
        <div class="field"><label>Pitot (psi)</label><input type="number" id="f_pitot"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Outlet Size (in)</label><input type="number" id="f_orifice" placeholder="2.5"></div>
        <div class="field"><label>Discharge Coef.</label><input type="number" id="f_coeff" value="${state.settings.default_discharge_coeff || '0.9'}"></div>
        <div class="field"><label># Outlets</label><input type="number" id="f_outlets" value="1"></div>
      </div>
      <div class="calc-box" id="calcBox">
        <div class="calc-row"><span>Flow at test</span><span class="v" id="c_flow">— gpm</span></div>
        <div class="calc-row"><span>% Drop</span><span class="v" id="c_drop">—%</span></div>
        <div class="calc-row"><span>Flow @ 20 psi</span><span class="v" id="c_flow20">— gpm</span></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field"><label>Condition</label>
          <select id="f_condition"><option value="good">Good</option><option value="repair">Needs Repair</option><option value="oos">Out of Service</option></select>
        </div>
        <div class="field"><label>Wet / Dry</label>
          <select id="f_wetdry"><option value="wet">Wet</option><option value="dry">Dry</option></select>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Leaks, missing cap, obstructed, etc."></textarea></div>
      <button class="primary" id="saveBtn">Save &amp; Continue</button>
      <button class="secondary" id="endBtn" style="border-color:var(--red);color:var(--red-deep);">End Shift</button>
    </div>
  `;

  document.getElementById('editSessionBtn').onclick = ()=> renderStartSession(null, s);

  document.getElementById('f_hydrant').addEventListener('change', async (e)=>{
    const dupBox = document.getElementById('dupWarning');
    dupBox.innerHTML = '';
    const dups = await checkDuplicateToday(e.target.value);
    if(dups.length){
      const d = dups[0];
      const compName = state.companies.find(c=>c.id === d.sessions?.company_id)?.name || 'another company';
      dupBox.innerHTML = `<div class="hint" style="background:#f5e9dd;color:var(--warn);border-radius:5px;padding:8px 10px;margin:-4px 0 12px;font-weight:600;">⚠ Already tested today (by ${esc(compName)}) — condition: ${esc(d.condition)}. You can still save if this is a recheck.</div>`;
    }
  });

  function calc(){
    const P = parseFloat(document.getElementById('f_pitot').value);
    const d = parseFloat(document.getElementById('f_orifice').value);
    const C = parseFloat(document.getElementById('f_coeff').value) || 0.9;
    const n = parseFloat(document.getElementById('f_outlets').value) || 1;
    const hs = parseFloat(document.getElementById('f_static').value);
    const hr = parseFloat(document.getElementById('f_residual').value);
    let flow=null, drop=null, flow20=null;
    if(!isNaN(P) && !isNaN(d) && P>0 && d>0) flow = 29.83 * C * d*d * Math.sqrt(P) * n;
    if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
    if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
    document.getElementById('c_flow').textContent = flow!==null ? Math.round(flow)+' gpm' : '— gpm';
    document.getElementById('c_drop').textContent = drop!==null ? drop.toFixed(1)+'%' : '—%';
    document.getElementById('c_flow20').textContent = flow20!==null ? Math.round(flow20)+' gpm' : '— gpm';
    return {flow, drop, flow20};
  }
  ['f_pitot','f_orifice','f_coeff','f_outlets','f_static','f_residual'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calc);
  });

  document.getElementById('saveBtn').onclick = async ()=>{
    const hydrantId = document.getElementById('f_hydrant').value;
    if(!hydrantId){ toast('Select a hydrant'); return; }
    const {flow, drop, flow20} = calc();

    const { error: tErr } = await sb.from('hydrant_tests').insert({
      session_id: s.id,
      hydrant_id: hydrantId,
      static_psi: document.getElementById('f_static').value || null,
      residual_psi: document.getElementById('f_residual').value || null,
      pitot_psi: document.getElementById('f_pitot').value || null,
      orifice_diameter: document.getElementById('f_orifice').value || null,
      discharge_coeff: document.getElementById('f_coeff').value || null,
      num_outlets: document.getElementById('f_outlets').value || null,
      flow_gpm: flow!==null ? Math.round(flow) : null,
      drop_pct: drop!==null ? drop.toFixed(1) : null,
      flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
      condition: document.getElementById('f_condition').value,
      wet_dry: document.getElementById('f_wetdry').value,
      notes: document.getElementById('f_notes').value || null,
    });

    if(tErr){ toast('Error: ' + tErr.message); return; }
    toast('Hydrant saved — ready for next one');
    renderHydrantEntry();
  };

  document.getElementById('endBtn').onclick = ()=> openEndShiftModal();
}

function openEndShiftModal(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const overlay = document.createElement('div');
  overlay.style = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;';
  overlay.innerHTML = `
    <div class="card" style="max-width:360px;width:100%;margin:0;">
      <h3 style="margin-top:0;">End Shift</h3>
      <div class="field"><label>Current Time</label><input type="time" id="endTimeInput" value="${hh}:${mm}"></div>
      <div class="field" style="display:flex;align-items:flex-start;gap:8px;">
        <input type="checkbox" id="endConfirmCheck" style="width:auto;margin-top:3px;">
        <label for="endConfirmCheck" style="text-transform:none;font-weight:400;font-size:13.5px;color:var(--ink);">I confirm all hydrant data for this shift has been recorded.</label>
      </div>
      <div class="field" style="display:flex;align-items:flex-start;gap:8px;background:#f1efe8;border-radius:5px;padding:8px;">
        <input type="checkbox" id="jobCompleteCheck" style="width:auto;margin-top:3px;">
        <label for="jobCompleteCheck" style="text-transform:none;font-weight:400;font-size:13.5px;color:var(--ink);">This job is fully complete — no more crews expected (e.g. all hydrants done, or storm cleanup finished). Leave unchecked if another crew will continue this later.</label>
      </div>
      <button class="primary" id="confirmEndBtn">Confirm &amp; End Shift</button>
      <button class="secondary" id="cancelEndBtn">Cancel</button>
    </div>
  `;
  document.body.appendChild(overlay);
  attachDatePicker('endTimeInput');

  document.getElementById('cancelEndBtn').onclick = ()=> overlay.remove();

  document.getElementById('confirmEndBtn').onclick = async ()=>{
    const checked = document.getElementById('endConfirmCheck').checked;
    if(!checked){ toast('Please confirm all data has been recorded'); return; }
    const jobComplete = document.getElementById('jobCompleteCheck').checked;
    const timeVal = document.getElementById('endTimeInput').value;
    const [h, m] = timeVal.split(':').map(Number);
    const endedAt = new Date();
    endedAt.setHours(h, m, 0, 0);

    const s = state.activeSession;
    const job = state.activeJob;
    const startedAt = new Date(s.started_at);
    const totalMinutes = Math.max(0, Math.round((endedAt - startedAt) / 60000));

    const { error } = await sb.from('sessions').update({
      ended_at: endedAt.toISOString(),
      status: 'closed',
      total_minutes: totalMinutes,
    }).eq('id', s.id);

    if(error){ toast('Error: ' + error.message); return; }

    if(jobComplete){
      const { error: jobErr } = await sb.from('jobs').update({
        status: 'closed',
        closed_at: new Date().toISOString(),
      }).eq('id', job.id);
      if(jobErr){ toast('Shift saved, but error closing job: ' + jobErr.message); }
    }

    localStorage.removeItem('lfd_active_session_id');
    state.activeSession = null;
    state.activeJob = null;
    overlay.remove();
    toast(jobComplete ? 'Shift ended — job marked complete' : 'Shift ended — job still open for the next crew');
    renderFindSession();
  };
}

// ============================================================
// LOG (with search/filter)
// ============================================================
async function renderLog(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <div class="row2">
        <div class="field"><label>Filter: Company</label>
          <select id="filt_company"><option value="">All</option>${state.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Filter: Condition</label>
          <select id="filt_condition"><option value="">All</option><option value="good">Good</option><option value="repair">Needs Repair</option><option value="oos">Out of Service</option></select>
        </div>
      </div>
      <div class="field"><label>Search Hydrant #</label><input id="filt_search" placeholder="e.g. H-101"></div>
    </div>
    <div id="logList">Loading…</div>
  `;

  async function load(){
    let query = sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id)').order('tested_at', {ascending:false}).limit(100);
    const { data, error } = await query;
    if(error){ document.getElementById('logList').innerHTML = 'Error: '+esc(error.message); return; }

    const companyFilter = document.getElementById('filt_company').value;
    const condFilter = document.getElementById('filt_condition').value;
    const search = document.getElementById('filt_search').value.trim().toLowerCase();

    let rows = data || [];
    if(companyFilter) rows = rows.filter(r => r.hydrants && r.hydrants.company_id === companyFilter);
    if(condFilter) rows = rows.filter(r => r.condition === condFilter);
    if(search) rows = rows.filter(r => r.hydrants && r.hydrants.hydrant_number.toLowerCase().includes(search));

    const tagClass = {good:'tag-good', repair:'tag-repair', oos:'tag-oos'};
    const tagLabel = {good:'Good', repair:'Needs Repair', oos:'Out of Service'};

    document.getElementById('logList').innerHTML = rows.length ? rows.map(r => `
      <div class="entry">
        <div class="entry-top"><span>${esc(r.hydrants?.hydrant_number || '—')} · ${esc(r.hydrants?.address||'')}</span><span>${esc(r.tested_at?.slice(0,10))}</span></div>
        <span class="tag ${tagClass[r.condition]}">${tagLabel[r.condition]}</span>
        <div style="margin-top:6px;font-size:13px;">Static ${r.static_psi??'—'} · Residual ${r.residual_psi??'—'} · Flow ${r.flow_gpm??'—'} gpm · @20psi ${r.flow_at_20psi??'—'} gpm</div>
        ${r.notes ? `<div style="font-size:12.5px;font-style:italic;color:var(--steel);margin-top:4px;">"${esc(r.notes)}"</div>` : ''}
      </div>
    `).join('') : '<div class="card">No matching entries.</div>';
  }
  ['filt_company','filt_condition'].forEach(id => document.getElementById(id).addEventListener('change', load));
  document.getElementById('filt_search').addEventListener('input', load);
  load();
}

// ============================================================
// STATS (for the chief)
// ============================================================
async function renderStats(){
  const main = document.getElementById('main');
  main.innerHTML = 'Loading…';

  const [{data: tests}, {data: sessions}, {data: hydrants}] = await Promise.all([
    sb.from('hydrant_tests').select('*'),
    sb.from('sessions').select('*'),
    sb.from('hydrants').select('*').eq('active', true),
  ]);

  const t = tests || [], s = sessions || [], h = hydrants || [];
  const totalMinutes = s.reduce((sum,x)=> sum + (x.total_minutes||0), 0);
  const goodCount = t.filter(x=>x.condition==='good').length;
  const repairCount = t.filter(x=>x.condition==='repair').length;
  const oosCount = t.filter(x=>x.condition==='oos').length;

  // overdue: hydrants with no test within their retest interval
  const now = new Date();
  const lastTestByHydrant = {};
  t.forEach(x => {
    const cur = lastTestByHydrant[x.hydrant_id];
    if(!cur || new Date(x.tested_at) > new Date(cur)) lastTestByHydrant[x.hydrant_id] = x.tested_at;
  });
  const overdue = h.filter(hy => {
    const last = lastTestByHydrant[hy.id];
    if(!last) return true;
    const months = hy.retest_interval_months || 12;
    const dueDate = new Date(last);
    dueDate.setMonth(dueDate.getMonth() + months);
    return dueDate < now;
  });

  main.innerHTML = `
    <div class="card">
      <div class="stat-grid">
        <div class="stat"><div class="n">${t.length}</div><div class="l">Tests Logged</div></div>
        <div class="stat"><div class="n">${s.length}</div><div class="l">Sessions</div></div>
        <div class="stat"><div class="n">${Math.round(totalMinutes/60)}</div><div class="l">Total Hours</div></div>
        <div class="stat"><div class="n overdue">${overdue.length}</div><div class="l">Hydrants Overdue</div></div>
        <div class="stat"><div class="n">${goodCount}</div><div class="l">Good</div></div>
        <div class="stat"><div class="n">${repairCount + oosCount}</div><div class="l">Needs Attention</div></div>
      </div>
    </div>
    ${overdue.length ? `<div class="card"><b>Overdue for retest:</b><br>${overdue.map(hy=>esc(hy.hydrant_number)).join(', ')}</div>` : ''}
  `;
}

// ============================================================
// ADMIN (editable settings)
// ============================================================
function renderAdmin(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Settings</h3>
      <div class="field"><label>Default Retest Interval (months)</label>
        <input id="s_retest" type="number" value="${state.settings.default_retest_interval_months || 12}">
      </div>
      <div class="field"><label>Default Discharge Coefficient</label>
        <input id="s_coeff" type="number" step="0.01" value="${state.settings.default_discharge_coeff || 0.9}">
      </div>
      <button class="primary" id="saveSettings">Save Settings</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Export</h3>
      <button class="secondary" id="exportBtn">Download Full Backup (CSV)</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Roster (read-only preview — bulk edits via CSV import, coming next)</h3>
      <div style="font-size:13px;">${state.hydrants.length} hydrants · ${state.members.length} members · ${state.companies.length} companies</div>
    </div>
  `;
  document.getElementById('saveSettings').onclick = async ()=>{
    await sb.from('app_settings').upsert([
      { key:'default_retest_interval_months', value: document.getElementById('s_retest').value },
      { key:'default_discharge_coeff', value: document.getElementById('s_coeff').value },
    ]);
    toast('Settings saved');
    loadRefData();
  };
  document.getElementById('exportBtn').onclick = async ()=>{
    const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number,address)');
    if(!data || !data.length){ toast('No data yet'); return; }
    const headers = ['Hydrant','Address','Date','Static','Residual','Pitot','Flow','Drop%','Flow@20psi','Condition','Notes'];
    const rows = data.map(r=>[r.hydrants?.hydrant_number, r.hydrants?.address, r.tested_at?.slice(0,10), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.drop_pct, r.flow_at_20psi, r.condition, r.notes]);
    const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const csv = [headers.join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hydrant-backup-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
}

checkSession();
sb.auth.onAuthStateChange((event, session) => {
  state.user = session ? session.user : null;
  render();
});
</script>
