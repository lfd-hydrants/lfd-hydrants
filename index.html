<style>
  :root{ --ink:#1a1a1a; --paper:#f6f5f1; --card:#fff; --red:#b3231c; --red-deep:#7d1712;
    --steel:#3c4c55; --line:#d8d5cc; --ok:#2f6b3a; --warn:#a8631b; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
  header{background:var(--ink);color:var(--paper);padding:16px;border-bottom:4px solid var(--red);

  .tab.active{color:var(--red-deep);border-bottom-color:var(--red);}
  main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--steel);margin-bottom:4px;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:10px;font-size:15px;border:1.5px solid var(--line);border-radius:5px;font-family:inherit;}
  textarea{min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  button.primary{width:100%;background:var(--red);color:#fff;font-weight:700;padding:13px;border:none;border-radius:6px;font-size:15px;cursor:pointer;transition:box-shadow .2s;}
  button.primary.unsaved{box-shadow:0 0 0 3px rgba(179,35,28,.3);}
  button.secondary{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--steel);padding:10px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:8px;}
  button.small{background:#fff;border:1.5px solid var(--line);color:var(--steel);padding:8px 10px;border-radius:5px;font-weight:600;cursor:pointer;font-size:12.5px;}
  button.small.danger{border-color:var(--red);color:var(--red-deep);}
  button.small.ok{border-color:var(--ok);color:var(--ok);}
  button.small.neutral{border-color:var(--steel);}

  .calc-row{display:flex;justify-content:space-between;padding:3px 0;}
  .calc-row .v{font-family:'Courier New',monospace;font-weight:700;}
  .entry{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px;background:var(--card);cursor:pointer;}
  .entry:active{background:#f1efe8;}
  .entry-top{display:flex;justify-content:space-between;font-size:13px;color:#9a9488;margin-bottom:4px;}
  .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-right:4px;}
  .tag-good{background:#e4efe6;color:var(--ok);}
  .tag-bad{background:#f5e0de;color:var(--red-deep);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:#f1efe8;border-radius:6px;padding:12px;text-align:center;}
  .stat .n{font-size:24px;font-weight:700;font-family:'Courier New',monospace;}
  .stat .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .login-wrap{max-width:360px;margin:60px auto;padding:20px;}
  .hint{font-size:12px;color:#9a9488;margin-top:6px;}

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function attachDatePicker(id){

function fmtDate(d){
  if(!d) return '—';
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date)) return '—';
  const mm = String(date.getMonth()+1).padStart(2,'0');
  const dd = String(date.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${date.getFullYear()}`;
}
function fmtDateTime(d){
  if(!d) return '—';
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date)) return '—';
  return `${fmtDate(date)} ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;

  state.isChief = false;

}

// TYPEAHEAD
// ============================================================
function typeaheadHtml(id, placeholder){
  return `
    <div style="position:relative;">
      <input type="text" id="${id}_text" placeholder="${esc(placeholder)}" autocomplete="off">
      <input type="hidden" id="${id}_value">
      <div class="search-results" id="${id}_results" style="display:none;position:absolute;left:0;right:0;background:#fff;z-index:5;"></div>
    </div>`;
}
function wireTypeahead(id, items, onSelect){
  const textInput = document.getElementById(id+'_text');
  const hiddenInput = document.getElementById(id+'_value');
  const results = document.getElementById(id+'_results');
  textInput.addEventListener('focus', ()=>renderList(items));
  textInput.addEventListener('input', ()=>{
    const q = textInput.value.trim().toLowerCase();
    renderList(q ? items.filter(m=>m.name.toLowerCase().includes(q)) : items);
  });
  document.addEventListener('click', (e)=>{
    if(!textInput.contains(e.target) && !results.contains(e.target)) results.style.display='none';
  });
  function renderList(matches){
    if(!matches.length){ results.style.display='none'; return; }
    results.innerHTML = matches.slice(0,30).map(m=>`<div class="search-result-item" data-id="${m.id}">${esc(m.name)}</div>`).join('');
    results.style.display = 'block';
    results.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        const m = items.find(x=>x.id===el.dataset.id);
        textInput.value = m.name; hiddenInput.value = m.id;
        results.style.display = 'none';
        if(onSelect) onSelect(m);
      };
    });
  }
}

// ============================================================
// COMPLETION HELPERS
// ============================================================
async function computeCompletionForCompanyDivision(companyId, divisionId, activityType, cutoffDate){
  const hydrantsFor = state.hydrants.filter(h => h.company_id === companyId && h.division_id === divisionId);
  const ids = hydrantsFor.map(h=>h.id);
  if(ids.length === 0) return { pending: [], total: 0, completedCount: 0 };
  const { data } = await sb.from('hydrant_tests').select('hydrant_id, tested_at, sessions(activity_type)').in('hydrant_id', ids);
  const doneIds = new Set((data||[])
    .filter(r => r.sessions && r.sessions.activity_type === activityType && new Date(r.tested_at) >= cutoffDate)
    .map(r=>r.hydrant_id));
  const pending = hydrantsFor.filter(h => !doneIds.has(h.id));
  return { pending, total: hydrantsFor.length, completedCount: hydrantsFor.length - pending.length };
}
async function computeJobPending(job){
  return computeCompletionForCompanyDivision(job.company_id, job.division_id, job.activity_type, new Date(job.created_at));
}

async function renderCompanyHome(){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const fourteenDaysAgo = new Date(Date.now() - 14*24*60*60*1000).toISOString();

  const [{ data: openJobs }, { data: closedJobs }] = await Promise.all([
    sb.from('jobs').select('*').eq('company_id', state.company.id).eq('division_id', state.division.id).eq('status','open').order('created_at', {ascending:false}),
    sb.from('jobs').select('*').eq('company_id', state.company.id).eq('division_id', state.division.id).eq('status','closed').gte('closed_at', fourteenDaysAgo).order('closed_at', {ascending:false}),
  ]);

  const jobRows = [];
  for(const job of (openJobs||[])){
    const { data: shifts } = await sb.from('sessions').select('*').eq('job_id', job.id).order('started_at', {ascending:false});
    const openShift = (shifts||[]).find(s => s.status === 'open');
    const recentClosedShifts = (shifts||[]).filter(s => s.status === 'closed').slice(0,3);
    const { pending, total } = await computeJobPending(job);
    jobRows.push({ job, openShift, recentClosedShifts, pendingCount: pending.length, total });
  }

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Open Work</h3>
      ${jobRows.length === 0 ? '<div class="hint">Nothing open right now.</div>' : jobRows.map(r => `
        <div class="job-row">
          <div class="jt">${esc(ACTIVITY_LABELS[r.job.activity_type])}</div>
          <div class="jm">${r.total - r.pendingCount} of ${r.total} hydrants complete · opened ${fmtDate(r.job.created_at)}${r.openShift ? ' · shift in progress' : ''}</div>
          <div class="shift-actions">
            <button class="small" data-resume="${r.job.id}">Resume</button>
            ${r.openShift ? `<button class="small danger" data-endshift="${r.openShift.id}">End Shift</button>` : '<span></span>'}
          </div>
          <button class="small danger" style="width:100%;margin-top:8px;" data-closejob="${r.job.id}">Close Job Permanently</button>

      await sb.from('jobs').update({ status:'closed', closed_at: new Date().toISOString() }).eq('id', btn.dataset.closejob);
      await sb.from('sessions').update({ status:'closed', ended_at: new Date().toISOString() }).eq('job_id', btn.dataset.closejob).eq('status','open');
      toast('Job closed permanently');
      renderCompanyHome();
    };

  main.querySelectorAll('[data-reopenshift]').forEach(btn=>{
    btn.onclick = async ()=>{
      await sb.from('sessions').update({ status:'open', ended_at:null }).eq('id', btn.dataset.reopenshift);

  main.querySelectorAll('[data-reopenjob]').forEach(btn=>{

      await sb.from('jobs').update({ status:'open', closed_at:null }).eq('id', btn.dataset.reopenjob);
      toast('Job reopened'); renderCompanyHome();

function renderActivityPicker(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">What kind of job?</h3>
      <button class="choice-btn" data-activity="flow_test">Flow Test</button>
      <button class="choice-btn" data-activity="condition_check">Condition Check</button>
      <button class="choice-btn" data-activity="snow_removal">Snow Removal</button>
      <button class="choice-btn" data-activity="other">Other</button>
      <button class="secondary" id="backBtn">← Back</button>
    </div>`;
  main.querySelectorAll('[data-activity]').forEach(btn=>{
    btn.onclick = async ()=>{
      const activityType = btn.dataset.activity;
      const { data: existing } = await sb.from('jobs').select('*')
        .eq('company_id', state.company.id).eq('division_id', state.division.id)
        .eq('activity_type', activityType).eq('status','open').maybeSingle();
      if(existing){
        const { data: openShift } = await sb.from('sessions').select('*').eq('job_id', existing.id).eq('status','open').maybeSingle();
        state.activeJob = existing;
        if(openShift){
          state.activeSession = openShift;
          localStorage.setItem('lfd_active_session_id', openShift.id);
          toast('An open job for this already exists — resuming it');
          renderHydrantEntry();
        } else { renderStartShift({ job: existing }, null); }
      } else { renderStartShift({ activityType }, null); }
    };
  });

async function getOrCreateCampaign(activityType){
  const { data: existing } = await sb.from('campaigns').select('*')
    .eq('activity_type', activityType).eq('status','open')
    .order('created_at', {ascending:false}).limit(1).maybeSingle();
  if(existing) return existing;
  const label = ACTIVITY_LABELS[activityType] + ' — started ' + new Date().toLocaleDateString([], {month:'long', year:'numeric'});
  const { data: newCampaign, error } = await sb.from('campaigns').insert({ name: label, activity_type: activityType, status:'open' }).select().single();
  if(error){ console.error('Campaign creation failed:', error.message); return null; }
  return newCampaign;
}

function renderStartShift(prefill, editingSession){
  const main = document.getElementById('main');
  const isEdit = !!editingSession;
  sessionCrew = isEdit
    ? (editingSession.crew_member_ids || []).map(id => state.members.find(m=>m.id===id)).filter(Boolean).map(m=>({id:m.id, name:m.name}))
    : [];
  const today = new Date().toISOString().slice(0,10);
  const activityType = isEdit ? state.activeJob.activity_type : (prefill.job ? prefill.job.activity_type : prefill.activityType);

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">${isEdit ? 'Shift Settings' : 'Start Shift'}</h3>
      <div class="hint" style="margin-bottom:12px;">${esc(state.company.name)} · ${esc(ACTIVITY_LABELS[activityType])}</div>
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${isEdit ? editingSession.session_date : today}"></div>
      <div class="field"><label>Division</label>
        <select id="f_division">${state.divisions.map(d=>`<option value="${d.id}" ${(isEdit ? editingSession.division_id===d.id : state.division.id===d.id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>OIC</label>${typeaheadHtml('f_oic', 'Type a name…')}</div>
      <div class="field"><label>Crew</label>
        <div class="row2">
          <div>${typeaheadHtml('f_crew_pick', 'Type a name…')}</div>
          <button type="button" class="secondary" id="addCrewBtn" style="margin-top:0;">Add</button>
        </div>
        <div id="crewList" style="margin-top:10px;"></div>
      </div>
      <button class="primary" id="startBtn">${isEdit ? 'Save Changes' : 'Start Shift'}</button>
      <button class="secondary" id="backBtn">← Back</button>
    </div>`;
  attachDatePicker('f_date');

  wireTypeahead('f_oic', state.members);
  if(isEdit && editingSession.oic_member_id){
    const m = state.members.find(x=>x.id===editingSession.oic_member_id);
    if(m){ document.getElementById('f_oic_text').value = m.name; document.getElementById('f_oic_value').value = m.id; }
  }
  wireTypeahead('f_crew_pick', state.members);

  function renderCrewList(){
    const list = document.getElementById('crewList');
    if(sessionCrew.length === 0){ list.innerHTML = '<div class="hint">No crew added yet.</div>'; return; }
    list.innerHTML = sessionCrew.map(m => `
      <div style="display:flex;justify-content:space-between;align-items:center;background:#f1efe8;border-radius:5px;padding:7px 10px;margin-bottom:6px;font-size:13.5px;">
        <span>${esc(m.name)}</span>
        <button type="button" data-id="${m.id}" class="removeCrewBtn" style="background:none;border:none;color:var(--red-deep);font-weight:700;cursor:pointer;font-size:15px;">×</button>
      </div>`).join('');
    list.querySelectorAll('.removeCrewBtn').forEach(btn=>{
      btn.onclick = ()=>{ sessionCrew = sessionCrew.filter(m => m.id !== btn.dataset.id); renderCrewList(); };
    });
  }
  renderCrewList();

  document.getElementById('addCrewBtn').onclick = ()=>{
    const id = document.getElementById('f_crew_pick_value').value;
    if(!id){ toast('Pick a crew member first'); return; }
    if(sessionCrew.some(m => m.id === id)){ toast('Already added'); return; }
    const member = state.members.find(m => m.id === id);
    sessionCrew.push({ id: member.id, name: member.name });
    document.getElementById('f_crew_pick_text').value = '';
    document.getElementById('f_crew_pick_value').value = '';
    renderCrewList();
  };

  document.getElementById('backBtn').onclick = ()=> isEdit ? renderHydrantEntry() : renderCompanyHome();

  document.getElementById('startBtn').onclick = async ()=>{
    const oic = document.getElementById('f_oic_value').value;
    const divisionId = document.getElementById('f_division').value;
    if(!oic){ toast('Select an OIC'); return; }

    const payload = {
      session_date: document.getElementById('f_date').value,
      division_id: divisionId,
      oic_member_id: oic,
      crew_member_ids: sessionCrew.map(m => m.id),
    };

    if(isEdit){
      const { data, error } = await sb.from('sessions').update(payload).eq('id', editingSession.id).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      state.activeSession = data;
      toast('Shift updated');
      renderHydrantEntry();
    } else {
      let job = prefill.job;
      if(!job){
        const campaign = await getOrCreateCampaign(prefill.activityType);
        const { data: newJob, error: jobErr } = await sb.from('jobs').insert({
          company_id: state.company.id, division_id: state.division.id,
          activity_type: prefill.activityType, status: 'open',
          campaign_id: campaign ? campaign.id : null,
        }).select().single();
        if(jobErr){ toast('Error: ' + jobErr.message); return; }
        job = newJob;
      }
      const { data, error } = await sb.from('sessions').insert({
        ...payload, company_id: state.company.id, activity_type: job.activity_type,
        job_id: job.id, started_at: new Date().toISOString(), status: 'open',
      }).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      localStorage.setItem('lfd_active_session_id', data.id);
      state.activeJob = job; state.activeSession = data;
      toast('Shift started');
      renderHydrantEntry();
    }
  };
}

let selectedHydrantId = null;

function hydrantPickerHtml(pending){
  return `
    <div class="field"><label>Hydrant Number ${pending.length===0 ? '— all done for this job!' : ''}</label>
      <select id="f_hydrant"><option value="">${pending.length ? 'Select hydrant…' : 'No hydrants remaining'}</option>${pending.map(h=>`<option value="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')}</option>`).join('')}</select>
    </div>
    <div class="field">
      <label>Hydrant not on the list?</label>
      <select id="manualDropdown"><option value="">Browse all hydrants…</option>${[...state.hydrants].sort((a,b)=>a.hydrant_number.localeCompare(b.hydrant_number,undefined,{numeric:true})).map(h=>{
        const comp = state.companies.find(c=>c.id===h.company_id)?.name || '—';
        const div = state.divisions.find(d=>d.id===h.division_id)?.name || '—';
        return `<option value="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')} (${esc(comp)} · ${esc(div)})</option>`;
      }).join('')}</select>
      <input type="text" id="manualSearch" placeholder="…or search by number or address" style="margin-top:6px;">
      <div class="search-results" id="manualResults" style="display:none;"></div>
    </div>
  `;
}
function wireHydrantPicker(afterPick){
  const dropdown = document.getElementById('manualDropdown');
  dropdown.addEventListener('change', ()=>{ if(dropdown.value){ selectedHydrantId = dropdown.value; afterPick(selectedHydrantId); } });
  const input = document.getElementById('manualSearch');
  const results = document.getElementById('manualResults');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.style.display='none'; results.innerHTML=''; return; }
    const matches = state.hydrants.filter(h => h.hydrant_number.toLowerCase().includes(q) || (h.address||'').toLowerCase().includes(q)).slice(0, 8);
    results.style.display = matches.length ? 'block' : 'none';
    results.innerHTML = matches.map(h => {
      const comp = state.companies.find(c=>c.id===h.company_id)?.name || '—';
      const div = state.divisions.find(d=>d.id===h.division_id)?.name || '—';
      return `<div class="search-result-item" data-id="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')}<small>${esc(comp)} · ${esc(div)}</small></div>`;
    }).join('');
    results.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        selectedHydrantId = el.dataset.id;
        input.value = state.hydrants.find(h=>h.id===el.dataset.id).hydrant_number;
        results.style.display = 'none';
        afterPick(selectedHydrantId);
      };
    });
  });
}

async function renderHydrantEntry(){
  const s = state.activeSession;
  const job = state.activeJob;
  selectedHydrantId = null;

  const main = document.getElementById('main');
  const oicName = state.members.find(m => m.id === s.oic_member_id)?.name || '—';

  const headerHtml = `
    <div class="card" style="background:#f1efe8;">
      <div style="font-size:13px;"><b>${esc(state.company.name)} · ${esc(ACTIVITY_LABELS[job.activity_type])}</b> — job open since ${fmtDate(job.created_at)}</div>
      <div style="font-size:12.5px;color:var(--steel);margin-top:2px;">This shift started ${fmtDateTime(s.started_at)} · OIC: ${esc(oicName)} · Division: ${esc(divisionName)} · Crew: ${(s.crew_member_ids||[]).length}</div>
      <div style="font-size:12.5px;color:var(--steel);margin-top:2px;">${completedCount} of ${total} hydrants complete for this job</div>

  else renderFlowTestForm(main, headerHtml, pending, s, job);

async function checkDuplicateToday(hydrantId, activityType){
  if(!hydrantId) return [];
  const today = new Date().toISOString().slice(0,10);
  const { data } = await sb.from('hydrant_tests').select('*, sessions(company_id, session_date, activity_type)').eq('hydrant_id', hydrantId);
  if(!data) return [];
  return data.filter(t => t.sessions && t.sessions.session_date === today && t.sessions.activity_type === activityType);
}
function dupWarningHtml(){ return '<div id="dupWarning"></div>'; }
async function wireDupWarning(hydrantId, activityType){
  const box = document.getElementById('dupWarning');
  if(!box) return;
  box.innerHTML = '';
  const dups = await checkDuplicateToday(hydrantId, activityType);
  if(dups.length){
    const d = dups[0];
    const compName = state.companies.find(c=>c.id === d.sessions?.company_id)?.name || 'another company';
    box.innerHTML = `<div class="hint" style="background:#f5e9dd;color:var(--warn);border-radius:5px;padding:8px 10px;margin:-4px 0 12px;font-weight:600;">⚠ Already done today (by ${esc(compName)}). You can still save if this is a recheck.</div>`;
  }
}

function renderFlowTestForm(main, headerHtml, pending, s, job){
  main.innerHTML = headerHtml + `
    <div class="card">
      ${hydrantPickerHtml(pending)}
      ${dupWarningHtml()}
      <div class="row3">
        <div class="field"><label>Static (psi)</label><input type="number" id="f_static"></div>
        <div class="field"><label>Residual (psi)</label><input type="number" id="f_residual"></div>
        <div class="field"><label>Pitot (psi)</label><input type="number" id="f_pitot"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Outlet Size (in)</label><input type="number" id="f_orifice" value="2.5"></div>
        <div class="field"><label>Discharge Coef.</label><input type="number" id="f_coeff" value="${state.settings.default_discharge_coeff || '0.9'}"></div>
        <div class="field"><label># Outlets</label><input type="number" id="f_outlets" value="1"></div>
      </div>
      <div class="calc-box">
        <div class="calc-row"><span>Flow at test</span><span class="v" id="c_flow">— gpm</span></div>
        <div class="calc-row"><span>% Drop</span><span class="v" id="c_drop">—%</span></div>
        <div class="calc-row"><span>Flow @ 20 psi</span><span class="v" id="c_flow20">— gpm</span></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field"><label>Condition</label>
          <select id="f_condition"><option value="good">Good</option><option value="repair">Needs Repair</option><option value="oos">Out of Service</option></select>
        </div>
        <div class="field"><label>Wet / Dry</label>
          <select id="f_wetdry"><option value="dry" selected>Dry</option><option value="wet">Wet</option></select>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Leaks, missing cap, obstructed, etc."></textarea></div>
      <button class="primary" id="saveBtn">Save &amp; Continue</button>
    </div>`;

  document.getElementById('f_hydrant').addEventListener('change', (e)=>{ selectedHydrantId = e.target.value; wireDupWarning(selectedHydrantId, 'flow_test'); });
  wireHydrantPicker((id)=> wireDupWarning(id, 'flow_test'));

  function calc(){
    const P = parseFloat(document.getElementById('f_pitot').value);
    const d = parseFloat(document.getElementById('f_orifice').value);
    const C = parseFloat(document.getElementById('f_coeff').value) || 0.9;
    const n = parseFloat(document.getElementById('f_outlets').value) || 1;
    const hs = parseFloat(document.getElementById('f_static').value);
    const hr = parseFloat(document.getElementById('f_residual').value);
    let flow=null, drop=null, flow20=null;
    if(!isNaN(P) && !isNaN(d) && P>0 && d>0) flow = 29.83 * C * d*d * Math.sqrt(P) * n;
    if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
    if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
    document.getElementById('c_flow').textContent = flow!==null ? Math.round(flow)+' gpm' : '— gpm';
    document.getElementById('c_drop').textContent = drop!==null ? drop.toFixed(1)+'%' : '—%';
    document.getElementById('c_flow20').textContent = flow20!==null ? Math.round(flow20)+' gpm' : '— gpm';
    return {flow, drop, flow20};
  }
  ['f_pitot','f_orifice','f_coeff','f_outlets','f_static','f_residual'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calc);
  });

  document.getElementById('saveBtn').onclick = async ()=>{
    const hydrantId = selectedHydrantId || document.getElementById('f_hydrant').value;
    if(!hydrantId){ toast('Select a hydrant'); return; }
    const {flow, drop, flow20} = calc();
    const { error } = await sb.from('hydrant_tests').insert({
      session_id: s.id, hydrant_id: hydrantId,
      static_psi: document.getElementById('f_static').value || null,
      residual_psi: document.getElementById('f_residual').value || null,
      pitot_psi: document.getElementById('f_pitot').value || null,
      orifice_diameter: document.getElementById('f_orifice').value || null,
      discharge_coeff: document.getElementById('f_coeff').value || null,
      num_outlets: document.getElementById('f_outlets').value || null,
      flow_gpm: flow!==null ? Math.round(flow) : null,
      drop_pct: drop!==null ? drop.toFixed(1) : null,
      flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
      condition: document.getElementById('f_condition').value,
      wet_dry: document.getElementById('f_wetdry').value,
      notes: document.getElementById('f_notes').value || null,
    });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Saved — ready for next one');
    renderHydrantEntry();
  };
}

function renderSnowRemovalForm(main, headerHtml, pending, s, job){
  let clearedStatus = null;
  let conditionFlag = null;

  main.innerHTML = headerHtml + `
    <div class="card">
      ${hydrantPickerHtml(pending)}
      ${dupWarningHtml()}
      <div class="field"><label>Cleared?</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn" data-cleared="cleared">Cleared</button>
          <button type="button" class="toggle-btn" data-cleared="not_cleared">Not Cleared</button>
        </div>
      </div>
      <div class="field"><label>Also flag (optional — can combine with either above)</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn" data-flag="damaged">Damaged</button>
          <button type="button" class="toggle-btn" data-flag="oos">OOS</button>
        </div>
      </div>
      <div class="field" id="notesWrap" style="display:none;"><label>Notes</label><textarea id="f_notes" placeholder="What's the issue?"></textarea></div>
      <button class="primary" id="saveBtn">Save &amp; Continue</button>
    </div>`;

  document.getElementById('f_hydrant').addEventListener('change', (e)=>{ selectedHydrantId = e.target.value; wireDupWarning(selectedHydrantId, 'snow_removal'); });
  wireHydrantPicker((id)=> wireDupWarning(id, 'snow_removal'));

  function updateNotesVisibility(){
    document.getElementById('notesWrap').style.display = (clearedStatus==='not_cleared' || conditionFlag) ? 'block' : 'none';
  }
  main.querySelectorAll('[data-cleared]').forEach(btn=>{
    btn.onclick = ()=>{
      clearedStatus = btn.dataset.cleared;
      main.querySelectorAll('[data-cleared]').forEach(b=>{ b.classList.toggle('active', b===btn); b.classList.remove('good','bad'); });
      btn.classList.add(clearedStatus==='cleared' ? 'good' : 'bad');
      updateNotesVisibility();
    };
  });
  main.querySelectorAll('[data-flag]').forEach(btn=>{
    btn.onclick = ()=>{
      conditionFlag = (conditionFlag === btn.dataset.flag) ? null : btn.dataset.flag;
      main.querySelectorAll('[data-flag]').forEach(b=>{ b.classList.remove('active','bad'); });
      if(conditionFlag){ btn.classList.add('active','bad'); }
      updateNotesVisibility();
    };
  });

  document.getElementById('saveBtn').onclick = async ()=>{
    const hydrantId = selectedHydrantId || document.getElementById('f_hydrant').value;
    if(!hydrantId){ toast('Select a hydrant'); return; }
    if(!clearedStatus){ toast('Select Cleared or Not Cleared'); return; }
    const { error } = await sb.from('hydrant_tests').insert({
      session_id: s.id, hydrant_id: hydrantId,
      snow_cleared_status: clearedStatus, snow_condition_flag: conditionFlag,
      notes: document.getElementById('f_notes') ? (document.getElementById('f_notes').value || null) : null,
    });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Saved — ready for next one');
    renderHydrantEntry();
  };
}

function openEndShiftModal(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="card modal-card">
      <h3 style="margin-top:0;">End Shift</h3>
      <div class="hint" style="margin-bottom:10px;">This saves and pauses — the job stays open for the next crew.</div>
      <div class="field"><label>Current Time</label><input type="time" id="endTimeInput" value="${hh}:${mm}"></div>
      <div class="field" style="display:flex;align-items:flex-start;gap:8px;">
        <input type="checkbox" id="endConfirmCheck" style="width:auto;margin-top:3px;">
        <label for="endConfirmCheck" style="text-transform:none;font-weight:400;font-size:13.5px;color:var(--ink);">I confirm all hydrant data for this shift has been recorded.</label>
      </div>
      <button class="primary" id="confirmEndBtn">Confirm &amp; End Shift</button>
      <button class="secondary" id="cancelEndBtn">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  attachDatePicker('endTimeInput');
  document.getElementById('cancelEndBtn').onclick = ()=> overlay.remove();
  document.getElementById('confirmEndBtn').onclick = async ()=>{
    if(!document.getElementById('endConfirmCheck').checked){ toast('Please confirm all data has been recorded'); return; }
    const timeVal = document.getElementById('endTimeInput').value;
    const [h, m] = timeVal.split(':').map(Number);
    const endedAt = new Date(); endedAt.setHours(h, m, 0, 0);
    const s = state.activeSession;
    const startedAt = new Date(s.started_at);
    const totalMinutes = Math.max(0, Math.round((endedAt - startedAt) / 60000));
    const { error } = await sb.from('sessions').update({ ended_at: endedAt.toISOString(), status:'closed', total_minutes: totalMinutes }).eq('id', s.id);
    if(error){ toast('Error: ' + error.message); return; }
    localStorage.removeItem('lfd_active_session_id');
    state.activeSession = null; state.activeJob = null;
    overlay.remove();
    toast('Shift ended — job still open for the next crew');
    renderCompanyHome();
  };
}

async function renderDistrictChecklist(){
  const main = document.getElementById('main');
  main.innerHTML = `

      <h3 style="margin-top:0;">District Hydrant Checklist</h3>
      <div class="field"><label>Activity</label>
        <select id="chkActivity"><option value="flow_test">Flow Test</option><option value="condition_check">Condition Check</option><option value="snow_removal">Snow Removal</option></select>
      </div>
      <div id="chkList">Loading…</div>
      <button class="secondary" id="backBtn">← Back</button>
    </div>`;
  document.getElementById('backBtn').onclick = renderCompanyHome;

  async function load(){
    const activityType = document.getElementById('chkActivity').value;
    const { data } = await sb.from('hydrant_tests').select('hydrant_id, sessions(activity_type)');
    const doneIds = new Set((data||[]).filter(r => r.sessions && r.sessions.activity_type === activityType).map(r=>r.hydrant_id));
    const sorted = [...state.hydrants].sort((a,b)=> a.hydrant_number.localeCompare(b.hydrant_number, undefined, {numeric:true}));
    document.getElementById('chkList').innerHTML = sorted.map(h => {
      const compName = state.companies.find(c=>c.id===h.company_id)?.name || '—';

      return `<div class="checklist-row ${doneIds.has(h.id)?'done':''}">
        <span>${esc(h.hydrant_number)} — ${esc(h.address||'')} <span class="hint" style="display:inline;">(${esc(compName)} · ${esc(divName)})</span></span>
        <span class="checkmark ${doneIds.has(h.id)?'done':''}">${doneIds.has(h.id)?'✓':''}</span>

    }).join('');
  }
  document.getElementById('chkActivity').addEventListener('change', load);
  load();
}

function isAttentionRow(r){
  return r.condition === 'repair' || r.condition === 'oos' || r.wet_dry === 'wet' ||
    r.snow_cleared_status === 'not_cleared' || !!r.snow_condition_flag;
}
async function renderLog(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <div class="field"><label>Filter: Company</label>
        <select id="filt_company"><option value="">All</option>${state.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Filter: Status</label>
        <select id="filt_status">
          <option value="attention" selected>Needs Attention (default)</option>
          <option value="all">All</option>
          <option value="good">Good</option>
          <option value="repair">Needs Repair</option>
          <option value="oos">Out of Service</option>
          <option value="wet">Wet</option>
          <option value="dry">Dry</option>
          <option value="cleared">Cleared</option>
          <option value="not_cleared">Not Cleared</option>
          <option value="damaged">Damaged</option>
        </select>
      </div>
      <div class="field"><label>Search Hydrant #</label><input id="filt_search" placeholder="e.g. H-101"></div>
    </div>
    <div id="logList">Loading…</div>`;

  async function load(){
    const { data, error } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id)').order('tested_at', {ascending:false}).limit(150);
    if(error){ document.getElementById('logList').innerHTML = 'Error: '+esc(error.message); return; }
    const companyFilter = document.getElementById('filt_company').value;
    const statusFilter = document.getElementById('filt_status').value;
    const search = document.getElementById('filt_search').value.trim().toLowerCase();
    let rows = data || [];
    if(companyFilter) rows = rows.filter(r => r.hydrants && r.hydrants.company_id === companyFilter);
    if(search) rows = rows.filter(r => r.hydrants && r.hydrants.hydrant_number.toLowerCase().includes(search));
    if(statusFilter === 'attention') rows = rows.filter(isAttentionRow);
    else if(statusFilter === 'good') rows = rows.filter(r => r.condition === 'good');
    else if(statusFilter === 'repair') rows = rows.filter(r => r.condition === 'repair');
    else if(statusFilter === 'oos') rows = rows.filter(r => r.condition === 'oos');
    else if(statusFilter === 'wet') rows = rows.filter(r => r.wet_dry === 'wet');
    else if(statusFilter === 'dry') rows = rows.filter(r => r.wet_dry === 'dry');
    else if(statusFilter === 'cleared') rows = rows.filter(r => r.snow_cleared_status === 'cleared');
    else if(statusFilter === 'not_cleared') rows = rows.filter(r => r.snow_cleared_status === 'not_cleared');
    else if(statusFilter === 'damaged') rows = rows.filter(r => r.snow_condition_flag === 'damaged');

    document.getElementById('logList').innerHTML = rows.length ? rows.map(r => `
      <div class="entry" data-id="${r.id}">
        <div class="entry-top"><span>${esc(r.hydrants?.hydrant_number || '—')} · ${esc(r.hydrants?.address||'')}</span><span>${fmtDate(r.tested_at)}</span></div>
        ${r.condition ? `<span class="tag ${r.condition==='good'?'tag-good':'tag-bad'}">${r.condition==='good'?'Good':(r.condition==='repair'?'Needs Repair':'Out of Service')}</span>` : ''}
        ${r.wet_dry ? `<span class="tag ${r.wet_dry==='dry'?'tag-good':'tag-bad'}">${r.wet_dry==='dry'?'Dry':'Wet'}</span>` : ''}
        ${r.snow_cleared_status ? `<span class="tag ${r.snow_cleared_status==='cleared'?'tag-good':'tag-bad'}">${r.snow_cleared_status==='cleared'?'Cleared':'Not Cleared'}</span>` : ''}
        ${r.snow_condition_flag ? `<span class="tag tag-bad">${esc(r.snow_condition_flag)}</span>` : ''}
        <div style="margin-top:6px;font-size:13px;">${r.static_psi!=null ? `Static ${r.static_psi} · Residual ${r.residual_psi} · Flow ${r.flow_gpm??'—'} gpm · @20psi ${r.flow_at_20psi??'—'} gpm` : ''}</div>
        ${r.notes ? `<div style="font-size:12.5px;font-style:italic;color:var(--steel);margin-top:4px;">"${esc(r.notes)}"</div>` : ''}
      </div>`).join('') : '<div class="card">No matching entries.</div>';

    document.querySelectorAll('.entry').forEach(el=>{
      el.onclick = ()=> openEditLogEntryModal(el.dataset.id, load);
    });
  }
  ['filt_company','filt_status'].forEach(id => document.getElementById(id).addEventListener('change', load));
  document.getElementById('filt_search').addEventListener('input', load);
  load();
}

async function openEditLogEntryModal(entryId, onSaved){
  const { data: row } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number,address), sessions(activity_type)').eq('id', entryId).single();
  if(!row){ toast('Entry not found'); return; }
  const activityType = row.sessions?.activity_type || 'flow_test';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  let bodyHtml = '';
  if(activityType === 'snow_removal'){
    bodyHtml = `
      <div class="field"><label>Cleared?</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn ${row.snow_cleared_status==='cleared'?'active good':''}" data-cleared="cleared">Cleared</button>
          <button type="button" class="toggle-btn ${row.snow_cleared_status==='not_cleared'?'active bad':''}" data-cleared="not_cleared">Not Cleared</button>
        </div>
      </div>
      <div class="field"><label>Flag</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn ${row.snow_condition_flag==='damaged'?'active bad':''}" data-flag="damaged">Damaged</button>
          <button type="button" class="toggle-btn ${row.snow_condition_flag==='oos'?'active bad':''}" data-flag="oos">OOS</button>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="e_notes">${esc(row.notes||'')}</textarea></div>
    `;
  } else if(activityType === 'condition_check'){
    bodyHtml = `
      <div class="field"><label>Wet / Dry</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn ${row.wet_dry==='dry'?'active good':''}" data-wetdry="dry">Dry</button>
          <button type="button" class="toggle-btn ${row.wet_dry==='wet'?'active bad':''}" data-wetdry="wet">Wet</button>
        </div>
      </div>
      <div class="field"><label>Condition</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn ${row.condition==='good'?'active good':''}" data-cond="good">Good</button>
          <button type="button" class="toggle-btn ${row.condition==='repair'?'active bad':''}" data-cond="repair">Needs Repair</button>
          <button type="button" class="toggle-btn ${row.condition==='oos'?'active bad':''}" data-cond="oos">OOS</button>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="e_notes">${esc(row.notes||'')}</textarea></div>
    `;
  } else {
    bodyHtml = `
      <div class="row3">
        <div class="field"><label>Static</label><input type="number" id="e_static" value="${row.static_psi??''}"></div>
        <div class="field"><label>Residual</label><input type="number" id="e_residual" value="${row.residual_psi??''}"></div>
        <div class="field"><label>Pitot</label><input type="number" id="e_pitot" value="${row.pitot_psi??''}"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Outlet</label><input type="number" id="e_orifice" value="${row.orifice_diameter??2.5}"></div>
        <div class="field"><label>Coef.</label><input type="number" id="e_coeff" value="${row.discharge_coeff??0.9}"></div>
        <div class="field"><label># Outlets</label><input type="number" id="e_outlets" value="${row.num_outlets??1}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Condition</label>
          <select id="e_condition"><option value="good" ${row.condition==='good'?'selected':''}>Good</option><option value="repair" ${row.condition==='repair'?'selected':''}>Needs Repair</option><option value="oos" ${row.condition==='oos'?'selected':''}>OOS</option></select>
        </div>
        <div class="field"><label>Wet/Dry</label>
          <select id="e_wetdry"><option value="dry" ${row.wet_dry==='dry'?'selected':''}>Dry</option><option value="wet" ${row.wet_dry==='wet'?'selected':''}>Wet</option></select>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="e_notes">${esc(row.notes||'')}</textarea></div>
    `;
  }

  overlay.innerHTML = `
    <div class="card modal-card">
      <h3 style="margin-top:0;">Edit Entry — ${esc(row.hydrants?.hydrant_number)}</h3>
      <div class="hint" style="margin-bottom:10px;">${esc(row.hydrants?.address||'')} · ${esc(ACTIVITY_LABELS[activityType])} · ${fmtDate(row.tested_at)}</div>
      ${bodyHtml}
      <button class="primary" id="saveEditBtn">Save Changes</button>
      <button class="secondary" id="cancelEditBtn">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cancelEditBtn').onclick = ()=> overlay.remove();

  let editCleared = row.snow_cleared_status, editFlag = row.snow_condition_flag;
  let editWetDry = row.wet_dry, editCond = row.condition;
  overlay.querySelectorAll('[data-cleared]').forEach(btn=>{
    btn.onclick = ()=>{ editCleared = btn.dataset.cleared; overlay.querySelectorAll('[data-cleared]').forEach(b=>{b.classList.toggle('active',b===btn);b.classList.remove('good','bad');}); btn.classList.add(editCleared==='cleared'?'good':'bad'); };
  });
  overlay.querySelectorAll('[data-flag]').forEach(btn=>{
    btn.onclick = ()=>{ editFlag = (editFlag===btn.dataset.flag)?null:btn.dataset.flag; overlay.querySelectorAll('[data-flag]').forEach(b=>b.classList.remove('active','bad')); if(editFlag) btn.classList.add('active','bad'); };
  });
  if(activityType === 'condition_check'){
    overlay.querySelectorAll('[data-wetdry]').forEach(btn=>{
      btn.onclick = ()=>{ editWetDry = btn.dataset.wetdry; overlay.querySelectorAll('[data-wetdry]').forEach(b=>{b.classList.toggle('active',b===btn);b.classList.remove('good','bad');}); btn.classList.add(editWetDry==='dry'?'good':'bad'); };
    });
    overlay.querySelectorAll('[data-cond]').forEach(btn=>{
      btn.onclick = ()=>{ editCond = btn.dataset.cond; overlay.querySelectorAll('[data-cond]').forEach(b=>{b.classList.toggle('active',b===btn);b.classList.remove('good','bad');}); btn.classList.add(editCond==='good'?'good':'bad'); };
    });
  }

  document.getElementById('saveEditBtn').onclick = async ()=>{
    let updatePayload = { notes: document.getElementById('e_notes').value || null };
    if(activityType === 'snow_removal'){
      updatePayload.snow_cleared_status = editCleared;
      updatePayload.snow_condition_flag = editFlag;
    } else if(activityType === 'condition_check'){
      updatePayload.wet_dry = editWetDry;
      updatePayload.condition = editCond;
    } else {
      const P = parseFloat(document.getElementById('e_pitot').value);
      const d = parseFloat(document.getElementById('e_orifice').value);
      const C = parseFloat(document.getElementById('e_coeff').value) || 0.9;
      const n = parseFloat(document.getElementById('e_outlets').value) || 1;
      const hs = parseFloat(document.getElementById('e_static').value);
      const hr = parseFloat(document.getElementById('e_residual').value);
      let flow=null, drop=null, flow20=null;
      if(!isNaN(P) && !isNaN(d) && P>0 && d>0) flow = 29.83 * C * d*d * Math.sqrt(P) * n;
      if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
      if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
      updatePayload = {
        ...updatePayload,
        static_psi: document.getElementById('e_static').value || null,
        residual_psi: document.getElementById('e_residual').value || null,
        pitot_psi: document.getElementById('e_pitot').value || null,
        orifice_diameter: document.getElementById('e_orifice').value || null,
        discharge_coeff: document.getElementById('e_coeff').value || null,
        num_outlets: document.getElementById('e_outlets').value || null,
        flow_gpm: flow!==null ? Math.round(flow) : null,
        drop_pct: drop!==null ? drop.toFixed(1) : null,
        flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
        condition: document.getElementById('e_condition').value,
        wet_dry: document.getElementById('e_wetdry').value,
      };
    }
    const { error } = await sb.from('hydrant_tests').update(updatePayload).eq('id', entryId);
    if(error){ toast('Error: ' + error.message); return; }
    toast('Entry updated');
    overlay.remove();
    if(onSaved) onSaved();
  };
}

// STATS — operational/time focus (Campaigns/Reports cover condition rollups)
// ============================================================
async function renderStats(){
  const main = document.getElementById('main');
  main.innerHTML = 'Loading…';
  const [{data: tests}, {data: sessions}, {data: hydrants}] = await Promise.all([
    sb.from('hydrant_tests').select('*'),
    sb.from('sessions').select('*'),
    sb.from('hydrants').select('*').eq('active', true),
  ]);
  const t = tests || [], s = sessions || [], h = hydrants || [];
  const now = new Date();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  const weekShifts = s.filter(x => new Date(x.started_at) >= startOfWeek);
  const monthShifts = s.filter(x => new Date(x.started_at) >= startOfMonth);
  const weekMinutes = weekShifts.reduce((sum,x)=>sum+(x.total_minutes||0),0);
  const monthMinutes = monthShifts.reduce((sum,x)=>sum+(x.total_minutes||0),0);
  const weekEntries = t.filter(x => new Date(x.tested_at) >= startOfWeek).length;
  const todayStr = now.toISOString().slice(0,10);
  const todayEntries = t.filter(x => x.tested_at && x.tested_at.slice(0,10) === todayStr).length;

  const lastTestByHydrant = {};
  t.forEach(x => {
    const cur = lastTestByHydrant[x.hydrant_id];
    if(!cur || new Date(x.tested_at) > new Date(cur)) lastTestByHydrant[x.hydrant_id] = x.tested_at;
  });
  const overdue = h.filter(hy => {
    const last = lastTestByHydrant[hy.id];
    if(!last) return true;
    const months = hy.retest_interval_months || 12;
    const dueDate = new Date(last); dueDate.setMonth(dueDate.getMonth() + months);
    return dueDate < now;
  });

  // Hours by company (this month)
  const hoursByCompany = {};
  monthShifts.forEach(sess => {
    const name = state.companies.find(c=>c.id===sess.company_id)?.name || 'Unknown';
    hoursByCompany[name] = (hoursByCompany[name]||0) + (sess.total_minutes||0);
  });
  const hoursRows = Object.entries(hoursByCompany).sort((a,b)=>b[1]-a[1]).slice(0,10);

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">This Week</h3>
      <div class="stat-grid">
        <div class="stat"><div class="n">${weekShifts.length}</div><div class="l">Shifts</div></div>
        <div class="stat"><div class="n">${Math.round(weekMinutes/60)}</div><div class="l">Hours</div></div>
        <div class="stat"><div class="n">${weekEntries}</div><div class="l">Entries Logged</div></div>
        <div class="stat"><div class="n">${todayEntries}</div><div class="l">Logged Today</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">This Month</h3>
      <div class="stat-grid">
        <div class="stat"><div class="n">${monthShifts.length}</div><div class="l">Shifts</div></div>
        <div class="stat"><div class="n">${Math.round(monthMinutes/60)}</div><div class="l">Hours</div></div>
        <div class="stat"><div class="n overdue">${overdue.length}</div><div class="l">Hydrants Overdue</div></div>
        <div class="stat"><div class="n">${t.length}</div><div class="l">All-Time Entries</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Hours by Company (this month)</h3>
      ${hoursRows.length ? `<table class="report"><thead><tr><th>Company</th><th>Hours</th></tr></thead><tbody>${hoursRows.map(([name,mins])=>`<tr><td>${esc(name)}</td><td>${(mins/60).toFixed(1)}</td></tr>`).join('')}</tbody></table>` : '<div class="hint">No shifts logged this month yet.</div>'}
    </div>
    ${overdue.length ? `<div class="card"><b>Overdue for retest:</b><br>${overdue.map(hy=>esc(hy.hydrant_number)).join(', ')}</div>` : ''}
  `;
}

let campaignYearFilter = '';
let campaignActivityFilter = '';

async function renderCampaignsTab(){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const { data: campaigns } = await sb.from('campaigns').select('*').order('created_at', {ascending:false});
  const all = campaigns || [];
  const years = [...new Set(all.map(c => new Date(c.created_at).getFullYear()))].sort((a,b)=>b-a);

  let filtered = all;
  if(campaignYearFilter) filtered = filtered.filter(c => new Date(c.created_at).getFullYear() === parseInt(campaignYearFilter));
  if(campaignActivityFilter) filtered = filtered.filter(c => c.activity_type === campaignActivityFilter);

  const open = filtered.filter(c=>c.status==='open');
  const closed = filtered.filter(c=>c.status==='closed');

  main.innerHTML = `
    <div class="card">
      <div class="row2">
        <div class="field"><label>Year</label><select id="yearFilter"><option value="">All</option>${years.map(y=>`<option value="${y}" ${campaignYearFilter==String(y)?'selected':''}>${y}</option>`).join('')}</select></div>
        <div class="field"><label>Activity</label><select id="activityFilter"><option value="">All</option><option value="flow_test" ${campaignActivityFilter==='flow_test'?'selected':''}>Flow Test</option><option value="condition_check" ${campaignActivityFilter==='condition_check'?'selected':''}>Condition Check</option><option value="snow_removal" ${campaignActivityFilter==='snow_removal'?'selected':''}>Snow Removal</option></select></div>
      </div>
    </div>
    <div class="card"><h3 style="margin-top:0;">Open Campaigns</h3>
      ${open.length===0 ? '<div class="hint">None open right now.</div>' : open.map(c=>`
        <div class="job-row" data-campaign="${c.id}" style="cursor:pointer;">
          <div class="jt">${esc(c.name)}</div>
          <div class="jm">${esc(ACTIVITY_LABELS[c.activity_type])} · started ${fmtDate(c.created_at)}</div>
        </div>`).join('')}
    </div>
    <div class="card"><h3 style="margin-top:0;">Closed Campaigns</h3>
      ${closed.length===0 ? '<div class="hint">None yet.</div>' : closed.map(c=>`
        <div class="job-row" data-campaign="${c.id}" style="cursor:pointer;">
          <div class="jt">${esc(c.name)}</div>
          <div class="jm">Closed ${fmtDate(c.closed_at)}</div>
        </div>`).join('')}
    </div>
  `;
  document.getElementById('yearFilter').addEventListener('change', (e)=>{ campaignYearFilter = e.target.value; renderCampaignsTab(); });
  document.getElementById('activityFilter').addEventListener('change', (e)=>{ campaignActivityFilter = e.target.value; renderCampaignsTab(); });
  main.querySelectorAll('[data-campaign]').forEach(row=>{ row.onclick = ()=> renderCampaignDetail(row.dataset.campaign); });
}

async function renderCampaignDetail(campaignId){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const { data: campaign } = await sb.from('campaigns').select('*').eq('id', campaignId).single();
  const { data: jobs } = await sb.from('jobs').select('*').eq('campaign_id', campaignId);
  const cutoff = new Date(campaign.created_at);

  // Every company/division pair with hydrants — not just ones that have started
  const pairsMap = new Map();
  state.hydrants.forEach(h => {
    if(!h.company_id || !h.division_id) return;
    const key = h.company_id + '|' + h.division_id;
    if(!pairsMap.has(key)) pairsMap.set(key, { companyId: h.company_id, divisionId: h.division_id });
  });

  let totalHydrants = 0, totalDone = 0;
  const rows = [];
  for(const { companyId, divisionId } of pairsMap.values()){
    const { pending, total, completedCount } = await computeCompletionForCompanyDivision(companyId, divisionId, campaign.activity_type, cutoff);
    totalHydrants += total; totalDone += completedCount;
    const job = (jobs||[]).find(j => j.company_id === companyId && j.division_id === divisionId);
    const compName = state.companies.find(c=>c.id===companyId)?.name || '—';
    const divName = state.divisions.find(d=>d.id===divisionId)?.name || '—';
    rows.push({ compName, divName, total, completedCount, pct: total ? Math.round(completedCount/total*100) : 0, status: job ? job.status : 'not started' });
  }
  rows.sort((a,b)=> a.compName.localeCompare(b.compName) || a.divName.localeCompare(b.divName));
  const overallPct = totalHydrants ? Math.round(totalDone/totalHydrants*100) : 0;

  const jobIds = (jobs||[]).map(j=>j.id);
  const { data: sessionIds } = jobIds.length ? await sb.from('sessions').select('id').in('job_id', jobIds) : { data: [] };
  const sIds = (sessionIds||[]).map(s=>s.id);
  const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  const { data: recentTests } = sIds.length ? await sb.from('hydrant_tests').select('hydrant_id, tested_at').in('session_id', sIds).gte('tested_at', sevenDaysAgo) : { data: [] };
  const thisWeekCount = new Set((recentTests||[]).map(r=>r.hydrant_id)).size;

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">${esc(campaign.name)}</h3>
      <div class="hint">${esc(ACTIVITY_LABELS[campaign.activity_type])} · ${campaign.status === 'open' ? 'Open' : 'Closed'} · started ${fmtDate(campaign.created_at)}</div>
      <div class="progress-bar"><div class="fill" style="width:${overallPct}%;"></div></div>
      <div style="font-size:14px;font-weight:700;">${overallPct}% complete (${totalDone} of ${totalHydrants} hydrants) · ${thisWeekCount} tested this week</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="small" id="renameBtn">Rename</button>
        ${campaign.status==='open' ? '<button class="small danger" id="closeCampBtn">Close Campaign</button>' : '<button class="small ok" id="reopenCampBtn">Reopen Campaign</button>'}
        <button class="small neutral" id="viewReportBtn">View in Reports</button>
        <button class="small neutral" id="backBtn">← Back</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">By Company / Division</h3>
      <table class="report"><thead><tr><th>Company</th><th>Division</th><th>Complete</th><th>%</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.compName)}</td><td>${esc(r.divName)}</td><td>${r.completedCount}/${r.total}</td><td>${r.pct}%</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table>
    </div>`;

  document.getElementById('backBtn').onclick = renderCampaignsTab;
  document.getElementById('viewReportBtn').onclick = ()=>{
    reportActivityFilter = campaign.activity_type;
    reportSelectedCompanyIds = new Set(rows.map(r => state.companies.find(c=>c.name===r.compName)?.id).filter(Boolean));
    state.tab = 'reports';
    renderChiefShell();
  };
  document.getElementById('renameBtn').onclick = async ()=>{
    const newName = prompt('Campaign name:', campaign.name);
    if(newName && newName.trim()){
      await sb.from('campaigns').update({ name: newName.trim() }).eq('id', campaignId);
      renderCampaignDetail(campaignId);
    }
  };
  const closeBtn = document.getElementById('closeCampBtn');
  if(closeBtn) closeBtn.onclick = async ()=>{
    if(!confirm('Close this campaign?')) return;
    await sb.from('campaigns').update({ status:'closed', closed_at: new Date().toISOString() }).eq('id', campaignId);
    renderCampaignDetail(campaignId);
  };
  const reopenBtn = document.getElementById('reopenCampBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{
    await sb.from('campaigns').update({ status:'open', closed_at:null }).eq('id', campaignId);
    renderCampaignDetail(campaignId);
  };
}

function getReportHydrants(){
  let hydrants = state.hydrants;
  if(reportSelectedCompanyIds.size > 0) hydrants = hydrants.filter(h => reportSelectedCompanyIds.has(h.company_id));
  return hydrants;
}

async function loadReportData(){
  const summaryEl = document.getElementById('reportSummary');
  const tableCard = document.getElementById('reportTableCard');
  summaryEl.innerHTML = 'Loading…';
  tableCard.style.display = 'none';

  const hydrants = getReportHydrants();
  const ids = hydrants.map(h=>h.id);
  const { data: tests } = ids.length ? await sb.from('hydrant_tests').select('*, sessions(activity_type)').in('hydrant_id', ids) : { data: [] };
  const relevant = (tests||[]).filter(t => t.sessions && t.sessions.activity_type === reportActivityFilter);
  const latestByHydrant = {};
  relevant.sort((a,b)=> new Date(b.tested_at) - new Date(a.tested_at)).forEach(t => { if(!latestByHydrant[t.hydrant_id]) latestByHydrant[t.hydrant_id] = t; });

  let rows = hydrants.map(h => {
    const t = latestByHydrant[h.id];
    const divName = state.divisions.find(d=>d.id===h.division_id)?.name || '—';
    const compName = state.companies.find(c=>c.id===h.company_id)?.name || '—';
    const flagged = t && (t.condition==='repair' || t.condition==='oos' || t.snow_condition_flag || t.snow_cleared_status==='not_cleared' || t.wet_dry==='wet');
    return {
      hydrant_number: h.hydrant_number, address: h.address||'', company: compName, division: divName,
      condition: t?.condition || (t?.snow_cleared_status || ''), wet_dry: t?.wet_dry || '',
      flag: t?.snow_condition_flag || '', flow: t?.flow_gpm ?? '', static_psi: t?.static_psi ?? '',
      residual: t?.residual_psi ?? '', last_tested: t?.tested_at ? fmtDate(t.tested_at) : 'Never',
      flagged, wet: t?.wet_dry === 'wet',
    };
  });
  const totalCount = rows.length;
  const flaggedCount = rows.filter(r=>r.flagged).length;
  const wetCount = rows.filter(r=>r.wet).length;
  const neverTested = rows.filter(r=>r.last_tested==='Never').length;

  summaryEl.innerHTML = `
    <h3 style="margin-top:0;">Summary — ${esc(ACTIVITY_LABELS[reportActivityFilter])}</h3>
    <div class="stat-grid">
      <div class="stat"><div class="n">${totalCount}</div><div class="l">Hydrants in Scope</div></div>
      <div class="stat"><div class="n overdue">${flaggedCount}</div><div class="l">Flagged</div></div>
      <div class="stat"><div class="n">${wetCount}</div><div class="l">Wet</div></div>
      <div class="stat"><div class="n">${neverTested}</div><div class="l">Never Tested</div></div>
    </div>
  `;

  if(reportFlaggedOnly) rows = rows.filter(r => r.flagged);
  const showTable = reportFlaggedOnly || reportSelectedCompanyIds.size > 0 || rows.length <= 150;
  if(!showTable){
    summaryEl.innerHTML += `<div class="hint" style="margin-top:10px;">Select specific companies or "Flagged only" to see the row-by-row table — use Export below for the complete list.</div>`;
    return;
  }

  rows.sort((a,b)=>{
    const av = a[reportSort.field], bv = b[reportSort.field];
    const cmp = String(av).localeCompare(String(bv), undefined, {numeric:true});
    return reportSort.dir === 'asc' ? cmp : -cmp;
  });

  const cols = reportActivityFilter === 'flow_test'
    ? [['hydrant_number','Hydrant'],['address','Address'],['company','Company'],['division','Division'],['condition','Condition'],['wet_dry','Wet/Dry'],['flow','Flow'],['static_psi','Static'],['residual','Residual'],['last_tested','Last Tested']]
    : [['hydrant_number','Hydrant'],['address','Address'],['company','Company'],['division','Division'],['condition','Status'],['flag','Flag'],['last_tested','Last Tested']];

  tableCard.style.display = 'block';
  document.getElementById('reportTable').innerHTML = `
    <table class="report"><thead><tr>${cols.map(([f,l])=>`<th data-sort="${f}">${esc(l)}${reportSort.field===f ? (reportSort.dir==='asc'?' ▲':' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(([f])=>`<td>${esc(r[f])}</td>`).join('')}</tr>`).join('')}</tbody></table>
    ${rows.length===0 ? '<div class="hint">No hydrants match.</div>' : ''}
  `;
  document.querySelectorAll('[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      if(reportSort.field === th.dataset.sort) reportSort.dir = reportSort.dir === 'asc' ? 'desc' : 'asc';
      else { reportSort.field = th.dataset.sort; reportSort.dir = 'asc'; }
      loadReportData();
    };
  });
}

function getFilteredExportRows(){
  return { from: document.getElementById('csv_from').value, to: document.getElementById('csv_to').value,
    wetDry: document.getElementById('csv_wetdry').value, status: document.getElementById('csv_status').value };
}

async function fetchExportRows(){
  const { from, to, wetDry, status } = getFilteredExportRows();
  const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id, division_id), sessions(activity_type, session_date, company_id, division_id)');
  let rows = data || [];
  if(from) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) >= from);
  if(to) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) <= to);
  if(reportSelectedCompanyIds.size > 0) rows = rows.filter(r => reportSelectedCompanyIds.has(r.hydrants?.company_id));
  if(reportActivityFilter) rows = rows.filter(r => r.sessions?.activity_type === reportActivityFilter);
  if(wetDry) rows = rows.filter(r => r.wet_dry === wetDry);
  if(status) rows = rows.filter(r => r.condition === status || r.snow_cleared_status === status || r.snow_condition_flag === status);
  return rows;
}

async function generateCustomCsv(){
  const rows = await fetchExportRows();
  if(!rows.length){ toast('No matching data'); return; }
  const headers = ['Hydrant','Address','Company','Division','Activity','Date','Static','Residual','Pitot','Flow','Drop%','Flow@20psi','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
  const out = rows.map(r => {
    const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
    const divName = state.divisions.find(d=>d.id===r.hydrants?.division_id)?.name || '';
    return [r.hydrants?.hydrant_number, r.hydrants?.address, compName, divName, ACTIVITY_LABELS[r.sessions?.activity_type] || '',
      fmtDate(r.tested_at), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.drop_pct, r.flow_at_20psi,
      r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes];
  });
  const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [headers.join(','), ...out.map(r=>r.map(esc2).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hydrant-report-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

async function generateCustomPdf(){
  const rows = await fetchExportRows();
  if(!rows.length){ toast('No matching data'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  doc.setFontSize(16);
  doc.text('Lynn Fire Department — Hydrant Report', 14, 16);
  doc.setFontSize(10);
  doc.text('Generated ' + fmtDate(new Date()) + '  ·  ' + rows.length + ' records', 14, 23);

  const headers = ['Hydrant','Address','Company','Division','Activity','Date','Condition','Wet/Dry','Flow (gpm)','Notes'];
  const body = rows.map(r => {
    const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
    const divName = state.divisions.find(d=>d.id===r.hydrants?.division_id)?.name || '';
    const cond = r.condition || r.snow_cleared_status || '';
    return [r.hydrants?.hydrant_number||'', r.hydrants?.address||'', compName, divName,
      ACTIVITY_LABELS[r.sessions?.activity_type]||'', fmtDate(r.tested_at), cond, r.wet_dry||'', r.flow_gpm??'', r.notes||''];
  });
  doc.autoTable({ head: [headers], body, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: [26,26,26] } });
  doc.save('hydrant-report-'+new Date().toISOString().slice(0,10)+'.pdf');
  toast('PDF downloaded');
}

  document.getElementById('addCompanyBtn').onclick = async ()=>{
    const name = document.getElementById('newCompanyName').value.trim();
    const code = document.getElementById('newCompanyCode').value.trim();
    const isChief = document.getElementById('newCompanyChief').checked;
    if(!name || !code){ toast('Enter a name and login code'); return; }
    const { error } = await sb.from('companies').insert({ name, access_code: code, is_chief: isChief });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Company added');
    await loadRefData();
    renderSettingsTab();
  };
  document.getElementById('exportBtn').onclick = async ()=>{
    const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number,address)');
    if(!data || !data.length){ toast('No data yet'); return; }
    const headers = ['Hydrant','Address','Date','Static','Residual','Pitot','Flow','Drop%','Flow@20psi','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
    const rows = data.map(r=>[r.hydrants?.hydrant_number, r.hydrants?.address, fmtDate(r.tested_at), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.drop_pct, r.flow_at_20psi, r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes]);
    const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const csv = [headers.join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hydrant-backup-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
}

init();
</script>
</body>
</html>
