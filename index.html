async function renderCampaignDetail(campaignId){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const { data: campaign } = await sb.from('campaigns').select('*').eq('id', campaignId).single();
  const { data: jobs } = await sb.from('jobs').select('*').eq('campaign_id', campaignId);
  const cutoff = new Date(campaign.created_at);
  const eligibleCompanyIds = (campaign.company_ids && campaign.company_ids.length) ? new Set(campaign.company_ids) : null;

  const pairsMap = new Map();
  state.hydrants.forEach(h => {
    if(!h.company_id || !h.block) return;
    if(eligibleCompanyIds && !eligibleCompanyIds.has(h.company_id)) return;
    const key = h.company_id + '|' + h.block;
    if(!pairsMap.has(key)) pairsMap.set(key, { companyId: h.company_id, block: h.block });
  });

  let totalHydrants = 0, totalDone = 0;
  const rows = [];
  for(const { companyId, block } of pairsMap.values()){
    const { total, completedCount } = await computeCompletionForCompanyBlock(companyId, block, campaign.activity_type, cutoff);
    totalHydrants += total; totalDone += completedCount;
    const job = (jobs||[]).find(j => j.company_id === companyId && j.block === block);
    const compName = state.companies.find(c=>c.id===companyId)?.name || '—';
    rows.push({ compName, block, total, completedCount, pct: total ? Math.round(completedCount/total*100) : 0, status: job ? job.status : 'not started' });
  }
  rows.sort((a,b)=> compareCompanyNames(a.compName,b.compName) || a.block.localeCompare(b.block));
  const overallPct = totalHydrants ? Math.round(totalDone/totalHydrants*100) : 0;

  const jobIds = (jobs||[]).map(j=>j.id);
  const { data: sessionIds } = jobIds.length ? await sb.from('sessions').select('id').in('job_id', jobIds) : { data: [] };
  const sIds = (sessionIds||[]).map(s=>s.id);
  const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  const { data: recentTests } = sIds.length ? await sb.from('hydrant_tests').select('hydrant_id, tested_at').in('session_id', sIds).gte('tested_at', sevenDaysAgo) : { data: [] };
  const thisWeekCount = new Set((recentTests||[]).map(r=>r.hydrant_id)).size;

  main.innerHTML = backBar('All Campaigns', 'topBackBtn') + `
    <div class="card">
      <h3 style="margin-top:0;">${esc(campaign.name)}</h3>
      <div class="hint">${esc(ACTIVITY_LABELS[campaign.activity_type])} · ${campaign.status === 'open' ? 'Open' : 'Closed ' + fmtDate(campaign.closed_at)} · started ${fmtDate(campaign.created_at)}</div>
      <div class="progress-bar"><div class="fill" style="width:${overallPct}%;"></div></div>
      <div style="font-size:14px;font-weight:700;">${overallPct}% complete (${totalDone} of ${totalHydrants} hydrants) · ${thisWeekCount} tested this week</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="small" id="editCampBtn">Edit</button>
        ${campaign.status==='open' ? '<button class="small danger" id="closeCampBtn">Close Campaign</button>' : '<button class="small ok" id="reopenCampBtn">Reopen Campaign</button>'}
        <button class="small neutral" id="exportCsvBtn">Export Excel</button>
        <button class="small neutral" id="exportPdfBtn">Export PDF</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">By Company / List</h3>
      <table class="report"><thead><tr><th>Company</th><th>List</th><th>Complete</th><th>%</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.compName)}</td><td>${esc(r.block)}</td><td>${r.completedCount}/${r.total}</td><td>${r.pct}%</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table>
    </div>`;

  document.getElementById('topBackBtn').onclick = renderCampaignsTab;
  document.getElementById('editCampBtn').onclick = ()=> openCampaignFormModal(campaign, ()=>renderCampaignDetail(campaignId));
  const closeBtn = document.getElementById('closeCampBtn');
  if(closeBtn) closeBtn.onclick = async ()=>{
    if(!confirm('Close this campaign? End date will be set to the last actual hydrant entry.')) return;
    await closeCampaignWithComputedEndDate(campaignId);
    renderCampaignDetail(campaignId);
  };
  const reopenBtn = document.getElementById('reopenCampBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{
    await sb.from('campaigns').update({ status:'open', closed_at:null }).eq('id', campaignId);
    renderCampaignDetail(campaignId);
  };

  async function getCampaignScopedRows(){
    const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id, block), sessions(activity_type)');
    return (data||[]).filter(r => r.sessions && r.sessions.activity_type === campaign.activity_type && new Date(r.tested_at) >= cutoff
      && (!eligibleCompanyIds || eligibleCompanyIds.has(r.hydrants?.company_id)));
  }
  document.getElementById('exportCsvBtn').onclick = async ()=>{
    const rows = await getCampaignScopedRows();
    if(!rows.length){ toast('No data to export'); return; }
    const headerBlock = [
      [`Campaign Report: ${campaign.name}`],
      [`Activity: ${ACTIVITY_LABELS[campaign.activity_type]} | Started: ${fmtDate(campaign.created_at)} | Status: ${campaign.status==='open'?'Open':'Closed '+fmtDate(campaign.closed_at)}`],
      [`Generated: ${fmtDate(new Date())} | ${rows.length} records`],
      [],
    ];
    const headers = ['Hydrant','Address','Company','List','Date','Static','Residual','Pitot','Flow','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
    const out = rows.map(r => {
      const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
      const divName = r.hydrants?.block || '';
      return [r.hydrants?.hydrant_number, r.hydrants?.address, compName, divName, fmtDate(r.tested_at), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes];
    });
    downloadXlsx('campaign-'+campaignId.slice(0,8)+'.xlsx', headerBlock, headers, out);
  };
  document.getElementById('exportPdfBtn').onclick = async ()=>{
    const rows = await getCampaignScopedRows();
    if(!rows.length){ toast('No data to export'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(16); doc.text(campaign.name, 14, 16);
    doc.setFontSize(10); doc.text('Generated ' + fmtDate(new Date()) + '  ·  ' + rows.length + ' records', 14, 23);
    const headers = ['Hydrant','Address','Company','List','Date','Condition','Wet/Dry','Notes'];
    const body = rows.map(r => {
      const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
      const divName = r.hydrants?.block || '';
      const cond = r.condition || r.snow_cleared_status || '';
      return [r.hydrants?.hydrant_number||'', r.hydrants?.address||'', compName, divName, fmtDate(r.tested_at), cond, r.wet_dry||'', r.notes||''];
    });
    doc.autoTable({ head: [headers], body, startY: 28, styles:{fontSize:8}, headStyles:{fillColor:[26,26,26]} });
    doc.save('campaign-'+campaignId.slice(0,8)+'.pdf');
    toast('PDF downloaded');
  };
}

// CHIEF: REPORTS — lean condition report. Click companies to add/

let reportStatusToggles = new Set(); // 'good' | 'damaged' | 'oos', empty = all

        ${available.map(c=>`<div class="chip" data-add="${c.id}">+ ${esc(c.name)}</div>`).join('') || '<div class="hint">All companies selected.</div>'}
      </div>
      <div class="field"><label>Selected (${reportSelectedCompanyIds.length ? reportSelectedCompanyIds.length : 'All'})</label>
        <div class="chip-grid" id="selectedChips" style="min-height:34px;border:1.5px dashed var(--line);border-radius:6px;padding:8px;">
          ${reportSelectedCompanyIds.length ? reportSelectedCompanyIds.map(id=>{
            const c = state.companies.find(x=>x.id===id);

      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Condition</h3>
      <div class="chip-grid">
        <div class="chip ${reportStatusToggles.size===0?'active':''}" data-cond-all="1">All</div>
        <div class="chip ${reportStatusToggles.has('good')?'active':''}" data-cond="good">Good</div>
        <div class="chip ${reportStatusToggles.has('damaged')?'active':''}" data-cond="damaged">Damaged</div>
        <div class="chip ${reportStatusToggles.has('oos')?'active':''}" data-cond="oos">Out of Service</div>
        <div class="chip ${reportStatusToggles.has('wet')?'active':''}" data-cond="wet">Wet</div>
      </div>
      <div class="hint">Wet combines with any status selected above (e.g. Damaged + Wet) rather than replacing it.</div>
    </div>
    <div class="card" id="reportSummary">Loading…</div>
    <div class="card">
      <button class="primary" id="reportCsvBtn">Generate Excel</button>
      <button class="secondary" id="reportPdfBtn">Generate PDF</button>
    </div>`;

  main.querySelectorAll('[data-add]').forEach(el=>{
    el.onclick = ()=>{ reportSelectedCompanyIds.push(el.dataset.add); renderReportsTab(); };
  });
  main.querySelectorAll('[data-remove]').forEach(el=>{
    el.onclick = ()=>{ reportSelectedCompanyIds = reportSelectedCompanyIds.filter(id=>id!==el.dataset.remove); renderReportsTab(); };
  });
  main.querySelector('[data-cond-all]').onclick = ()=>{ reportStatusToggles = new Set(); renderReportsTab(); };
  main.querySelectorAll('[data-cond]').forEach(el=>{
    el.onclick = ()=>{
      const v = el.dataset.cond;
      if(reportStatusToggles.has(v)) reportStatusToggles.delete(v); else reportStatusToggles.add(v);
      renderReportsTab();
    };
  });
  document.getElementById('reportCsvBtn').onclick = generateConditionReportCsv;
  document.getElementById('reportPdfBtn').onclick = generateConditionReportPdf;

  loadReportSummary();
}

function getReportHydrants(){
  let hydrants = state.hydrants;
  if(reportSelectedCompanyIds.length > 0) hydrants = hydrants.filter(h => reportSelectedCompanyIds.includes(h.company_id));
  return hydrants;
}

async function buildConditionReportRows(){
  const hydrants = getReportHydrants();
  const allTests = await fetchAllHydrantTestsWithSession();
  const byHydrant = {};
  allTests.forEach(t => { (byHydrant[t.hydrant_id] = byHydrant[t.hydrant_id] || []).push(t); });

  let rows = hydrants.map(h => {
    const tests = byHydrant[h.id] || [];
    const statusInfo = computeHydrantStatus(tests);
    const wetDryTest = tests.find(t => t.wet_dry); // tests are newest-first already
    const lastChecked = tests[0] ? tests[0].tested_at : null;
    return { hydrant_number: h.hydrant_number, address: h.address || '', status: statusInfo.status, wetDry: wetDryTest ? wetDryTest.wet_dry : null, lastChecked };
  });
  const statusFilters = [...reportStatusToggles].filter(v => v !== 'wet');
  if(statusFilters.length > 0) rows = rows.filter(r => statusFilters.includes(r.status));
  if(reportStatusToggles.has('wet')) rows = rows.filter(r => r.wetDry === 'wet');
  rows.sort((a,b)=> a.hydrant_number.localeCompare(b.hydrant_number, undefined, {numeric:true}));
  return rows;
}

async function loadReportSummary(){
  const summaryEl = document.getElementById('reportSummary');
  summaryEl.innerHTML = 'Loading…';
  const rows = await buildConditionReportRows();
  const good = rows.filter(r=>r.status==='good').length;
  const damaged = rows.filter(r=>r.status==='damaged').length;
  const oos = rows.filter(r=>r.status==='oos').length;
  const wet = rows.filter(r=>r.wetDry==='wet').length;
  summaryEl.innerHTML = `
    <h3 style="margin-top:0;">Summary</h3>
    <div class="stat-grid">
      <div class="stat"><div class="n">${rows.length}</div><div class="l">Hydrants in Scope</div></div>
      <div class="stat"><div class="n">${good}</div><div class="l">Good</div></div>
      <div class="stat"><div class="n overdue">${damaged}</div><div class="l">Damaged</div></div>
      <div class="stat"><div class="n overdue">${oos}</div><div class="l">Out of Service</div></div>
      <div class="stat" style="grid-column:1/-1;"><div class="n">${wet}</div><div class="l">Wet</div></div>
    </div>
  `;
}

function conditionReportFilterDesc(rows){
  const companyDesc = reportSelectedCompanyIds.length
    ? reportSelectedCompanyIds.map(id=>state.companies.find(c=>c.id===id)?.name).filter(Boolean).join(', ')

// ============================================================
// MASTER LIST SNAPSHOT — one row per hydrant, current status +
// latest flow data, regardless of which activity produced each
// ============================================================
async function fetchAllHydrantTestsWithSession(){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    const { data, error } = await sb.from('hydrant_tests').select('*, sessions(activity_type)').order('tested_at', {ascending:false}).range(from, from + pageSize - 1);
    if(error){ console.error('hydrant_tests fetch:', error.message); break; }
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function buildMasterSnapshotRows(hydrantsList){
  const allTests = await fetchAllHydrantTestsWithSession();
  const byHydrant = {};
  allTests.forEach(t => { (byHydrant[t.hydrant_id] = byHydrant[t.hydrant_id] || []).push(t); });

  return hydrantsList.map(h => {
    const tests = byHydrant[h.id] || []; // already sorted newest-first from the query
    const statusInfo = computeHydrantStatus(tests);
    const lastInteraction = tests[0] || null;
    const lastFlow = tests.find(t => t.sessions && t.sessions.activity_type === 'flow_test') || null;
    const lastWetDry = tests.find(t => t.wet_dry) || null;
    const compName = state.companies.find(c=>c.id===h.company_id)?.name || '';
    let statusLabel = STATUS_LABELS[statusInfo.status];
    if(statusInfo.mostRecentFlag) statusLabel += ` (most recent: ${STATUS_LABELS[statusInfo.mostRecentFlag.status]} ${fmtDate(statusInfo.mostRecentFlag.date)})`;
    return {
      hydrant_number: h.hydrant_number,
      address: h.address || '',
      company: compName,
      block: h.block || '',
      status: statusInfo.status, statusLabel,
      wetDry: lastWetDry ? (lastWetDry.wet_dry === 'wet' ? 'Wet' : 'Dry') : '',
      lastInteraction: lastInteraction ? fmtDate(lastInteraction.tested_at) : 'Never',
      lastFlowTest: lastFlow ? fmtDate(lastFlow.tested_at) : 'Never',
      static_psi: lastFlow?.static_psi ?? '',
      residual_psi: lastFlow?.residual_psi ?? '',
      pitot_psi: lastFlow?.pitot_psi ?? '',
      flow_gpm: lastFlow?.flow_gpm ?? '',
      flow_at_20psi: lastFlow?.flow_at_20psi ?? '',
    };
  });
}

function summarizeHydrantScope(hydrantsList){
  const companyIds = new Set(hydrantsList.map(h=>h.company_id));
  let companyDesc;
  if(companyIds.size === state.companies.length) companyDesc = 'All Companies (citywide)';
  else {
    const names = [...companyIds].map(id=>state.companies.find(c=>c.id===id)?.name).filter(Boolean).sort(compareCompanyNames);
    companyDesc = names.length <= 5 ? names.join(', ') : `${names.length} companies`;
  }
  const blockSet = new Set(hydrantsList.map(h=>h.block));
  const blockDesc = blockSet.size === 1 ? `List ${[...blockSet][0]}` : (blockSet.size <= 4 ? [...blockSet].sort().map(b=>'List '+b).join(', ') : 'All Lists');
  return { companyDesc, blockDesc };
}

async function exportMasterSnapshotCsv(hydrantsList){
  if(!hydrantsList.length){ toast('No hydrants to export'); return; }
  const rows = await buildMasterSnapshotRows(hydrantsList);
  const { companyDesc, blockDesc } = summarizeHydrantScope(hydrantsList);
  const headerBlock = [

    [`Companies: ${companyDesc}`],
    [`Lists: ${blockDesc}`],
    [`Generated: ${fmtDate(new Date())} | ${rows.length} hydrants`],
    [],
  ];
  const headers = ['Hydrant','Address','Company','List','Status','Wet/Dry','Last Interaction','Last Flow Test','Static','Residual','Pitot','Flow','Flow@20psi'];
  const out = rows.map(r => [r.hydrant_number, r.address, r.company, r.block, r.statusLabel, r.wetDry, r.lastInteraction, r.lastFlowTest, r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.flow_at_20psi]);
  downloadXlsx('master-list-snapshot-'+new Date().toISOString().slice(0,10)+'.xlsx', headerBlock, headers, out);

// ============================================================
// OFFLINE FILLABLE SHEETS — generate (bulk, one PDF per Company+List)
// and import filled sheets back into the system when connection returns.
// Built with pdf-lib so form fields are real AcroForm fields (readable
// by iOS Files/Preview's native "Fill Out" feature, Adobe, etc.) —
// each hydrant's fields are tagged with its database ID, so import can
// match rows back precisely regardless of hydrant number formatting.
// ============================================================
async function generateOfflineSheetPdfBytes(companyId, block, companyName){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const hydrants = state.hydrants.filter(h => h.company_id === companyId && h.block === block)
    .sort((a,b)=> a.hydrant_number.localeCompare(b.hydrant_number, undefined, {numeric:true}));

  const pdfDoc = await PDFDocument.create();
  const form = pdfDoc.getForm();
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);

  const PAGE_W = 792, PAGE_H = 612, MARGIN = 28; // Letter, landscape
  const ROW_H = 15;
  const COLS = [
    { key:'num', label:'Hydrant', x:MARGIN, w:44 },
    { key:'addr', label:'Address / Notes', x:MARGIN+44, w:150 },
    { key:'static', label:'Static', x:MARGIN+194, w:34 },
    { key:'residual', label:'Resid.', x:MARGIN+228, w:34 },
    { key:'pitot', label:'Pitot', x:MARGIN+262, w:34 },
    { key:'gauge', label:'Gauge', x:MARGIN+296, w:34 },
    { key:'condition', label:'Condition', x:MARGIN+330, w:70 },
    { key:'wetdry', label:'Wet/Dry', x:MARGIN+400, w:44 },
    { key:'cleared', label:'Snow', x:MARGIN+444, w:60 },
    { key:'flag', label:'Flag', x:MARGIN+504, w:50 },
    { key:'notes', label:'Notes', x:MARGIN+554, w:PAGE_W-MARGIN-(MARGIN+554) },
  ];

  let page, y;
  function newPage(withHeader){
    page = pdfDoc.addPage([PAGE_W, PAGE_H]);
    y = PAGE_H - MARGIN;
    page.drawText(`LFD Hydrant Testing — Offline Sheet: ${companyName} · List ${block}`, { x: MARGIN, y, size: 13, font: fontBold });
    y -= 20;
    if(withHeader){
      const activityField = form.createDropdown('hdr_activity');
      activityField.addOptions(['', 'Flow Test', 'Condition Check', 'Snow Removal']);
      activityField.addToPage(page, { x: MARGIN, y: y-14, width: 120, height: 16, font });
      page.drawText('Activity:', { x: MARGIN, y: y-2, size: 8, font });

      const dateField = form.createTextField('hdr_date');
      dateField.addToPage(page, { x: MARGIN+140, y: y-14, width: 90, height: 16, font });
      page.drawText('Date:', { x: MARGIN+140, y: y-2, size: 8, font });

      const oicField = form.createDropdown('hdr_oic');
      oicField.addOptions(['', ...state.members.map(m=>m.name)]);
      oicField.addToPage(page, { x: MARGIN+250, y: y-14, width: 130, height: 16, font });
      page.drawText('OIC:', { x: MARGIN+250, y: y-2, size: 8, font });

      const divField = form.createDropdown('hdr_division');
      divField.addOptions(['', ...state.divisions.map(d=>d.name)]);
      divField.addToPage(page, { x: MARGIN+400, y: y-14, width: 100, height: 16, font });
      page.drawText('Division:', { x: MARGIN+400, y: y-2, size: 8, font });

      const crewField = form.createTextField('hdr_crew');
      crewField.addToPage(page, { x: MARGIN+520, y: y-14, width: PAGE_W-MARGIN-(MARGIN+520), height: 16, font });
      page.drawText('Crew (names, comma-separated):', { x: MARGIN+520, y: y-2, size: 8, font });

      y -= 34;

      const metaCompany = form.createTextField('meta_company_id');
      metaCompany.addToPage(page, { x: 2, y: 2, width: 1, height: 1 });
      metaCompany.setText(companyId);
      const metaBlock = form.createTextField('meta_block');
      metaBlock.addToPage(page, { x: 4, y: 2, width: 1, height: 1 });
      metaBlock.setText(block);
    }
    COLS.forEach(c => page.drawText(c.label, { x: c.x, y, size: 8, font: fontBold }));
    y -= 4;
    page.drawLine({ start:{x:MARGIN,y}, end:{x:PAGE_W-MARGIN,y}, thickness:0.5, color: rgb(0.6,0.6,0.6) });
    y -= 12;
  }

  newPage(true);

  for(const h of hydrants){
    if(y < MARGIN + ROW_H) newPage(false);
    const addrText = `${h.hydrant_number} `; // placeholder, real number drawn separately below
    page.drawText(h.hydrant_number, { x: COLS[0].x, y, size: 7, font });
    const addrNotes = (h.address||'') + (h.location_notes ? ' — ' + h.location_notes : '');
    page.drawText(addrNotes.length > 46 ? addrNotes.slice(0,44)+'…' : addrNotes, { x: COLS[1].x, y, size: 6.5, font });

    const prefix = 'h_' + h.id + '_';
    const fieldY = y - 2, fieldH = ROW_H - 2;

    const staticF = form.createTextField(prefix+'static'); staticF.addToPage(page, { x: COLS[2].x, y: fieldY, width: COLS[2].w-2, height: fieldH, font });
    const residF = form.createTextField(prefix+'residual'); residF.addToPage(page, { x: COLS[3].x, y: fieldY, width: COLS[3].w-2, height: fieldH, font });
    const pitotF = form.createTextField(prefix+'pitot'); pitotF.addToPage(page, { x: COLS[4].x, y: fieldY, width: COLS[4].w-2, height: fieldH, font });
    const gaugeF = form.createTextField(prefix+'gauge'); gaugeF.addToPage(page, { x: COLS[5].x, y: fieldY, width: COLS[5].w-2, height: fieldH, font });

    const condF = form.createDropdown(prefix+'condition');
    condF.addOptions(['','Good','Needs Repair','OOS']);
    condF.addToPage(page, { x: COLS[6].x, y: fieldY, width: COLS[6].w-2, height: fieldH, font });

    const wetF = form.createDropdown(prefix+'wetdry');
    wetF.addOptions(['','Dry','Wet']);
    wetF.addToPage(page, { x: COLS[7].x, y: fieldY, width: COLS[7].w-2, height: fieldH, font });

    const clearF = form.createDropdown(prefix+'cleared');
    clearF.addOptions(['','Cleared','Not Cleared']);
    clearF.addToPage(page, { x: COLS[8].x, y: fieldY, width: COLS[8].w-2, height: fieldH, font });

    const flagF = form.createDropdown(prefix+'flag');
    flagF.addOptions(['','Damaged','OOS']);
    flagF.addToPage(page, { x: COLS[9].x, y: fieldY, width: COLS[9].w-2, height: fieldH, font });

    const notesF = form.createTextField(prefix+'notes'); notesF.addToPage(page, { x: COLS[10].x, y: fieldY, width: COLS[10].w-2, height: fieldH, font });

    y -= ROW_H;
  }

  return await pdfDoc.save();
}

async function generateAllOfflineSheets(){
  toast('Generating offline sheets…');
  const pairs = new Map();
  state.hydrants.forEach(h => {
    if(!h.company_id || !h.block) return;
    const key = h.company_id + '|' + h.block;
    if(!pairs.has(key)) pairs.set(key, { companyId: h.company_id, block: h.block });
  });
  const zip = new JSZip();
  for(const { companyId, block } of pairs.values()){
    const companyName = state.companies.find(c=>c.id===companyId)?.name || 'Unknown';
    const bytes = await generateOfflineSheetPdfBytes(companyId, block, companyName);
    const safeName = companyName.replace(/[^A-Za-z0-9]+/g,'-');
    zip.file(`${safeName}-List-${block}.pdf`, bytes);
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'offline-sheets-'+new Date().toISOString().slice(0,10)+'.zip';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Offline sheets downloaded');
}

// ---- Import a filled offline sheet ----
async function importOfflineSheet(file){
  const { PDFDocument } = PDFLib;
  const bytes = await file.arrayBuffer();
  let pdfDoc;
  try{ pdfDoc = await PDFDocument.load(bytes); }
  catch(e){ toast('Could not read this PDF'); return null; }
  const form = pdfDoc.getForm();

  function getText(name){ try{ return form.getTextField(name).getText() || ''; }catch(e){ return ''; } }
  function getDropdown(name){ try{ return (form.getDropdown(name).getSelected()||[])[0] || ''; }catch(e){ return ''; } }

  const companyId = getText('meta_company_id');
  const block = getText('meta_block');
  if(!companyId || !block){ toast("This doesn't look like a valid offline sheet"); return null; }

  const activityLabel = getDropdown('hdr_activity');
  const activityMap = { 'Flow Test':'flow_test', 'Condition Check':'condition_check', 'Snow Removal':'snow_removal' };
  const activityType = activityMap[activityLabel];
  if(!activityType){ toast('Select an Activity on the sheet before importing'); return null; }

  const dateStr = getText('hdr_date').trim();
  const oicName = getDropdown('hdr_oic');
  const divisionName = getDropdown('hdr_division');
  const crewNames = getText('hdr_crew').split(',').map(s=>s.trim()).filter(Boolean);

  const oic = state.members.find(m => m.name.toLowerCase() === oicName.toLowerCase());
  const division = state.divisions.find(d => d.name.toLowerCase() === divisionName.toLowerCase());
  const crewIds = crewNames.map(n => state.members.find(m=>m.name.toLowerCase()===n.toLowerCase())).filter(Boolean).map(m=>m.id);

  const hydrantsFor = state.hydrants.filter(h => h.company_id === companyId && h.block === block);
  const rows = [];
  for(const h of hydrantsFor){
    const prefix = 'h_' + h.id + '_';
    const row = {
      hydrantId: h.id, hydrantNumber: h.hydrant_number,
      static_psi: getText(prefix+'static').trim(),
      residual_psi: getText(prefix+'residual').trim(),
      pitot_psi: getText(prefix+'pitot').trim(),
      gauge_flow_gpm: getText(prefix+'gauge').trim(),
      condition: getDropdown(prefix+'condition'),
      wetdry: getDropdown(prefix+'wetdry'),
      cleared: getDropdown(prefix+'cleared'),
      flag: getDropdown(prefix+'flag'),
      notes: getText(prefix+'notes').trim(),
    };
    const hasData = activityType === 'flow_test'
      ? (row.static_psi || row.residual_psi || row.pitot_psi || row.gauge_flow_gpm || row.condition)
      : activityType === 'condition_check'
      ? (row.condition || row.wetdry)
      : (row.cleared || row.flag);
    if(hasData) rows.push(row);
  }

  return { companyId, block, activityType, activityLabel, dateStr, oic, division, crewIds, crewNames, rows };
}

async function commitOfflineSheetImport(parsed){
  const FIXED_C = parseFloat(state.settings.default_discharge_coeff) || 0.9;
  const FIXED_D = parseFloat(state.settings.default_outlet_size) || 2.5;
  const FIXED_N = parseFloat(state.settings.default_num_outlets) || 1;

  let job;
  const { data: existingJob } = await sb.from('jobs').select('*')
    .eq('company_id', parsed.companyId).eq('block', parsed.block).eq('activity_type', parsed.activityType).eq('status','open').maybeSingle();
  if(existingJob){ job = existingJob; }
  else {
    const { data: existingCampaign } = await sb.from('campaigns').select('*').eq('activity_type', parsed.activityType).eq('status','open').order('created_at',{ascending:false}).limit(1).maybeSingle();
    let campaign = existingCampaign;
    if(!campaign){
      const label = ACTIVITY_LABELS[parsed.activityType] + ' — started ' + new Date().toLocaleDateString([], {month:'long', year:'numeric'});
      const { data: newCampaign } = await sb.from('campaigns').insert({ name: label, activity_type: parsed.activityType, status:'open' }).select().single();
      campaign = newCampaign;
    }
    const { data: newJob, error: jobErr } = await sb.from('jobs').insert({
      company_id: parsed.companyId, block: parsed.block, activity_type: parsed.activityType,
      status:'open', campaign_id: campaign ? campaign.id : null,
    }).select().single();
    if(jobErr){ toast('Error creating job: ' + jobErr.message); return false; }
    job = newJob;
  }

  const sessionDate = parsed.dateStr && !isNaN(Date.parse(parsed.dateStr)) ? new Date(parsed.dateStr).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
  const nowIso = new Date().toISOString();
  const { data: shift, error: shiftErr } = await sb.from('sessions').insert({
    job_id: job.id, company_id: parsed.companyId, activity_type: parsed.activityType,
    division_id: parsed.division ? parsed.division.id : null,
    oic_member_id: parsed.oic ? parsed.oic.id : null,
    crew_member_ids: parsed.crewIds,
    session_date: sessionDate, started_at: nowIso, ended_at: nowIso, status: 'closed',
  }).select().single();
  if(shiftErr){ toast('Error creating shift: ' + shiftErr.message); return false; }

  const inserts = parsed.rows.map(row => {
    if(parsed.activityType === 'flow_test'){
      const P = parseFloat(row.pitot_psi);
      const hs = parseFloat(row.static_psi);
      const hr = parseFloat(row.residual_psi);
      let flow=null, drop=null, flow20=null;
      if(!isNaN(P) && P>0) flow = 29.83 * FIXED_C * FIXED_D*FIXED_D * Math.sqrt(P) * FIXED_N;
      if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
      if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
      const condMap = { 'Good':'good', 'Needs Repair':'repair', 'OOS':'oos' };
      return {
        session_id: shift.id, hydrant_id: row.hydrantId,
        static_psi: row.static_psi || null, residual_psi: row.residual_psi || null, pitot_psi: row.pitot_psi || null,
        gauge_flow_gpm: row.gauge_flow_gpm || null,
        orifice_diameter: FIXED_D, discharge_coeff: FIXED_C, num_outlets: FIXED_N,
        flow_gpm: flow!==null ? Math.round(flow) : null, drop_pct: drop!==null ? drop.toFixed(1) : null,
        flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
        condition: condMap[row.condition] || null,
        wet_dry: row.wetdry ? row.wetdry.toLowerCase() : null,
        notes: row.notes || null,
      };
    } else if(parsed.activityType === 'condition_check'){
      const condMap = { 'Good':'good', 'Needs Repair':'repair', 'OOS':'oos' };
      return {
        session_id: shift.id, hydrant_id: row.hydrantId,
        condition: condMap[row.condition] || null,
        wet_dry: row.wetdry ? row.wetdry.toLowerCase() : null,
        notes: row.notes || null,
      };
    } else {
      const clearMap = { 'Cleared':'cleared', 'Not Cleared':'not_cleared' };
      const flagMap = { 'Damaged':'damaged', 'OOS':'oos' };
      return {
        session_id: shift.id, hydrant_id: row.hydrantId,
        snow_cleared_status: clearMap[row.cleared] || null,
        snow_condition_flag: flagMap[row.flag] || null,
        notes: row.notes || null,
      };
    }
  });

  if(inserts.length){
    const { error: insertErr } = await sb.from('hydrant_tests').insert(inserts);
    if(insertErr){ toast('Error saving entries: ' + insertErr.message); return false; }
  }
  toast(`Imported ${inserts.length} hydrant entries`);
  return true;
}
