function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function attachDatePicker(id){

function fmtDate(d){
  if(!d) return '—';
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date)) return '—';
  const mm = String(date.getMonth()+1).padStart(2,'0');
  const dd = String(date.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${date.getFullYear()}`;
}
function fmtDateTime(d){
  if(!d) return '—';
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date)) return '—';
  return `${fmtDate(date)} ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
}
function companySortKey(name){
  const eng = name.match(/^Engine\s+(\d+)/i);
  if(eng) return [0, parseInt(eng[1])];
  const lad = name.match(/^Ladder\s+(\d+)/i);
  if(lad) return [1, parseInt(lad[1])];
  return [2, name];
}
function compareCompanyNames(a,b){
  const ka=companySortKey(a), kb=companySortKey(b);
  if(ka[0]!==kb[0]) return ka[0]-kb[0];
  if(typeof ka[1]==='number' && typeof kb[1]==='number') return ka[1]-kb[1];
  return String(ka[1]).localeCompare(String(kb[1]));
}

function typeaheadHtml(id, placeholder){
  return `
    <div style="position:relative;">
      <input type="text" id="${id}_text" placeholder="${esc(placeholder)}" autocomplete="off">
      <input type="hidden" id="${id}_value">
      <div class="search-results" id="${id}_results" style="display:none;position:absolute;left:0;right:0;background:#fff;z-index:5;"></div>
    </div>`;
}
function wireTypeahead(id, items, onSelect){
  const textInput = document.getElementById(id+'_text');
  const hiddenInput = document.getElementById(id+'_value');
  const results = document.getElementById(id+'_results');
  textInput.addEventListener('focus', ()=>renderList(items));
  textInput.addEventListener('input', ()=>{
    hiddenInput.value = '';
    const q = textInput.value.trim().toLowerCase();
    renderList(q ? items.filter(m=>m.name.toLowerCase().includes(q)) : items);
  });
  document.addEventListener('click', (e)=>{
    if(!textInput.contains(e.target) && !results.contains(e.target)) results.style.display='none';
  });
  function renderList(matches){
    if(!matches.length){ results.style.display='none'; return; }
    results.innerHTML = matches.slice(0,30).map(m=>`<div class="search-result-item" data-id="${m.id}">${esc(m.name)}</div>`).join('');
    results.style.display = 'block';
    results.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        const m = items.find(x=>x.id===el.dataset.id);
        textInput.value = m.name; hiddenInput.value = m.id;
        results.style.display = 'none';
        if(onSelect) onSelect(m);
      };
    });
  }
}

// ---- Unsaved-changes warning ----
let unsavedChanges = false;
function markFormDirty(){ unsavedChanges = true; }
function clearFormDirty(){ unsavedChanges = false; }
function guardNavigate(navigateFn){
  if(unsavedChanges && !confirm('You have unsaved changes. Leave without saving?')) return;
  unsavedChanges = false;
  navigateFn();
}
window.addEventListener('beforeunload', (e)=>{
  if(unsavedChanges){ e.preventDefault(); e.returnValue = ''; }
});
function wireDirtyTracking(container){
  container.querySelectorAll('input, textarea, select').forEach(el=>{
    el.addEventListener('input', markFormDirty);
    el.addEventListener('change', markFormDirty);
  });
}

function render(){
  if(state.superAdmin){ state.isChief = true; renderChiefShell(); return; }
  if(!state.company){ renderCompanyLogin(); return; }
  const companyRow = state.companies.find(c => c.id === state.company.id);
  if(companyRow && companyRow.is_chief){ state.isChief = true; renderChiefShell(); return; }
  state.isChief = false;
  if(!state.division){ renderDivisionSelect(); return; }
  if(!state.block){ renderBlockSelect(); return; }
  renderCompanyShell();
}

// COMPLETION HELPERS
// ============================================================
async function computeCompletionForCompanyBlock(companyId, block, activityType, cutoffDate){
  const hydrantsFor = state.hydrants.filter(h => h.company_id === companyId && h.block === block);
  const ids = hydrantsFor.map(h=>h.id);
  if(ids.length === 0) return { pending: [], total: 0, completedCount: 0 };
  const { data } = await sb.from('hydrant_tests').select('hydrant_id, tested_at, sessions(activity_type)').in('hydrant_id', ids);
  const doneIds = new Set((data||[])
    .filter(r => r.sessions && r.sessions.activity_type === activityType && new Date(r.tested_at) >= cutoffDate)
    .map(r=>r.hydrant_id));
  const pending = hydrantsFor.filter(h => !doneIds.has(h.id));
  return { pending, total: hydrantsFor.length, completedCount: hydrantsFor.length - pending.length };
}
async function computeJobPending(job){
  return computeCompletionForCompanyBlock(job.company_id, job.block, job.activity_type, new Date(job.created_at));
}

async function offerSameDayCrewResume(job){
  const { data: lastShift } = await sb.from('sessions').select('*')
    .eq('job_id', job.id).eq('status','closed').order('started_at', {ascending:false}).limit(1).maybeSingle();
  const todayStr = new Date().toISOString().slice(0,10);
  if(!lastShift || lastShift.session_date !== todayStr){
    renderStartShift({ job }, null);
    return;
  }
  const oicName = state.members.find(m=>m.id===lastShift.oic_member_id)?.name || '—';
  const crewNames = (lastShift.crew_member_ids||[]).map(id=>state.members.find(m=>m.id===id)?.name).filter(Boolean);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="card modal-card">
      <h3 style="margin-top:0;">Continue with same crew?</h3>
      <div class="hint" style="margin-bottom:10px;">This job already had a shift today.</div>
      <div style="font-size:14px;margin-bottom:14px;"><b>OIC:</b> ${esc(oicName)}<br><b>Crew:</b> ${crewNames.length ? esc(crewNames.join(', ')) : '—'}</div>
      <button class="primary" id="sameCrewYesBtn">Yes — Continue</button>
      <button class="secondary" id="sameCrewNoBtn">No — New Shift Details</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('sameCrewYesBtn').onclick = async ()=>{
    const { data, error } = await sb.from('sessions').insert({
      job_id: job.id, company_id: job.company_id, activity_type: job.activity_type,
      division_id: lastShift.division_id, oic_member_id: lastShift.oic_member_id,
      crew_member_ids: lastShift.crew_member_ids, session_date: todayStr,
      started_at: new Date().toISOString(), status: 'open',
    }).select().single();
    overlay.remove();
    if(error){ toast('Error: ' + error.message); return; }
    localStorage.setItem('lfd_active_session_id', data.id);
    state.activeJob = job; state.activeSession = data;
    toast('Shift started with same crew');
    renderHydrantEntry();
  };
  document.getElementById('sameCrewNoBtn').onclick = ()=>{
    overlay.remove();
    renderStartShift({ job }, null);
  };
}

  document.getElementById('f_date').addEventListener('input', markFormDirty);
  document.getElementById('f_division').addEventListener('change', markFormDirty);

  function renderCrewList(){
    const list = document.getElementById('crewList');
    if(sessionCrew.length === 0){ list.innerHTML = '<div class="hint">No crew added yet.</div>'; return; }
    list.innerHTML = sessionCrew.map(m => `
      <div style="display:flex;justify-content:space-between;align-items:center;background:#f1efe8;border-radius:5px;padding:7px 10px;margin-bottom:6px;font-size:13.5px;">
        <span>${esc(m.name)}</span>
        <button type="button" data-id="${m.id}" class="removeCrewBtn" style="background:none;border:none;color:var(--red-deep);font-weight:700;cursor:pointer;font-size:15px;">×</button>
      </div>`).join('');
    list.querySelectorAll('.removeCrewBtn').forEach(btn=>{
      btn.onclick = ()=>{ sessionCrew = sessionCrew.filter(m => m.id !== btn.dataset.id); renderCrewList(); };
    });
  }
  renderCrewList();

  document.getElementById('addCrewBtn').onclick = ()=>{
    const id = document.getElementById('f_crew_pick_value').value;
    if(!id){ toast('Pick a crew member first'); return; }
    if(sessionCrew.some(m => m.id === id)){ toast('Already added'); return; }
    const member = state.members.find(m => m.id === id);
    sessionCrew.push({ id: member.id, name: member.name });
    markFormDirty();
    document.getElementById('f_crew_pick_text').value = '';
    document.getElementById('f_crew_pick_value').value = '';
    renderCrewList();
  };

  document.getElementById('startBtn').onclick = async ()=>{
    const oic = document.getElementById('f_oic_value').value;
    const divisionId = document.getElementById('f_division').value;
    if(!oic){ toast('Select an OIC'); return; }

    const payload = {
      session_date: document.getElementById('f_date').value,
      division_id: divisionId,
      oic_member_id: oic,
      crew_member_ids: sessionCrew.map(m => m.id),
    };

    if(isEdit){
      const { data, error } = await sb.from('sessions').update(payload).eq('id', editingSession.id).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      clearFormDirty();
      state.activeSession = data;
      toast('Shift updated');
      renderHydrantEntry();
    } else {
      let job = prefill.job;
      if(!job){
        const campaign = await getOrCreateCampaign(prefill.activityType);
        const { data: newJob, error: jobErr } = await sb.from('jobs').insert({
          company_id: state.company.id, block: state.block,
          activity_type: prefill.activityType, status: 'open',
          campaign_id: campaign ? campaign.id : null,
        }).select().single();
        if(jobErr){ toast('Error: ' + jobErr.message); return; }
        job = newJob;
      }
      const { data, error } = await sb.from('sessions').insert({
        ...payload, company_id: state.company.id, activity_type: job.activity_type,
        job_id: job.id, started_at: new Date().toISOString(), status: 'open',
      }).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      clearFormDirty();
      localStorage.setItem('lfd_active_session_id', data.id);
      state.activeJob = job; state.activeSession = data;
      toast('Shift started');
      renderHydrantEntry();
    }
  };
}

async function computeCampaignOverallStats(campaign){
  const cutoff = new Date(campaign.created_at);
  const eligibleCompanyIds = (campaign.company_ids && campaign.company_ids.length) ? new Set(campaign.company_ids) : null;
  const pairsMap = new Map();
  state.hydrants.forEach(h => {
    if(!h.company_id || !h.block) return;
    if(eligibleCompanyIds && !eligibleCompanyIds.has(h.company_id)) return;
    const key = h.company_id+'|'+h.block;
    if(!pairsMap.has(key)) pairsMap.set(key, {companyId:h.company_id, block:h.block});
  });
  let total = 0, done = 0;
  for(const {companyId, block} of pairsMap.values()){
    const r = await computeCompletionForCompanyBlock(companyId, block, campaign.activity_type, cutoff);
    total += r.total; done += r.completedCount;
  }
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

  const { data } = await sb.from('hydrant_tests').select('*, sessions(company_id, session_date, activity_type)').eq('hydrant_id', hydrantId);

function renderFlowTestForm(main, headerHtml, pending, s, job){
  main.innerHTML = headerHtml + `
    <div class="card">

      <div class="row3">
        <div class="field"><label>Static (psi)</label><input type="number" id="f_static"></div>

        <div class="field"><label>Pitot (psi)</label><input type="number" id="f_pitot"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Outlet Size (in)</label><input type="number" id="f_orifice" value="2.5"></div>
        <div class="field"><label>Discharge Coef.</label><input type="number" id="f_coeff" value="${state.settings.default_discharge_coeff || '0.9'}"></div>
        <div class="field"><label># Outlets</label><input type="number" id="f_outlets" value="1"></div>
      </div>
      <div class="calc-box">
        <div class="calc-row"><span>Flow at test</span><span class="v" id="c_flow">— gpm</span></div>
        <div class="calc-row"><span>% Drop</span><span class="v" id="c_drop">—%</span></div>
        <div class="calc-row"><span>Flow @ 20 psi</span><span class="v" id="c_flow20">— gpm</span></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field"><label>Condition</label>
          <select id="f_condition"><option value="good">Good</option><option value="repair">Needs Repair</option><option value="oos">Out of Service</option></select>
        </div>
        <div class="field"><label>Wet / Dry</label>

        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Leaks, missing cap, obstructed, etc."></textarea></div>
      <button class="primary" id="saveBtn">Save &amp; Continue</button>
    </div>`;

  document.getElementById('f_hydrant').addEventListener('change', (e)=>{ selectedHydrantId = e.target.value; wireDupWarning(selectedHydrantId, 'flow_test'); });
  wireHydrantPicker((id)=> wireDupWarning(id, 'flow_test'));
  clearFormDirty();
  wireDirtyTracking(main);

  function calc(){
    const P = parseFloat(document.getElementById('f_pitot').value);
    const d = parseFloat(document.getElementById('f_orifice').value);
    const C = parseFloat(document.getElementById('f_coeff').value) || 0.9;
    const n = parseFloat(document.getElementById('f_outlets').value) || 1;
    const hs = parseFloat(document.getElementById('f_static').value);
    const hr = parseFloat(document.getElementById('f_residual').value);
    let flow=null, drop=null, flow20=null;
    if(!isNaN(P) && !isNaN(d) && P>0 && d>0) flow = 29.83 * C * d*d * Math.sqrt(P) * n;
    if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
    if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
    document.getElementById('c_flow').textContent = flow!==null ? Math.round(flow)+' gpm' : '— gpm';
    document.getElementById('c_drop').textContent = drop!==null ? drop.toFixed(1)+'%' : '—%';
    document.getElementById('c_flow20').textContent = flow20!==null ? Math.round(flow20)+' gpm' : '— gpm';
    return {flow, drop, flow20};
  }
  ['f_pitot','f_orifice','f_coeff','f_outlets','f_static','f_residual'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calc);
  });

  document.getElementById('saveBtn').onclick = async ()=>{
    const hydrantId = selectedHydrantId || document.getElementById('f_hydrant').value;
    if(!hydrantId){ toast('Select a hydrant'); return; }
    const {flow, drop, flow20} = calc();
    const { error } = await sb.from('hydrant_tests').insert({
      session_id: s.id, hydrant_id: hydrantId,
      static_psi: document.getElementById('f_static').value || null,
      residual_psi: document.getElementById('f_residual').value || null,
      pitot_psi: document.getElementById('f_pitot').value || null,
      orifice_diameter: document.getElementById('f_orifice').value || null,
      discharge_coeff: document.getElementById('f_coeff').value || null,
      num_outlets: document.getElementById('f_outlets').value || null,
      flow_gpm: flow!==null ? Math.round(flow) : null,
      drop_pct: drop!==null ? drop.toFixed(1) : null,
      flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
      condition: document.getElementById('f_condition').value,
      wet_dry: document.getElementById('f_wetdry').value,
      notes: document.getElementById('f_notes').value || null,
    });
    if(error){ toast('Error: ' + error.message); return; }
    clearFormDirty();
    toast('Saved — ready for next one');
    renderHydrantEntry();
  };
}

function openEndShiftModal(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="card modal-card">
      <h3 style="margin-top:0;">End Shift</h3>
      <div class="hint" style="margin-bottom:10px;">This saves and pauses — the job stays open for the next crew.</div>
      <div class="field"><label>Current Time</label><input type="time" id="endTimeInput" value="${hh}:${mm}"></div>
      <div class="field" style="display:flex;align-items:flex-start;gap:8px;">
        <input type="checkbox" id="endConfirmCheck" style="width:auto;margin-top:3px;">
        <label for="endConfirmCheck" style="text-transform:none;font-weight:400;font-size:13.5px;color:var(--ink);">I confirm all hydrant data for this shift has been recorded.</label>
      </div>
      <button class="primary" id="confirmEndBtn">Confirm &amp; End Shift</button>
      <button class="secondary" id="cancelEndBtn">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  attachDatePicker('endTimeInput');
  document.getElementById('cancelEndBtn').onclick = ()=> overlay.remove();
  document.getElementById('confirmEndBtn').onclick = async ()=>{
    if(!document.getElementById('endConfirmCheck').checked){ toast('Please confirm all data has been recorded'); return; }
    const timeVal = document.getElementById('endTimeInput').value;
    const [h, m] = timeVal.split(':').map(Number);
    const endedAt = new Date(); endedAt.setHours(h, m, 0, 0);
    const s = state.activeSession;
    const startedAt = new Date(s.started_at);
    const totalMinutes = Math.max(0, Math.round((endedAt - startedAt) / 60000));
    const { error } = await sb.from('sessions').update({ ended_at: endedAt.toISOString(), status:'closed', total_minutes: totalMinutes }).eq('id', s.id);
    if(error){ toast('Error: ' + error.message); return; }
    localStorage.removeItem('lfd_active_session_id');
    state.activeSession = null; state.activeJob = null;
    overlay.remove();
    toast('Shift ended — job still open for the next crew');
    renderCompanyHome();
  };
}

function computeHydrantStatus(tests){
  const relevant = tests.filter(t => t.condition || t.snow_condition_flag).sort((a,b)=> new Date(b.tested_at)-new Date(a.tested_at));
  if(!relevant.length) return 'good';
  const latest = relevant[0];
  if(latest.condition==='oos' || latest.snow_condition_flag==='oos') return 'oos';
  if(latest.condition==='repair' || latest.snow_condition_flag==='damaged') return 'damaged';
  return 'good';
}
const STATUS_LABELS = { good:'Good', damaged:'Damaged', oos:'Out of Service' };
const STATUS_SYMBOLS = { good:'✓', damaged:'!', oos:'✕' };

async function renderMasterHydrantList(opts){

    document.getElementById('mhBlock').addEventListener('change', (e)=>{ selBlock = e.target.value; renderList(); });
    document.getElementById('seeAllBtn').onclick = ()=>{ selCompany=''; selBlock=''; render(); };

  }

  function renderList(){
    let hydrants = state.hydrants;

    document.querySelectorAll('[data-hydrant]').forEach(row=>{
      row.onclick = ()=> renderHydrantDetail(row.dataset.hydrant, ()=>render());

      btn.onclick = ()=> renderHydrantDetail(btn.dataset.viewhistory, ()=>{ state.tab='status'; renderChiefShell(); });
    });
    main.querySelectorAll('[data-setstatus]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(btn.dataset.newstatus === 'good' && !confirm('Confirm this hydrant has been repaired and is back in service?')) return;
        await updateHydrantCondition(btn.dataset.setstatus, btn.dataset.newstatus, load);
      };
    });
  }
  load();
}

function isAttentionRow(r){
  return r.condition === 'repair' || r.condition === 'oos' ||
    r.snow_cleared_status === 'not_cleared' || !!r.snow_condition_flag;
}
async function renderLog(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <div class="field"><label>Filter: Company</label>
        <select id="filt_company"><option value="">All</option>${state.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Filter: Status</label>
        <select id="filt_status">
          <option value="attention" selected>Needs Attention (default)</option>
          <option value="all">All</option>
          <option value="good">Good</option>
          <option value="repair">Needs Repair</option>
          <option value="oos">Out of Service</option>
          <option value="wet">Wet</option>
          <option value="dry">Dry</option>
          <option value="cleared">Cleared</option>
          <option value="not_cleared">Not Cleared</option>

    const statusFilter = document.getElementById('filt_status').value;

    const fromDate = document.getElementById('filt_from').value;
    const toDate = document.getElementById('filt_to').value;
    let rows = data || [];
    if(companyFilter) rows = rows.filter(r => r.hydrants && r.hydrants.company_id === companyFilter);
    if(search) rows = rows.filter(r => r.hydrants && r.hydrants.hydrant_number.toLowerCase().includes(search));
    if(fromDate) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) >= fromDate);
    if(toDate) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) <= toDate);
    if(statusFilter === 'attention') rows = rows.filter(isAttentionRow);
    else if(statusFilter === 'good') rows = rows.filter(r => r.condition === 'good');
    else if(statusFilter === 'repair') rows = rows.filter(r => r.condition === 'repair');
    else if(statusFilter === 'oos') rows = rows.filter(r => r.condition === 'oos');
    else if(statusFilter === 'wet') rows = rows.filter(r => r.wet_dry === 'wet');
    else if(statusFilter === 'dry') rows = rows.filter(r => r.wet_dry === 'dry');
    else if(statusFilter === 'cleared') rows = rows.filter(r => r.snow_cleared_status === 'cleared');
    else if(statusFilter === 'not_cleared') rows = rows.filter(r => r.snow_cleared_status === 'not_cleared');
    else if(statusFilter === 'damaged') rows = rows.filter(r => r.snow_condition_flag === 'damaged');

    document.getElementById('logList').innerHTML = rows.length ? rows.map(r => `
      <div class="entry" data-id="${r.id}">
        <div class="entry-top"><span>${esc(r.hydrants?.hydrant_number || '—')} · ${esc(r.hydrants?.address||'')}</span><span>${fmtDate(r.tested_at)}</span></div>
        ${r.condition ? `<span class="tag ${r.condition==='good'?'tag-good':'tag-bad'}">${r.condition==='good'?'Good':(r.condition==='repair'?'Needs Repair':'Out of Service')}</span>` : ''}
        ${r.wet_dry ? `<span class="tag ${r.wet_dry==='dry'?'tag-good':'tag-bad'}">${r.wet_dry==='dry'?'Dry':'Wet'}</span>` : ''}
        ${r.snow_cleared_status ? `<span class="tag ${r.snow_cleared_status==='cleared'?'tag-good':'tag-bad'}">${r.snow_cleared_status==='cleared'?'Cleared':'Not Cleared'}</span>` : ''}

  ['filt_from','filt_to'].forEach(id => document.getElementById(id).addEventListener('change', load));

  load();
}

  overlay.querySelectorAll('[data-flag]').forEach(btn=>{

      updatePayload.snow_condition_flag = editFlag;

      updatePayload.wet_dry = editWetDry;
      updatePayload.condition = editCond;

      const P = parseFloat(document.getElementById('e_pitot').value);
      const d = parseFloat(document.getElementById('e_orifice').value);
      const C = parseFloat(document.getElementById('e_coeff').value) || 0.9;
      const n = parseFloat(document.getElementById('e_outlets').value) || 1;
      const hs = parseFloat(document.getElementById('e_static').value);
      const hr = parseFloat(document.getElementById('e_residual').value);
      let flow=null, drop=null, flow20=null;
      if(!isNaN(P) && !isNaN(d) && P>0 && d>0) flow = 29.83 * C * d*d * Math.sqrt(P) * n;
      if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
      if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
      updatePayload = {
        ...updatePayload,
        static_psi: document.getElementById('e_static').value || null,
        residual_psi: document.getElementById('e_residual').value || null,
        pitot_psi: document.getElementById('e_pitot').value || null,
        orifice_diameter: document.getElementById('e_orifice').value || null,
        discharge_coeff: document.getElementById('e_coeff').value || null,
        num_outlets: document.getElementById('e_outlets').value || null,
        flow_gpm: flow!==null ? Math.round(flow) : null,
        drop_pct: drop!==null ? drop.toFixed(1) : null,
        flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
        condition: document.getElementById('e_condition').value,
        wet_dry: document.getElementById('e_wetdry').value,
      };
    }
    const { error } = await sb.from('hydrant_tests').update(updatePayload).eq('id', entryId);
    if(error){ toast('Error: ' + error.message); return; }
    toast('Entry updated');
    overlay.remove();
    if(onSaved) onSaved();
  };
}

let lastOverdueList = [];
function periodStats(sessions, tests, from){
  const s = sessions.filter(x => new Date(x.started_at) >= from);
  const minutes = s.reduce((sum,x)=>sum+(x.total_minutes||0),0);
  const manMinutes = s.reduce((sum,x)=>{
    const people = (x.crew_member_ids||[]).length + (x.oic_member_id?1:0);
    return sum + people*(x.total_minutes||0);
  },0);
  const entries = tests.filter(x => new Date(x.tested_at) >= from).length;
  return { shifts: s.length, hours: Math.round(minutes/60), manHours: Math.round(manMinutes/60), entries };
}
function statCard(title, stats){
  return `<div class="card"><h3 style="margin-top:0;">${esc(title)}</h3>
    <div class="stat-grid">
      <div class="stat"><div class="n">${stats.shifts}</div><div class="l">Shifts</div></div>
      <div class="stat"><div class="n">${stats.hours}</div><div class="l">Hours</div></div>
      <div class="stat"><div class="n">${stats.manHours}</div><div class="l">Man-Hours</div></div>
      <div class="stat"><div class="n">${stats.entries}</div><div class="l">Entries Logged</div></div>
    </div></div>`;
}

async function renderStats(){
  const main = document.getElementById('main');
  main.innerHTML = 'Loading…';
  const [{data: tests}, {data: sessions}, {data: hydrants}] = await Promise.all([
    sb.from('hydrant_tests').select('*'),
    sb.from('sessions').select('*'),
    sb.from('hydrants').select('*').eq('active', true),
  ]);
  const t = tests || [], s = sessions || [], h = hydrants || [];
  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  const today = periodStats(s, t, startOfToday);
  const week = periodStats(s, t, startOfWeek);
  const month = periodStats(s, t, startOfMonth);

  const lastTestByHydrant = {};
  t.forEach(x => {
    const cur = lastTestByHydrant[x.hydrant_id];
    if(!cur || new Date(x.tested_at) > new Date(cur)) lastTestByHydrant[x.hydrant_id] = x.tested_at;
  });
  const overdue = h.filter(hy => {
    const last = lastTestByHydrant[hy.id];
    if(!last) return true;
    const months = hy.retest_interval_months || 12;
    const dueDate = new Date(last); dueDate.setMonth(dueDate.getMonth() + months);
    return dueDate < now;
  });
  lastOverdueList = [...overdue].sort((a,b)=>{
    const an = state.companies.find(c=>c.id===a.company_id)?.name || '';
    const bn = state.companies.find(c=>c.id===b.company_id)?.name || '';
    return compareCompanyNames(an, bn);
  });
  const overdueByCompany = {};
  overdue.forEach(hy=>{
    const name = state.companies.find(c=>c.id===hy.company_id)?.name || 'Unassigned';
    overdueByCompany[name] = (overdueByCompany[name]||0)+1;
  });
  const overdueRows = Object.entries(overdueByCompany).sort((a,b)=>compareCompanyNames(a[0],b[0]));

  const hoursByCompany = {};
  const manHoursByCompany = {};
  month.shifts && s.filter(x=>new Date(x.started_at)>=startOfMonth).forEach(sess => {
    const name = state.companies.find(c=>c.id===sess.company_id)?.name || 'Unknown';
    hoursByCompany[name] = (hoursByCompany[name]||0) + (sess.total_minutes||0);
    const people = (sess.crew_member_ids||[]).length + (sess.oic_member_id?1:0);
    manHoursByCompany[name] = (manHoursByCompany[name]||0) + people*(sess.total_minutes||0);
  });
  const hoursRows = Object.keys(hoursByCompany).sort(compareCompanyNames).map(name=>[name, hoursByCompany[name], manHoursByCompany[name]||0]);

  main.innerHTML = `
    ${statCard('Today', today)}
    ${statCard('This Week', week)}
    ${statCard('This Month', month)}
    <div class="card">
      <h3 style="margin-top:0;">Hours &amp; Man-Hours by Company (this month)</h3>
      ${hoursRows.length ? `<table class="report"><thead><tr><th>Company</th><th>Hours</th><th>Man-Hours</th></tr></thead><tbody>${hoursRows.map(([name,mins,manMins])=>`<tr><td>${esc(name)}</td><td>${(mins/60).toFixed(1)}</td><td>${(manMins/60).toFixed(1)}</td></tr>`).join('')}</tbody></table>` : '<div class="hint">No shifts logged this month yet.</div>'}
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Overdue for Retest</h3>
      <div style="font-size:20px;font-weight:700;" class="${overdue.length?'overdue':''}">${overdue.length} total</div>
      ${overdueRows.length ? `<table class="report" style="margin-top:8px;"><thead><tr><th>Company</th><th>Outstanding</th></tr></thead><tbody>${overdueRows.map(([name,count])=>`<tr><td>${esc(name)}</td><td>${count}</td></tr>`).join('')}</tbody></table>` : ''}
      ${overdue.length ? '<button class="secondary" id="overduePdfBtn">Download Full List (PDF)</button>' : ''}
    </div>
  `;
  const pdfBtn = document.getElementById('overduePdfBtn');
  if(pdfBtn) pdfBtn.onclick = ()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text('Overdue Hydrants for Retest', 14, 16);
    doc.setFontSize(10); doc.text('Generated ' + fmtDate(new Date()), 14, 23);
    const body = lastOverdueList.map(hy => [hy.hydrant_number, hy.address||'', state.companies.find(c=>c.id===hy.company_id)?.name || '']);
    doc.autoTable({ head: [['Hydrant','Address','Company']], body, startY: 28, styles:{fontSize:9}, headStyles:{fillColor:[26,26,26]} });
    doc.save('overdue-hydrants-'+new Date().toISOString().slice(0,10)+'.pdf');
    toast('PDF downloaded');
  };
}

let campaignYearFilter = '';
let campaignActivityFilter = '';

async function closeCampaignWithComputedEndDate(campaignId){
  const { data: campaign } = await sb.from('campaigns').select('*').eq('id', campaignId).single();
  const cutoff = new Date(campaign.created_at);
  const { data: tests } = await sb.from('hydrant_tests').select('tested_at, sessions(activity_type)');
  const relevant = (tests||[]).filter(t => t.sessions && t.sessions.activity_type === campaign.activity_type && new Date(t.tested_at) >= cutoff);
  let endDate = new Date().toISOString();
  if(relevant.length){
    endDate = relevant.reduce((max,t)=> new Date(t.tested_at) > new Date(max) ? t.tested_at : max, relevant[0].tested_at);
  }
  await sb.from('campaigns').update({ status:'closed', closed_at: endDate }).eq('id', campaignId);
}

async function computeCampaignQuickStats(campaign, allTests){
  const cutoff = new Date(campaign.created_at);
  const eligibleCompanyIds = (campaign.company_ids && campaign.company_ids.length) ? new Set(campaign.company_ids) : null;
  const totalHydrants = state.hydrants.filter(h => h.company_id && h.block && (!eligibleCompanyIds || eligibleCompanyIds.has(h.company_id))).length;
  const relevant = allTests.filter(t => t.sessions && t.sessions.activity_type === campaign.activity_type && new Date(t.tested_at) >= cutoff);
  const doneIds = new Set(relevant.map(t=>t.hydrant_id));
  const pct = totalHydrants ? Math.round(doneIds.size / totalHydrants * 100) : 0;
  const damaged = relevant.filter(t=>t.snow_condition_flag==='damaged').length;
  const oos = relevant.filter(t=>t.condition==='oos' || t.snow_condition_flag==='oos').length;
  return { pct, damaged, oos, total: totalHydrants, done: doneIds.size };
}

      <button class="secondary" id="cfCancelBtn">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cfCancelBtn').onclick = ()=> overlay.remove();

  overlay.querySelectorAll('[data-cf-all]').forEach(el=>{
    el.onclick = ()=>{
      selectedAll = true; selectedIds = new Set(state.companies.map(c=>c.id));
      overlay.querySelectorAll('#cf_companies .chip').forEach(c=>c.classList.add('active'));
    };
  });
  overlay.querySelectorAll('[data-cf-company]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.cfCompany;
      if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
      selectedAll = selectedIds.size === state.companies.length;
      el.classList.toggle('active', selectedIds.has(id));
      overlay.querySelector('[data-cf-all]').classList.toggle('active', selectedAll);
    };
  });

  document.getElementById('cfSaveBtn').onclick = async ()=>{
    const activityType = document.getElementById('cf_activity').value;
    let name = document.getElementById('cf_name').value.trim();
    if(!name) name = ACTIVITY_LABELS[activityType] + ' — started ' + new Date().toLocaleDateString([], {month:'long', year:'numeric'});
    const companyIds = selectedAll ? null : Array.from(selectedIds);
    if(isEdit){
      const { error } = await sb.from('campaigns').update({ name, company_ids: companyIds }).eq('id', existingCampaign.id);
      if(error){ toast('Error: ' + error.message); return; }
      toast('Campaign updated');
    } else {
      const { error } = await sb.from('campaigns').insert({ name, activity_type: activityType, status:'open', company_ids: companyIds });
      if(error){ toast('Error: ' + error.message); return; }
      toast('Campaign created');
    }
    overlay.remove();
    if(onSaved) onSaved();
  };
}

async function renderCampaignDetail(campaignId){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const { data: campaign } = await sb.from('campaigns').select('*').eq('id', campaignId).single();
  const { data: jobs } = await sb.from('jobs').select('*').eq('campaign_id', campaignId);
  const cutoff = new Date(campaign.created_at);
  const eligibleCompanyIds = (campaign.company_ids && campaign.company_ids.length) ? new Set(campaign.company_ids) : null;

  const pairsMap = new Map();
  state.hydrants.forEach(h => {
    if(!h.company_id || !h.block) return;
    if(eligibleCompanyIds && !eligibleCompanyIds.has(h.company_id)) return;
    const key = h.company_id + '|' + h.block;
    if(!pairsMap.has(key)) pairsMap.set(key, { companyId: h.company_id, block: h.block });
  });

  let totalHydrants = 0, totalDone = 0;
  const rows = [];
  for(const { companyId, block } of pairsMap.values()){
    const { total, completedCount } = await computeCompletionForCompanyBlock(companyId, block, campaign.activity_type, cutoff);
    totalHydrants += total; totalDone += completedCount;
    const job = (jobs||[]).find(j => j.company_id === companyId && j.block === block);
    const compName = state.companies.find(c=>c.id===companyId)?.name || '—';
    rows.push({ compName, block, total, completedCount, pct: total ? Math.round(completedCount/total*100) : 0, status: job ? job.status : 'not started' });
  }
  rows.sort((a,b)=> compareCompanyNames(a.compName,b.compName) || a.block.localeCompare(b.block));
  const overallPct = totalHydrants ? Math.round(totalDone/totalHydrants*100) : 0;

  const jobIds = (jobs||[]).map(j=>j.id);
  const { data: sessionIds } = jobIds.length ? await sb.from('sessions').select('id').in('job_id', jobIds) : { data: [] };
  const sIds = (sessionIds||[]).map(s=>s.id);
  const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  const { data: recentTests } = sIds.length ? await sb.from('hydrant_tests').select('hydrant_id, tested_at').in('session_id', sIds).gte('tested_at', sevenDaysAgo) : { data: [] };
  const thisWeekCount = new Set((recentTests||[]).map(r=>r.hydrant_id)).size;

  main.innerHTML = backBar('All Campaigns', 'topBackBtn') + `
    <div class="card">
      <h3 style="margin-top:0;">${esc(campaign.name)}</h3>
      <div class="hint">${esc(ACTIVITY_LABELS[campaign.activity_type])} · ${campaign.status === 'open' ? 'Open' : 'Closed ' + fmtDate(campaign.closed_at)} · started ${fmtDate(campaign.created_at)}</div>
      <div class="progress-bar"><div class="fill" style="width:${overallPct}%;"></div></div>
      <div style="font-size:14px;font-weight:700;">${overallPct}% complete (${totalDone} of ${totalHydrants} hydrants) · ${thisWeekCount} tested this week</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="small" id="editCampBtn">Edit</button>
        ${campaign.status==='open' ? '<button class="small danger" id="closeCampBtn">Close Campaign</button>' : '<button class="small ok" id="reopenCampBtn">Reopen Campaign</button>'}
        <button class="small neutral" id="exportCsvBtn">Export CSV</button>
        <button class="small neutral" id="exportPdfBtn">Export PDF</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">By Company / List</h3>
      <table class="report"><thead><tr><th>Company</th><th>List</th><th>Complete</th><th>%</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.compName)}</td><td>${esc(r.block)}</td><td>${r.completedCount}/${r.total}</td><td>${r.pct}%</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table>
    </div>`;

  document.getElementById('topBackBtn').onclick = renderCampaignsTab;
  document.getElementById('editCampBtn').onclick = ()=> openCampaignFormModal(campaign, ()=>renderCampaignDetail(campaignId));
  const closeBtn = document.getElementById('closeCampBtn');
  if(closeBtn) closeBtn.onclick = async ()=>{
    if(!confirm('Close this campaign? End date will be set to the last actual hydrant entry.')) return;
    await closeCampaignWithComputedEndDate(campaignId);
    renderCampaignDetail(campaignId);
  };
  const reopenBtn = document.getElementById('reopenCampBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{
    await sb.from('campaigns').update({ status:'open', closed_at:null }).eq('id', campaignId);
    renderCampaignDetail(campaignId);
  };

  async function getCampaignScopedRows(){
    const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id, division_id), sessions(activity_type, tested_at)');
    return (data||[]).filter(r => r.sessions && r.sessions.activity_type === campaign.activity_type && new Date(r.tested_at) >= cutoff
      && (!eligibleCompanyIds || eligibleCompanyIds.has(r.hydrants?.company_id)));
  }
  document.getElementById('exportCsvBtn').onclick = async ()=>{
    const rows = await getCampaignScopedRows();
    if(!rows.length){ toast('No data to export'); return; }
    const headers = ['Hydrant','Address','Company','Division','Date','Static','Residual','Pitot','Flow','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
    const out = rows.map(r => {
      const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
      const divName = state.divisions.find(d=>d.id===r.hydrants?.division_id)?.name || '';
      return [r.hydrants?.hydrant_number, r.hydrants?.address, compName, divName, fmtDate(r.tested_at), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes];
    });
    const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const csv = [headers.join(','), ...out.map(r=>r.map(esc2).join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'campaign-'+campaignId.slice(0,8)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  document.getElementById('exportPdfBtn').onclick = async ()=>{
    const rows = await getCampaignScopedRows();
    if(!rows.length){ toast('No data to export'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(16); doc.text(campaign.name, 14, 16);
    doc.setFontSize(10); doc.text('Generated ' + fmtDate(new Date()) + '  ·  ' + rows.length + ' records', 14, 23);
    const headers = ['Hydrant','Address','Company','Division','Date','Condition','Wet/Dry','Notes'];
    const body = rows.map(r => {
      const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
      const divName = state.divisions.find(d=>d.id===r.hydrants?.division_id)?.name || '';
      const cond = r.condition || r.snow_cleared_status || '';
      return [r.hydrants?.hydrant_number||'', r.hydrants?.address||'', compName, divName, fmtDate(r.tested_at), cond, r.wet_dry||'', r.notes||''];
    });
    doc.autoTable({ head: [headers], body, startY: 28, styles:{fontSize:8}, headStyles:{fillColor:[26,26,26]} });
    doc.save('campaign-'+campaignId.slice(0,8)+'.pdf');
    toast('PDF downloaded');
  };
}

function getReportHydrants(){
  let hydrants = state.hydrants;
  if(reportSelectedCompanyIds.size > 0) hydrants = hydrants.filter(h => reportSelectedCompanyIds.has(h.company_id));
  return hydrants;
}

async function loadReportSummary(){
  const summaryEl = document.getElementById('reportSummary');
  summaryEl.innerHTML = 'Loading…';
  const hydrants = getReportHydrants();
  const ids = hydrants.map(h=>h.id);
  const { data: tests } = ids.length ? await sb.from('hydrant_tests').select('*, sessions(activity_type)').in('hydrant_id', ids) : { data: [] };
  const relevant = (tests||[]).filter(t => t.sessions && t.sessions.activity_type === reportActivityFilter);
  const latestByHydrant = {};
  relevant.sort((a,b)=> new Date(b.tested_at) - new Date(a.tested_at)).forEach(t => { if(!latestByHydrant[t.hydrant_id]) latestByHydrant[t.hydrant_id] = t; });

  let rows = hydrants.map(h => {
    const t = latestByHydrant[h.id];
    const flagged = t && (t.condition==='repair' || t.condition==='oos' || t.snow_condition_flag || t.snow_cleared_status==='not_cleared');
    return { flagged, wet: t?.wet_dry === 'wet', neverTested: !t };
  });
  if(reportFlaggedOnly) rows = rows.filter(r => r.flagged);

  const totalCount = rows.length;
  const flaggedCount = rows.filter(r=>r.flagged).length;
  const wetCount = rows.filter(r=>r.wet).length;
  const neverTested = rows.filter(r=>r.neverTested).length;

  summaryEl.innerHTML = `
    <h3 style="margin-top:0;">Summary — ${esc(ACTIVITY_LABELS[reportActivityFilter])}</h3>
    <div class="stat-grid">
      <div class="stat"><div class="n">${totalCount}</div><div class="l">Hydrants in Scope</div></div>
      <div class="stat"><div class="n overdue">${flaggedCount}</div><div class="l">Flagged</div></div>
      <div class="stat"><div class="n">${wetCount}</div><div class="l">Wet</div></div>
      <div class="stat"><div class="n">${neverTested}</div><div class="l">Never Tested</div></div>
    </div>
    <div class="hint" style="margin-top:10px;">Use Custom Export below to generate the full CSV or PDF for this scope.</div>
  `;
}

async function fetchExportRows(){
  const from = document.getElementById('csv_from').value;
  const to = document.getElementById('csv_to').value;
  const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id, division_id), sessions(activity_type, session_date, company_id, division_id)');
  let rows = data || [];
  if(from) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) >= from);
  if(to) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) <= to);
  if(reportSelectedCompanyIds.size > 0) rows = rows.filter(r => reportSelectedCompanyIds.has(r.hydrants?.company_id));
  if(reportActivityFilter) rows = rows.filter(r => r.sessions?.activity_type === reportActivityFilter);
  if(exportWetDrySelected.size > 0) rows = rows.filter(r => exportWetDrySelected.has(r.wet_dry));
  if(exportStatusSelected.size > 0) rows = rows.filter(r => exportStatusSelected.has(r.condition) || exportStatusSelected.has(r.snow_cleared_status) || exportStatusSelected.has(r.snow_condition_flag));
  return rows;
}

async function generateCustomCsv(){
  const rows = await fetchExportRows();
  if(!rows.length){ toast('No matching data'); return; }
  const headers = ['Hydrant','Address','Company','Division','Activity','Date','Static','Residual','Pitot','Flow','Drop%','Flow@20psi','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
  const out = rows.map(r => {
    const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
    const divName = state.divisions.find(d=>d.id===r.hydrants?.division_id)?.name || '';
    return [r.hydrants?.hydrant_number, r.hydrants?.address, compName, divName, ACTIVITY_LABELS[r.sessions?.activity_type] || '',
      fmtDate(r.tested_at), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.drop_pct, r.flow_at_20psi,
      r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes];
  });
  const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [headers.join(','), ...out.map(r=>r.map(esc2).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hydrant-report-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

async function generateCustomPdf(){
  const rows = await fetchExportRows();
  if(!rows.length){ toast('No matching data'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  doc.setFontSize(16);
  doc.text('Lynn Fire Department — Hydrant Report', 14, 16);
  doc.setFontSize(10);
  doc.text('Generated ' + fmtDate(new Date()) + '  ·  ' + rows.length + ' records', 14, 23);
  const headers = ['Hydrant','Address','Company','Division','Activity','Date','Condition','Wet/Dry','Flow (gpm)','Notes'];
  const body = rows.map(r => {
    const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
    const divName = state.divisions.find(d=>d.id===r.hydrants?.division_id)?.name || '';
    const cond = r.condition || r.snow_cleared_status || '';
    return [r.hydrants?.hydrant_number||'', r.hydrants?.address||'', compName, divName,
      ACTIVITY_LABELS[r.sessions?.activity_type]||'', fmtDate(r.tested_at), cond, r.wet_dry||'', r.flow_gpm??'', r.notes||''];
  });
  doc.autoTable({ head: [headers], body, startY: 28, styles: { fontSize: 8 }, headStyles: { fillColor: [26,26,26] } });
  doc.save('hydrant-report-'+new Date().toISOString().slice(0,10)+'.pdf');
  toast('PDF downloaded');
}

// ============================================================
// CHIEF: SETTINGS
// ============================================================
function markDirty(btnId){ const b = document.getElementById(btnId); if(b) b.classList.add('unsaved'); }
function clearDirty(btnId){ const b = document.getElementById(btnId); if(b) b.classList.remove('unsaved'); }

function renderSettingsTab(){
  const main = document.getElementById('main');
  const chiefCompanies = state.companies.filter(c=>c.is_chief);
  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Testing Settings</h3>
      <div class="field"><label>Default Retest Interval (months)</label><input id="s_retest" type="number" value="${state.settings.default_retest_interval_months || 12}"></div>
      <div class="field"><label>Default Discharge Coefficient</label><input id="s_coeff" type="number" step="0.01" value="${state.settings.default_discharge_coeff || 0.9}"></div>
      <button class="primary" id="saveSettings">Save Settings</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Company Login Code</h3>
      <div class="hint" style="margin-bottom:10px;">Shared password used by every non-chief company to sign in.</div>
      <div class="field"><input type="text" id="sharedCodeInput" value="${esc(sharedCode())}"></div>
      <button class="primary" id="saveSharedCodeBtn">Save Login Code</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Chief Login Codes</h3>
      <div class="hint" style="margin-bottom:10px;">Each chief-level login has its own individual password.</div>
      ${chiefCompanies.map(c => `<div class="field"><label>${esc(c.name)}</label><input type="text" class="companyCodeInput" data-company="${c.id}" value="${esc(c.access_code||'')}"></div>`).join('') || '<div class="hint">No chief-level companies yet.</div>'}
      <button class="primary" id="saveCodesBtn">Save Chief Codes</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Chief-Level Access</h3>
      <div class="hint" style="margin-bottom:10px;">These logins see all companies' data instead of their own hydrant list.</div>
      ${state.companies.map(c => `<label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px;"><input type="checkbox" class="chiefFlag" data-company="${c.id}" style="width:auto;" ${c.is_chief?'checked':''}> ${esc(c.name)}</label>`).join('')}
      <button class="primary" id="saveChiefBtn">Save Chief Access</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Add Company</h3>
      <div class="field"><label>Name</label><input type="text" id="newCompanyName" placeholder="e.g. EMS 1"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;"><input type="checkbox" id="newCompanyChief" style="width:auto;"> Chief-level access</label>
      <div class="field"><label>Login Code</label><input type="text" id="newCompanyCode" value="${esc(sharedCode())}" disabled></div>
      <button class="primary" id="addCompanyBtn">Add Company</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Export</h3>
      <button class="secondary" id="exportBtn">Download Full Backup (CSV)</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Roster (read-only preview)</h3>
      <div style="font-size:13px;">${state.hydrants.length} hydrants · ${state.members.length} members · ${state.companies.length} companies</div>
    </div>`;

  document.querySelectorAll('#s_retest, #s_coeff').forEach(el=> el.addEventListener('input', ()=>markDirty('saveSettings')));
  document.getElementById('sharedCodeInput').addEventListener('input', ()=>markDirty('saveSharedCodeBtn'));
  document.querySelectorAll('.companyCodeInput').forEach(el=> el.addEventListener('input', ()=>markDirty('saveCodesBtn')));
  document.querySelectorAll('.chiefFlag').forEach(el=> el.addEventListener('change', ()=>markDirty('saveChiefBtn')));

  document.getElementById('saveSettings').onclick = async ()=>{
    await sb.from('app_settings').upsert([
      { key:'default_retest_interval_months', value: document.getElementById('s_retest').value },
      { key:'default_discharge_coeff', value: document.getElementById('s_coeff').value },
    ]);
    toast('Settings saved'); clearDirty('saveSettings'); loadRefData();
  };
  document.getElementById('saveSharedCodeBtn').onclick = async ()=>{
    await sb.from('app_settings').upsert([{ key:'shared_company_login_code', value: document.getElementById('sharedCodeInput').value }]);
    toast('Login code saved'); clearDirty('saveSharedCodeBtn'); loadRefData();
  };
  document.getElementById('saveCodesBtn').onclick = async ()=>{
    const updates = Array.from(document.querySelectorAll('.companyCodeInput')).map(input => ({ id: input.dataset.company, access_code: input.value }));
    for(const u of updates) await sb.from('companies').update({ access_code: u.access_code }).eq('id', u.id);
    toast('Chief codes saved'); clearDirty('saveCodesBtn'); loadRefData();
  };
  document.getElementById('saveChiefBtn').onclick = async ()=>{
    const updates = Array.from(document.querySelectorAll('.chiefFlag')).map(cb => ({ id: cb.dataset.company, is_chief: cb.checked }));
    for(const u of updates) await sb.from('companies').update({ is_chief: u.is_chief }).eq('id', u.id);
    toast('Chief access saved'); clearDirty('saveChiefBtn'); loadRefData();
  };

  const chiefCheckbox = document.getElementById('newCompanyChief');
  const codeInput = document.getElementById('newCompanyCode');
  chiefCheckbox.addEventListener('change', ()=>{
    if(chiefCheckbox.checked){ codeInput.disabled = false; codeInput.value = ''; codeInput.placeholder = 'Enter a unique password'; }
    else { codeInput.disabled = true; codeInput.value = sharedCode(); }
  });
  document.getElementById('addCompanyBtn').onclick = async ()=>{
    const name = document.getElementById('newCompanyName').value.trim();
    const isChief = chiefCheckbox.checked;
    const code = isChief ? codeInput.value.trim() : sharedCode();
    if(!name){ toast('Enter a name'); return; }
    if(isChief && !code){ toast('Enter a login code for this chief login'); return; }
    const { error } = await sb.from('companies').insert({ name, access_code: code, is_chief: isChief });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Company added');
    await loadRefData();
    renderSettingsTab();
  };

  document.getElementById('exportBtn').onclick = async ()=>{
    const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number,address)');
    if(!data || !data.length){ toast('No data yet'); return; }
    const headers = ['Hydrant','Address','Date','Static','Residual','Pitot','Flow','Drop%','Flow@20psi','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
    const rows = data.map(r=>[r.hydrants?.hydrant_number, r.hydrants?.address, fmtDate(r.tested_at), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.drop_pct, r.flow_at_20psi, r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes]);
    const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const csv = [headers.join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hydrant-backup-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
</body>
</html>
