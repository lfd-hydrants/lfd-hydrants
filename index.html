function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Builds a real .xlsx file (not a text CSV) so exports open with actual
// spreadsheet structure — real column widths, merged/spanning title
// rows — rather than plain text Excel has to guess at formatting for.
// headerBlockRows: array of single-cell title/subtitle rows (e.g.
// [['Report Title'], ['Generated: ...']]) shown above the data, each
// automatically merged across the full column width.
function downloadXlsx(filename, headerBlockRows, columnHeaders, dataRows){
  const wb = XLSX.utils.book_new();
  const aoa = [...headerBlockRows, columnHeaders, ...dataRows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const colCount = columnHeaders.length;
  const widths = columnHeaders.map((h, c) => {
    let maxLen = (h||'').toString().length;
    dataRows.forEach(row => {
      const len = (row[c]==null ? '' : row[c].toString()).length;
      if(len > maxLen) maxLen = len;
    });
    return { wch: Math.min(Math.max(maxLen+2, 8), 50) };
  });
  ws['!cols'] = widths;
  ws['!merges'] = headerBlockRows.map((row,i)=> (row && row.length && row[0]) ? { s:{r:i,c:0}, e:{r:i,c:colCount-1} } : null).filter(Boolean);
  XLSX.utils.book_append_sheet(wb, ws, 'Report');
  const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const blob = new Blob([wbout], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function attachDatePicker(id){

function fmtDate(d){
  if(!d) return '—';
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date)) return '—';
  const mm = String(date.getMonth()+1).padStart(2,'0');
  const dd = String(date.getDate()).padStart(2,'0');
  return `${mm}/${dd}/${date.getFullYear()}`;
}
function fmtDateTime(d){
  if(!d) return '—';
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date)) return '—';
  return `${fmtDate(date)} ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
}
function companySortKey(name){
  const eng = name.match(/^Engine\s+(\d+)/i);
  if(eng) return [0, parseInt(eng[1])];
  const lad = name.match(/^Ladder\s+(\d+)/i);
  if(lad) return [1, parseInt(lad[1])];
  return [2, name];
}
function compareCompanyNames(a,b){
  const ka=companySortKey(a), kb=companySortKey(b);
  if(ka[0]!==kb[0]) return ka[0]-kb[0];
  if(typeof ka[1]==='number' && typeof kb[1]==='number') return ka[1]-kb[1];
  return String(ka[1]).localeCompare(String(kb[1]));
}

async function init(){

    if(event === 'PASSWORD_RECOVERY'){ renderSetNewPassword(); }
  });

    const { error } = await sb.auth.signInAnonymously();
    if(error){ app.innerHTML = '<div class="login-wrap"><div class="card">Connection error: '+esc(error.message)+'</div></div>'; return; }
  }
  // Deliberately NOT restoring a previous login from localStorage —
  // every page load starts fresh at the login screen. This also
  // avoids a stale/deleted company (like the retired C1/C2/C4 logins)
  // ever silently resurfacing from an old cached session.
  await loadRefData();
  if(!showingPasswordRecovery) render();
}

async function fetchAllRows(table, filters){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while(true){
    let q = sb.from(table).select('*').range(from, from + pageSize - 1);
    if(filters) q = filters(q);
    const { data, error } = await q;
    if(error){ console.error(table, error.message); break; }
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

async function loadRefData(){
  const [c, d, m, s] = await Promise.all([
    sb.from('companies').select('*').order('name'),
    sb.from('divisions').select('*').order('name'),
    sb.from('members').select('*').eq('active', true).order('name'),
    sb.from('app_settings').select('*'),
  ]);
  const hydrants = await fetchAllRows('hydrants', q => q.eq('active', true).order('hydrant_number'));
  state.companies = (c.data || []).sort((a,b)=>compareCompanyNames(a.name,b.name));
  state.divisions = d.data || [];
  state.members = m.data || [];
  state.hydrants = hydrants;
  state.settings = {};
  (s.data || []).forEach(row => state.settings[row.key] = row.value);
}

function typeaheadHtml(id, placeholder){
  return `
    <div style="position:relative;">
      <input type="text" id="${id}_text" placeholder="${esc(placeholder)}" autocomplete="off">
      <input type="hidden" id="${id}_value">
      <div class="search-results" id="${id}_results" style="display:none;position:absolute;left:0;right:0;background:#fff;z-index:5;"></div>
    </div>`;
}
function wireTypeahead(id, items, onSelect){
  const textInput = document.getElementById(id+'_text');
  const hiddenInput = document.getElementById(id+'_value');
  const results = document.getElementById(id+'_results');
  textInput.addEventListener('focus', ()=>renderList(items));
  textInput.addEventListener('input', ()=>{
    hiddenInput.value = '';
    const q = textInput.value.trim().toLowerCase();
    renderList(q ? items.filter(m=>m.name.toLowerCase().includes(q)) : items);
  });
  document.addEventListener('click', (e)=>{
    if(!textInput.contains(e.target) && !results.contains(e.target)) results.style.display='none';
  });
  function renderList(matches){
    if(!matches.length){ results.style.display='none'; return; }
    results.innerHTML = matches.slice(0,30).map(m=>`<div class="search-result-item" data-id="${m.id}">${esc(m.name)}</div>`).join('');
    results.style.display = 'block';
    results.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        const m = items.find(x=>x.id===el.dataset.id);
        textInput.value = m.name; hiddenInput.value = m.id;
        results.style.display = 'none';
        if(onSelect) onSelect(m);
      };
    });
  }
}

function renderCompanyLogin(){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="card">
        <h2 style="margin-top:0;">LFD Hydrant Testing</h2>
        <form autocomplete="off" onsubmit="return false;">

            <div class="search-results" id="loginCompany_results" style="display:none;position:absolute;left:0;right:0;background:#fff;z-index:5;"></div>
          </div>
        </div>
        <div class="field"><label>Password</label><input id="loginPass" name="lfd_field_p9z" type="password" autocomplete="new-password" readonly></div>
        <button class="primary" type="button" id="loginBtn">Sign In</button>
        </form>
        <button class="secondary" id="loginHelpBtn">Help &amp; How-To</button>
      </div>
    </div>`;
  document.getElementById('loginHelpBtn').onclick = ()=> renderHelpScreen(renderCompanyLogin);
  ['loginCompany_text','loginPass'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('focus', ()=> el.removeAttribute('readonly'));
  });
  document.getElementById('loginPass').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('loginBtn').click(); }
  });
  wireTypeahead('loginCompany', state.companies);
  document.getElementById('loginBtn').onclick = async ()=>{
    const idFromClick = document.getElementById('loginCompany_value').value;
    const idText = document.getElementById('loginCompany_text').value.trim();
    const pass = document.getElementById('loginPass').value;
    if(!idText){ toast('Enter a company'); return; }

    const company = idFromClick
      ? state.companies.find(c => c.id === idFromClick)
      : state.companies.find(c => c.name.toLowerCase() === idText.toLowerCase());
    if(company){
      if(!pass || pass !== sharedCode()){ toast('Incorrect password'); return; }
      state.company = { id: company.id, name: company.name };
      localStorage.setItem('lfd_company', JSON.stringify(state.company));
      render();
      return;
    }
    // Not a company — check if this is a privileged (admin) login.
    // Real Supabase Auth verifies the password now, not an app-level
    // string comparison, so this is genuinely enforced by the database.
    const { data: privRow } = await sb.from('privileged_logins').select('*').ilike('username', idText).maybeSingle();
    if(privRow && pass){
      const { data: authData, error: authError } = await sb.auth.signInWithPassword({ email: privRow.auth_email, password: pass });
      if(!authError && authData.user){
        state.superAdmin = { username: privRow.username };
        localStorage.setItem('lfd_super_admin', JSON.stringify(state.superAdmin));
        render();
        return;
      }
    }
    toast('Incorrect login');
  };
}

async function clearLogin(){
  state.company = null; state.division = null; state.block = null; state.superAdmin = null; state.isChief = false;
  state.tab = 'new';
  localStorage.removeItem('lfd_company'); localStorage.removeItem('lfd_division');

  localStorage.removeItem('lfd_super_admin'); localStorage.removeItem('lfd_active_session_id');
  // If the outgoing session was a real privileged login (not the shared
  // anonymous one companies use), sign out of it and re-establish an
  // anonymous session so company logins keep working correctly next.
  const { data: sessionData } = await sb.auth.getSession();
  if(sessionData.session && !sessionData.session.user.is_anonymous){
    await sb.auth.signOut();
    await sb.auth.signInAnonymously();
  }
}

function blockLabel(block){
  return block === 'ALL' ? 'Complete List' : `List ${block}`;
}
async function computeCompletionForCompanyBlock(companyId, block, activityType, cutoffDate){
  const hydrantsFor = block === 'ALL'
    ? state.hydrants.filter(h => h.company_id === companyId)
    : state.hydrants.filter(h => h.company_id === companyId && h.block === block);
  const ids = hydrantsFor.map(h=>h.id);
  if(ids.length === 0) return { pending: [], total: 0, completedCount: 0 };
  const { data } = await sb.from('hydrant_tests').select('hydrant_id, tested_at, static_psi, residual_psi, pitot_psi, unable_to_test, sessions(activity_type)').in('hydrant_id', ids);
  const doneIds = new Set();
  (data||[]).forEach(r => {
    if(!r.sessions || r.sessions.activity_type !== activityType) return;
    if(new Date(r.tested_at) < cutoffDate) return;
    if(activityType === 'flow_test'){
      // A flow test only counts as genuinely finished if it has all
      // three readings, or the crew explicitly marked it Unable to
      // Test — an entry saved incomplete (missing readings, no
      // Unable-to-Test override) does NOT count as done, so the
      // hydrant correctly stays on the pending list until it's
      // actually finished.
      const complete = r.unable_to_test || (r.static_psi != null && r.residual_psi != null && r.pitot_psi != null);
      if(complete) doneIds.add(r.hydrant_id);
    } else {
      doneIds.add(r.hydrant_id);
    }
  });
  const pending = hydrantsFor.filter(h => !doneIds.has(h.id));
  return { pending, total: hydrantsFor.length, completedCount: hydrantsFor.length - pending.length };
}
async function computeJobPending(job){
  return computeCompletionForCompanyBlock(job.company_id, job.block, job.activity_type, new Date(job.created_at));
}

let preselectHydrantId = null;

async function computeCompanyIncompleteInspections(companyId){
  const companyHydrantIds = new Set(state.hydrants.filter(h=>h.company_id===companyId).map(h=>h.id));
  const allTests = await fetchAllHydrantTestsWithSession();
  const latestFlowTestByHydrant = {};
  allTests.forEach(x => {
    if(companyHydrantIds.has(x.hydrant_id) && x.sessions?.activity_type === 'flow_test' && !latestFlowTestByHydrant[x.hydrant_id]){
      latestFlowTestByHydrant[x.hydrant_id] = x;
    }
  });
  const incompleteIds = Object.keys(latestFlowTestByHydrant).filter(hid => {
    const test = latestFlowTestByHydrant[hid];
    if(test.unable_to_test) return false;
    return test.static_psi == null || test.residual_psi == null || test.pitot_psi == null;
  });
  return state.hydrants.filter(h=>incompleteIds.includes(h.id))
    .sort((a,b)=> a.hydrant_number.localeCompare(b.hydrant_number, undefined, {numeric:true}));
}

// Jumps straight into a Flow Test entry for a specific hydrant, even
// though it technically already has an entry (just an incomplete
// one) so it wouldn't normally appear in a job's pending list. Resumes
// or creates whatever job/shift is needed for that hydrant's own
// block, matching the normal Start New Job flow, then pre-selects the
// hydrant once the entry form is up.
async function goToFlowTestForHydrant(hydrant){
  state.block = hydrant.block;
  localStorage.setItem('lfd_block', state.block);
  preselectHydrantId = hydrant.id;

  const { data: existingJob } = await sb.from('jobs').select('*')
    .eq('company_id', state.company.id).eq('block', state.block)
    .eq('activity_type', 'flow_test').eq('status','open').maybeSingle();

  if(existingJob){
    const { data: openShift } = await sb.from('sessions').select('*').eq('job_id', existingJob.id).eq('status','open').maybeSingle();
    state.activeJob = existingJob;
    if(openShift){
      state.activeSession = openShift;
      localStorage.setItem('lfd_active_session_id', openShift.id);
      renderHydrantEntry();
    } else {
      offerSameDayCrewResume(existingJob);
    }
  } else {
    renderStartShift({ activityType: 'flow_test' }, null);
  }
}

      await sb.from('sessions').update({ status:'closed', ended_at: new Date().toISOString() }).eq('job_id', btn.dataset.closejob).eq('status','open');
      toast('Job closed permanently');
      renderCompanyHome();
    };
  });
  main.querySelectorAll('[data-reopenshift]').forEach(btn=>{
    btn.onclick = async ()=>{
      await sb.from('sessions').update({ status:'open', ended_at:null }).eq('id', btn.dataset.reopenshift);
      toast('Shift reopened'); renderCompanyHome();
    };
  });
  main.querySelectorAll('[data-reopenjob]').forEach(btn=>{
    btn.onclick = async ()=>{
      await sb.from('jobs').update({ status:'open', closed_at:null }).eq('id', btn.dataset.reopenjob);
      toast('Job reopened'); renderCompanyHome();
    };
  });
}

// ---- Same-day crew resume prompt ----
async function offerSameDayCrewResume(job){
  const { data: lastShift } = await sb.from('sessions').select('*')
    .eq('job_id', job.id).eq('status','closed').order('started_at', {ascending:false}).limit(1).maybeSingle();
  const todayStr = new Date().toISOString().slice(0,10);
  if(!lastShift || lastShift.session_date !== todayStr){
    renderStartShift({ job }, null);
    return;
  }
  const oicName = state.members.find(m=>m.id===lastShift.oic_member_id)?.name || '—';
  const crewNames = (lastShift.crew_member_ids||[]).map(id=>state.members.find(m=>m.id===id)?.name).filter(Boolean);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="card modal-card">
      <h3 style="margin-top:0;">Continue with same crew?</h3>
      <div class="hint" style="margin-bottom:10px;">This job already had a shift today.</div>
      <div style="font-size:14px;margin-bottom:14px;"><b>OIC:</b> ${esc(oicName)}<br><b>Crew:</b> ${crewNames.length ? esc(crewNames.join(', ')) : '—'}</div>
      <button class="primary" id="sameCrewYesBtn">Yes — Continue</button>
      <button class="secondary" id="sameCrewNoBtn">No — New Shift Details</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('sameCrewYesBtn').onclick = async ()=>{
    const { data, error } = await sb.from('sessions').insert({
      job_id: job.id, company_id: job.company_id, activity_type: job.activity_type,
      division_id: lastShift.division_id, oic_member_id: lastShift.oic_member_id,
      crew_member_ids: lastShift.crew_member_ids, session_date: todayStr,
      started_at: new Date().toISOString(), status: 'open',
    }).select().single();
    overlay.remove();
    if(error){ toast('Error: ' + error.message); return; }
    localStorage.setItem('lfd_active_session_id', data.id);
    state.activeJob = job; state.activeSession = data;
    toast('Shift started with same crew');
    renderHydrantEntry();
  };
  document.getElementById('sameCrewNoBtn').onclick = ()=>{
    overlay.remove();
    renderStartShift({ job }, null);
  };
}

function renderReportHydrant(backTo){
  backTo = backTo || renderCompanyHome;
  const main = document.getElementById('main');
  let selectedId = null;
  let condition = null;

  main.innerHTML = backBar('Back', 'topBackBtn') + `
    <div class="card">
      <h3 style="margin-top:0;">Report Hydrant</h3>
      <div class="hint" style="margin-bottom:12px;">For flagging a hydrant on sight — no job or shift needed.</div>
      <div class="field"><label>Search Hydrant</label>
        <input type="text" id="rh_search" placeholder="Search by number or address…">
        <div class="search-results" id="rh_results" style="display:none;"></div>
      </div>
      <div id="rh_selected" class="hint" style="margin-bottom:12px;"></div>
      <div class="field"><label>Condition</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn" data-rh-cond="repair">Damaged</button>
          <button type="button" class="toggle-btn" data-rh-cond="oos">Out of Service</button>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="rh_notes" placeholder="What did you see?"></textarea></div>
      <button class="primary" id="rh_submitBtn">Report &amp; Notify</button>
    </div>`;
  document.getElementById('topBackBtn').onclick = ()=> guardNavigate(backTo);
  clearFormDirty();
  wireDirtyTracking(main);

  const input = document.getElementById('rh_search');
  const results = document.getElementById('rh_results');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.style.display='none'; results.innerHTML=''; return; }
    const matches = state.hydrants.filter(h => h.hydrant_number.toLowerCase().includes(q) || (h.address||'').toLowerCase().includes(q))
      .sort((a,b)=> (a.address||'').localeCompare(b.address||''))
      .slice(0, 20);
    results.style.display = matches.length ? 'block' : 'none';
    results.innerHTML = matches.map(h => {
      const comp = state.companies.find(c=>c.id===h.company_id)?.name || '—';
      return `<div class="search-result-item" data-id="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')}<small>${esc(comp)} · List ${esc(h.block||'—')}</small></div>`;
    }).join('');
    results.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        selectedId = el.dataset.id;
        markFormDirty();
        const h = state.hydrants.find(x=>x.id===selectedId);
        input.value = h.hydrant_number;
        results.style.display = 'none';
        document.getElementById('rh_selected').textContent = `Selected: ${h.hydrant_number} — ${h.address||''}`;
      };
    });
  });

  main.querySelectorAll('[data-rh-cond]').forEach(btn=>{
    btn.onclick = ()=>{
      condition = btn.dataset.rhCond;
      markFormDirty();
      main.querySelectorAll('[data-rh-cond]').forEach(b=>{ b.classList.toggle('active', b===btn); b.classList.remove('bad'); });
      btn.classList.add('active','bad');
    };
  });

  document.getElementById('rh_submitBtn').onclick = async ()=>{
    if(!selectedId){ toast('Search and select a hydrant'); return; }
    if(!condition){ toast('Select Damaged or Out of Service'); return; }
    const notes = document.getElementById('rh_notes').value || null;
    const { error } = await sb.from('hydrant_tests').insert({
      hydrant_id: selectedId, session_id: null, condition,
      reported_by_company_id: state.company.id, notes,
    });
    if(error){ toast('Error: ' + error.message); return; }
    clearFormDirty();
    toast('Hydrant reported');

    const h = state.hydrants.find(x=>x.id===selectedId);
    const companyRow = state.companies.find(c=>c.id===state.company.id);
    const recipients = (state.settings.report_hydrant_emails || '').split(',').map(s=>s.trim()).filter(Boolean).join(',');
    const ccEmail = companyRow?.email || '';
    if(recipients || ccEmail){
      const condLabel = condition === 'oos' ? 'Out of Service' : 'Damaged';
      const subject = encodeURIComponent(`Hydrant Report: ${h.hydrant_number} — ${condLabel}`);
      const body = encodeURIComponent(
        `Hydrant: ${h.hydrant_number}\nAddress: ${h.address||''}\nCondition: ${condLabel}\nReported by: ${state.company.name}\nDate: ${fmtDate(new Date())}\n\nNotes:\n${notes||'(none)'}`
      );
      const ccParam = ccEmail ? `&cc=${encodeURIComponent(ccEmail)}` : '';
      window.location.href = `mailto:${recipients}?subject=${subject}${ccParam}&body=${body}`;
    } else {
      toast('No notification emails configured in Settings');
    }
    backTo();
  };
}

async function getOrCreateCampaign(activityType){
  const { data: existing } = await sb.from('campaigns').select('*')
    .eq('activity_type', activityType).eq('status','open')
    .order('created_at', {ascending:false}).limit(1).maybeSingle();
  if(existing) return existing;
  const label = ACTIVITY_LABELS[activityType] + ' — started ' + new Date().toLocaleDateString([], {month:'long', year:'numeric'});
  const { data: newCampaign, error } = await sb.from('campaigns').insert({ name: label, activity_type: activityType, status:'open' }).select().single();
  if(error){ console.error('Campaign creation failed:', error.message); return null; }
  return newCampaign;
}

function renderStartShift(prefill, editingSession){
  const main = document.getElementById('main');
  const isEdit = !!editingSession;
  sessionCrew = isEdit
    ? (editingSession.crew_member_ids || []).map(id => state.members.find(m=>m.id===id)).filter(Boolean).map(m=>({id:m.id, name:m.name}))
    : [];
  const today = new Date().toISOString().slice(0,10);
  const activityType = isEdit ? state.activeJob.activity_type : (prefill.job ? prefill.job.activity_type : prefill.activityType);

  main.innerHTML = backBar(isEdit ? 'Back to Job' : 'Home', 'topBackBtn') + `
    <div class="card">
      <h3 style="margin-top:0;">${isEdit ? 'Shift Settings' : 'Start Shift'}</h3>
      <div class="hint" style="margin-bottom:12px;">${esc(state.company.name)} · ${esc(ACTIVITY_LABELS[activityType])}</div>
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${isEdit ? editingSession.session_date : today}"></div>
      <div class="field"><label>Division</label>
        <select id="f_division">${state.divisions.map(d=>`<option value="${d.id}" ${(isEdit ? editingSession.division_id===d.id : state.division.id===d.id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>OIC</label>${memberTypeaheadHtml('f_oic', 'Type a name…')}</div>
      <div class="field"><label>Crew</label>
        <div class="row2">
          <div>${memberTypeaheadHtml('f_crew_pick', 'Type a name…')}</div>
          <button type="button" class="secondary" id="addCrewBtn" style="margin-top:0;">Add</button>
        </div>
        <div id="crewList" style="margin-top:10px;"></div>
      </div>
      <button class="primary" id="startBtn">${isEdit ? 'Save Changes' : 'Start Shift'}</button>
    </div>`;
  attachDatePicker('f_date');
  document.getElementById('topBackBtn').onclick = ()=> guardNavigate(()=> isEdit ? renderHydrantEntry() : renderCompanyHome());

  wireTypeahead('f_oic', state.members);
  if(isEdit && editingSession.oic_member_id){
    const m = state.members.find(x=>x.id===editingSession.oic_member_id);
    if(m){ document.getElementById('f_oic_text').value = m.name; document.getElementById('f_oic_value').value = m.id; }
  }
  wireTypeahead('f_crew_pick', state.members);
  clearFormDirty();
  document.getElementById('f_date').addEventListener('input', markFormDirty);
  document.getElementById('f_division').addEventListener('change', markFormDirty);

  function renderCrewList(){
    const list = document.getElementById('crewList');
    if(sessionCrew.length === 0){ list.innerHTML = '<div class="hint">No crew added yet.</div>'; return; }
    list.innerHTML = sessionCrew.map(m => `
      <div style="display:flex;justify-content:space-between;align-items:center;background:#f1efe8;border-radius:5px;padding:7px 10px;margin-bottom:6px;font-size:13.5px;">
        <span>${esc(m.name)}</span>
        <button type="button" data-id="${m.id}" class="removeCrewBtn" style="background:none;border:none;color:var(--red-deep);font-weight:700;cursor:pointer;font-size:15px;">×</button>
      </div>`).join('');
    list.querySelectorAll('.removeCrewBtn').forEach(btn=>{
      btn.onclick = ()=>{ sessionCrew = sessionCrew.filter(m => m.id !== btn.dataset.id); renderCrewList(); };
    });
  }
  renderCrewList();

  document.getElementById('addCrewBtn').onclick = ()=>{
    const id = document.getElementById('f_crew_pick_value').value;
    if(!id){ toast('Pick a crew member first'); return; }
    if(sessionCrew.some(m => m.id === id)){ toast('Already added'); return; }
    const member = state.members.find(m => m.id === id);
    sessionCrew.push({ id: member.id, name: member.name });
    markFormDirty();
    document.getElementById('f_crew_pick_text').value = '';
    document.getElementById('f_crew_pick_value').value = '';
    renderCrewList();
  };

  document.getElementById('startBtn').onclick = async ()=>{
    const btn = document.getElementById('startBtn');
    const oic = document.getElementById('f_oic_value').value;
    const divisionId = document.getElementById('f_division').value;
    if(!oic){ toast('Select an OIC'); return; }
    btn.disabled = true;

    const payload = {
      session_date: document.getElementById('f_date').value,
      division_id: divisionId,
      oic_member_id: oic,
      crew_member_ids: sessionCrew.map(m => m.id),
    };

    if(isEdit){
      const { data, error } = await sb.from('sessions').update(payload).eq('id', editingSession.id).select().single();
      if(error){ toast('Error: ' + error.message); btn.disabled = false; return; }
      clearFormDirty();
      state.activeSession = data;
      toast('Shift updated');
      renderHydrantEntry();
    } else {
      let job = prefill.job;
      if(!job){
        const campaign = await getOrCreateCampaign(prefill.activityType);
        const { data: newJob, error: jobErr } = await sb.from('jobs').insert({
          company_id: state.company.id, block: state.block,
          activity_type: prefill.activityType, status: 'open',
          campaign_id: campaign ? campaign.id : null,
        }).select().single();
        if(jobErr){
          if(jobErr.code === '23505'){
            // Someone (this device double-tapping, or another device at
            // nearly the same moment) already created this exact job.
            // Recover gracefully instead of dead-ending on an error.
            const { data: existingJob } = await sb.from('jobs').select('*')
              .eq('company_id', state.company.id).eq('block', state.block)
              .eq('activity_type', prefill.activityType).eq('status','open').maybeSingle();
            if(existingJob){ job = existingJob; }
            else { toast('Error: ' + jobErr.message); btn.disabled = false; return; }
          } else {
            toast('Error: ' + jobErr.message); btn.disabled = false; return;
          }
        } else {
          job = newJob;
        }
      }
      const { data, error } = await sb.from('sessions').insert({
        ...payload, company_id: state.company.id, activity_type: job.activity_type,
        job_id: job.id, started_at: new Date().toISOString(), status: 'open',
      }).select().single();
      if(error){ toast('Error: ' + error.message); btn.disabled = false; return; }
      clearFormDirty();
      localStorage.setItem('lfd_active_session_id', data.id);
      state.activeJob = job; state.activeSession = data;
      toast('Shift started');
      renderHydrantEntry();
    }
  };
}

async function computeCampaignOverallStats(campaign){
  const cutoff = new Date(campaign.created_at);
  const eligibleCompanyIds = (campaign.company_ids && campaign.company_ids.length) ? new Set(campaign.company_ids) : null;
  const pairsMap = new Map();
  state.hydrants.forEach(h => {
    if(!h.company_id || !h.block) return;
    if(eligibleCompanyIds && !eligibleCompanyIds.has(h.company_id)) return;
    const key = h.company_id+'|'+h.block;
    if(!pairsMap.has(key)) pairsMap.set(key, {companyId:h.company_id, block:h.block});
  });
  let total = 0, done = 0;
  for(const {companyId, block} of pairsMap.values()){
    const r = await computeCompletionForCompanyBlock(companyId, block, campaign.activity_type, cutoff);
    total += r.total; done += r.completedCount;
  }
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

async function checkDuplicateToday(hydrantId, activityType){
  if(!hydrantId) return [];
  const today = new Date().toISOString().slice(0,10);
  const { data } = await sb.from('hydrant_tests').select('*, sessions(company_id, session_date, activity_type)').eq('hydrant_id', hydrantId);
  if(!data) return [];
  return data.filter(t => t.sessions && t.sessions.session_date === today && t.sessions.activity_type === activityType);
}
function dupWarningHtml(){ return '<div id="dupWarning"></div>'; }
async function wireDupWarning(hydrantId, activityType){
  const box = document.getElementById('dupWarning');
  if(!box) return;
  box.innerHTML = '';
  const dups = await checkDuplicateToday(hydrantId, activityType);
  if(dups.length){
    const d = dups[0];
    const compName = state.companies.find(c=>c.id === d.sessions?.company_id)?.name || 'another company';
    box.innerHTML = `<div class="hint" style="background:#f5e9dd;color:var(--warn);border-radius:5px;padding:8px 10px;margin:-4px 0 12px;font-weight:600;">⚠ Already done today (by ${esc(compName)}). You can still save if this is a recheck.</div>`;
  }
}

function renderFlowTestForm(main, headerHtml, pending, s, job){
  main.innerHTML = headerHtml + `

      ${hydrantPickerHtml(pending)}
      ${dupWarningHtml()}
      <div class="row3">
        <div class="field"><label>Static (psi)</label><input type="number" id="f_static"></div>

        <div class="calc-row"><span>% Drop</span><span class="v" id="c_drop">—%</span></div>
        <div class="calc-row"><span>Flow @ 20 psi</span><span class="v" id="c_flow20">— gpm</span></div>

    </div>`;

  document.getElementById('f_hydrant').addEventListener('change', (e)=>{ selectedHydrantId = e.target.value; updateLocationNotesDisplay(selectedHydrantId); wireDupWarning(selectedHydrantId, 'flow_test'); });
  wireHydrantPicker((id)=> wireDupWarning(id, 'flow_test'));
  wireSuggestedNextStop(pending);
  if(preselectHydrantId){
    const target = state.hydrants.find(h=>h.id===preselectHydrantId);
    if(target){
      selectedHydrantId = preselectHydrantId;
      const manualSearch = document.getElementById('manualSearch');
      if(manualSearch) manualSearch.value = target.hydrant_number;
      updateLocationNotesDisplay(selectedHydrantId);
      wireDupWarning(selectedHydrantId, 'flow_test');
      toast('Continue the incomplete reading for ' + target.hydrant_number);
    }
    preselectHydrantId = null;
  }
  clearFormDirty();
  wireDirtyTracking(main);

  const FIXED_C = parseFloat(state.settings.default_discharge_coeff) || 0.9;
  const FIXED_D = parseFloat(state.settings.default_outlet_size) || 2.5;
  const FIXED_N = parseFloat(state.settings.default_num_outlets) || 1;

  function calc(){
    const P = parseFloat(document.getElementById('f_pitot').value);
    const hs = parseFloat(document.getElementById('f_static').value);
    const hr = parseFloat(document.getElementById('f_residual').value);
    let flow=null, drop=null, flow20=null;
    if(!isNaN(P) && P>0) flow = 29.83 * FIXED_C * FIXED_D*FIXED_D * Math.sqrt(P) * FIXED_N;
    if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
    if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
    document.getElementById('c_flow').textContent = flow!==null ? Math.round(flow)+' gpm' : '— gpm';
    document.getElementById('c_drop').textContent = drop!==null ? drop.toFixed(1)+'%' : '—%';

    return {flow, drop, flow20};
  }
  ['f_pitot','f_static','f_residual'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calc);
  });
  document.getElementById('f_condition').addEventListener('change', (e)=>{

  });

    const hydrantId = selectedHydrantId || document.getElementById('f_hydrant').value;

      session_id: s.id, hydrant_id: hydrantId,
      static_psi: document.getElementById('f_static').value || null,
      residual_psi: document.getElementById('f_residual').value || null,
      pitot_psi: document.getElementById('f_pitot').value || null,
      orifice_diameter: FIXED_D,
      discharge_coeff: FIXED_C,
      num_outlets: FIXED_N,
      gauge_flow_gpm: document.getElementById('f_gauge_flow').value || null,
      flow_gpm: flow!==null ? Math.round(flow) : null,
      drop_pct: drop!==null ? drop.toFixed(1) : null,
      flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
      condition: document.getElementById('f_condition').value,
      wet_dry: document.getElementById('f_wet').checked ? 'wet' : 'dry',
      unable_to_test: document.getElementById('f_unable').checked,
      notes: document.getElementById('f_notes').value || null,
    });
    if(error){ toast('Error: ' + error.message); return; }
    clearFormDirty();
    toast('Saved — ready for next one');
    renderHydrantEntry();
  }

  document.getElementById('saveBtn').onclick = async ()=>{
    const hydrantId = selectedHydrantId || document.getElementById('f_hydrant').value;
    if(!hydrantId){ toast('Select a hydrant'); return; }
    if(document.getElementById('f_unable').checked){
      await doSaveFlowTest();
      return;
    }
    const missing = [];
    if(!document.getElementById('f_static').value) missing.push('Static');
    if(!document.getElementById('f_residual').value) missing.push('Residual');
    if(!document.getElementById('f_pitot').value) missing.push('Pitot');
    if(missing.length){
      openIncompleteFlowTestWarning(missing, doSaveFlowTest);
    } else {
      await doSaveFlowTest();
    }
  };
}

// ============================================================
// MASTER HYDRANT LIST — status color-coded, click for history, chief-only repair
// ============================================================
// A hydrant's flag is "sticky" — once any company logs it as Damaged or
// OOS, that stays the hydrant's status even if another company later logs
// a routine "Good" test on it. It only clears when an admin explicitly
// resets it via Mark Repaired. An admin reset is identified as a
// condition:'good' entry with no session_id (routine field entries always
// have a session_id; Report Hydrant never logs 'good').
// Returns { status, mostRecentFlag } — status is the WORST flag logged
// since the last reset (drives the color); mostRecentFlag (if different
// from status) is the latest flag logged, for "as of" context.
function computeHydrantStatus(tests){
  const sorted = [...tests].sort((a,b)=> new Date(b.tested_at) - new Date(a.tested_at));
  const resetEntry = sorted.find(t => t.condition === 'good' && !t.session_id);
  const resetTime = resetEntry ? new Date(resetEntry.tested_at) : null;

  function severity(t){
    if(t.condition==='oos' || t.snow_condition_flag==='oos') return 2;
    if(t.condition==='repair' || t.snow_condition_flag==='damaged') return 1;
    return 0;
  }
  const flagsSinceReset = sorted.filter(t => {
    if(severity(t) === 0) return false;
    if(resetTime && new Date(t.tested_at) <= resetTime) return false;
    return true;
  });

  if(!flagsSinceReset.length) return { status:'good', mostRecentFlag:null };

  const worst = flagsSinceReset.reduce((max,t)=> severity(t)>severity(max)?t:max, flagsSinceReset[0]);
  const mostRecent = flagsSinceReset[0]; // sorted newest-first, filter preserves order
  const worstStatus = severity(worst)===2 ? 'oos' : 'damaged';
  const mostRecentStatus = severity(mostRecent)===2 ? 'oos' : 'damaged';

  return {
    status: worstStatus,
    mostRecentFlag: mostRecentStatus !== worstStatus ? { status: mostRecentStatus, date: mostRecent.tested_at } : null,
  };
}

          </select>
        </div>
        <button class="secondary" id="seeAllBtn">See All Hydrants (Citywide)</button>
        <div class="btn-row" style="margin-top:10px;">
          <button class="small" id="mhSnapshotCsvBtn">Export Excel</button>
          <button class="small" id="mhSnapshotPdfBtn">Export PDF</button>
        </div>
        <div id="mhList" style="margin-top:10px;"></div>
      </div>`;
    document.getElementById('topBackBtn').onclick = opts.backTo;
    document.getElementById('mhCompany').addEventListener('change', (e)=>{ selCompany = e.target.value; renderList(); });
    document.getElementById('mhBlock').addEventListener('change', (e)=>{ selBlock = e.target.value; renderList(); });
    document.getElementById('mhStatus').addEventListener('change', (e)=>{ selStatus = e.target.value; renderList(); });
    document.getElementById('mhWetDry').addEventListener('change', (e)=>{ selWetDry = e.target.value; renderList(); });
    document.getElementById('mhSort').addEventListener('change', (e)=>{ sortBy = e.target.value; renderList(); });
    document.getElementById('seeAllBtn').onclick = ()=>{ selCompany=''; selBlock=''; selStatus=''; selWetDry=''; render(); };
    document.getElementById('mhSnapshotCsvBtn').onclick = ()=> exportMasterSnapshotCsv(currentSorted);
    document.getElementById('mhSnapshotPdfBtn').onclick = ()=> exportMasterSnapshotPdf(currentSorted);
    renderList();
  }

  function renderList(){
    let hydrants = state.hydrants;
    if(selCompany) hydrants = hydrants.filter(h=>h.company_id===selCompany);
    if(selBlock) hydrants = hydrants.filter(h=>h.block===selBlock);

    let withStatus = hydrants.map(h => ({ h, statusInfo: computeHydrantStatus(testsByHydrant[h.id] || []), wetDry: lastWetDry(h.id) }));
    if(selStatus) withStatus = withStatus.filter(x => x.statusInfo.status === selStatus);
    if(selWetDry) withStatus = withStatus.filter(x => x.wetDry === selWetDry);

    const severityOrder = { oos:0, damaged:1, good:2 };
    const compFns = {
      number: (a,b)=> a.h.hydrant_number.localeCompare(b.h.hydrant_number, undefined, {numeric:true}),
      address: (a,b)=> (a.h.address||'').localeCompare(b.h.address||''),
      company: (a,b)=> compareCompanyNames(state.companies.find(c=>c.id===a.h.company_id)?.name||'', state.companies.find(c=>c.id===b.h.company_id)?.name||''),
      block: (a,b)=> (a.h.block||'').localeCompare(b.h.block||''),
      status: (a,b)=> severityOrder[a.statusInfo.status] - severityOrder[b.statusInfo.status],
    };
    withStatus.sort(compFns[sortBy] || compFns.number);
    currentSorted = withStatus.map(x=>x.h);

    document.getElementById('mhList').innerHTML = withStatus.map(({h, statusInfo}) => {
      const s = statusInfo.status;
      const secondary = statusInfo.mostRecentFlag ? `<div class="hint" style="margin-left:22px;">Most recent: ${STATUS_LABELS[statusInfo.mostRecentFlag.status]} (${fmtDate(statusInfo.mostRecentFlag.date)})</div>` : '';
      return `<div data-hydrant="${h.id}">
        <div class="status-row">
          <span><span class="status-dot ${s}">${STATUS_SYMBOLS[s]}</span>${esc(h.hydrant_number)} — ${esc(h.address||'')}</span>
          <span class="status-badge ${s}">${STATUS_SYMBOLS[s]} ${STATUS_LABELS[s]}</span>
        </div>
        ${secondary}
      </div>`;
    }).join('') || '<div class="hint">No hydrants match.</div>';
    document.querySelectorAll('[data-hydrant]').forEach(row=>{
      row.onclick = ()=> renderHydrantDetail(row.dataset.hydrant, ()=>render());
    });
  }
  render();
}

async function renderHydrantDetail(hydrantId, backTo){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const hydrant = state.hydrants.find(h=>h.id===hydrantId);
  const { data: tests } = await sb.from('hydrant_tests').select('*, sessions(activity_type, session_date)').eq('hydrant_id', hydrantId).order('tested_at', {ascending:false});
  const statusInfo = computeHydrantStatus(tests||[]);
  const compName = state.companies.find(c=>c.id===hydrant.company_id)?.name || '—';
  const divName = state.divisions.find(d=>d.id===hydrant.division_id)?.name || '—';
  const s = statusInfo.status;

  main.innerHTML = backBar('Back', 'topBackBtn') + `
    <div class="card">
      <h3 style="margin-top:0;">${esc(hydrant.hydrant_number)}</h3>
      <div class="hint">${esc(hydrant.address||'')} · ${esc(compName)} · ${esc(divName)}</div>
      <span class="status-badge ${s}" style="margin-top:10px;">${STATUS_SYMBOLS[s]} ${STATUS_LABELS[s]}</span>
      ${statusInfo.mostRecentFlag ? `<div class="hint" style="margin-top:4px;">Most recent: ${STATUS_LABELS[statusInfo.mostRecentFlag.status]} (${fmtDate(statusInfo.mostRecentFlag.date)})</div>` : ''}
      ${(state.isChief && s !== 'good') ? '<button class="secondary" id="repairBtn" style="border-color:var(--ok);color:var(--ok);margin-top:12px;">Mark Repaired — Back In Service</button>' : ''}
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Test History</h3>
      ${(tests||[]).length === 0 ? '<div class="hint">No entries yet.</div>' : (tests||[]).map(t => `
        <div class="entry" style="cursor:default;">
          <div class="entry-top"><span>${esc(ACTIVITY_LABELS[t.sessions?.activity_type] || '—')}</span><span>${fmtDate(t.tested_at)}</span></div>
          ${t.static_psi!=null ? `<div style="font-size:13px;">Static ${t.static_psi} · Residual ${t.residual_psi} · Pitot ${t.pitot_psi} · Flow ${t.flow_gpm??'—'} gpm · @20psi ${t.flow_at_20psi??'—'} gpm${t.gauge_flow_gpm!=null ? ` · Gauge ${t.gauge_flow_gpm} gpm` : ''}</div>` : ''}
          ${t.condition ? `<span class="tag ${t.condition==='good'?'tag-good':'tag-bad'}">${t.condition==='good'?'Good':(t.condition==='repair'?'Needs Repair':'OOS')}</span>` : ''}
          ${t.wet_dry ? `<span class="tag ${t.wet_dry==='dry'?'tag-good':'tag-bad'}">${t.wet_dry==='dry'?'Dry':'Wet'}</span>` : ''}
          ${t.snow_cleared_status ? `<span class="tag ${t.snow_cleared_status==='cleared'?'tag-good':'tag-bad'}">${t.snow_cleared_status==='cleared'?'Cleared':'Not Cleared'}</span>` : ''}
          ${t.snow_condition_flag ? `<span class="tag tag-bad">${esc(t.snow_condition_flag)}</span>` : ''}
          ${t.notes ? `<div style="font-size:12.5px;font-style:italic;color:var(--steel);margin-top:4px;">"${esc(t.notes)}"</div>` : ''}
        </div>`).join('')}
    </div>`;

  document.getElementById('topBackBtn').onclick = backTo;
  const repairBtn = document.getElementById('repairBtn');
  if(repairBtn) repairBtn.onclick = async ()=>{
    if(!confirm('Confirm this hydrant has been repaired and is back in service?')) return;
    const { error } = await sb.from('hydrant_tests').insert({
      hydrant_id: hydrantId, session_id: null, condition: 'good',
      notes: 'Marked repaired / back in service',
    });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Marked back in service');
    renderHydrantDetail(hydrantId, backTo);
  };
}

async function updateHydrantCondition(hydrantId, newCondition, refresh){
  const label = newCondition === 'good' ? 'Good' : (newCondition === 'repair' ? 'Needs Repair' : 'Out of Service');

function isAttentionRow(r, hydrantStatusMap){
  const currentStatus = hydrantStatusMap.get(r.hydrant_id);
  return currentStatus && currentStatus !== 'good';
}
async function renderLog(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <div class="field"><label>Filter: Company</label>
        <select id="filt_company"><option value="">All</option>${state.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Filter: Status</label>
        <select id="filt_status">
          <option value="attention" selected>Needs Attention (default)</option>
          <option value="all">All</option>
          <option value="good">Good (this entry)</option>
          <option value="damaged">Currently Damaged</option>
          <option value="oos">Currently Out of Service</option>
          <option value="wet">Wet (this entry)</option>
          <option value="dry">Dry (this entry)</option>
          <option value="cleared">Cleared (this entry)</option>
          <option value="not_cleared">Not Cleared (this entry)</option>
        </select>
      </div>
      <div class="field"><label>Search Hydrant #</label><input id="filt_search" placeholder="e.g. H-101"></div>
      <div class="row2">
        <div class="field"><label>From Date</label><input type="date" id="filt_from"></div>
        <div class="field"><label>To Date</label><input type="date" id="filt_to"></div>
      </div>
    </div>
    <div id="logList">Loading…</div>`;

  async function load(){
    const [{ data, error }, { data: allStatusTests }] = await Promise.all([
      sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id)').order('tested_at', {ascending:false}).limit(150),
      sb.from('hydrant_tests').select('hydrant_id, condition, snow_condition_flag, session_id, tested_at'),
    ]);
    if(error){ document.getElementById('logList').innerHTML = 'Error: '+esc(error.message); return; }

    const byHydrant = {};
    (allStatusTests||[]).forEach(t=>{ (byHydrant[t.hydrant_id] = byHydrant[t.hydrant_id]||[]).push(t); });
    const hydrantStatusMap = new Map();
    Object.keys(byHydrant).forEach(hid => hydrantStatusMap.set(hid, computeHydrantStatus(byHydrant[hid]).status));

    const companyFilter = document.getElementById('filt_company').value;
    const statusFilter = document.getElementById('filt_status').value;
    const search = document.getElementById('filt_search').value.trim().toLowerCase();
    const fromDate = document.getElementById('filt_from').value;
    const toDate = document.getElementById('filt_to').value;
    let rows = data || [];
    if(companyFilter) rows = rows.filter(r => r.hydrants && r.hydrants.company_id === companyFilter);
    if(search) rows = rows.filter(r => r.hydrants && r.hydrants.hydrant_number.toLowerCase().includes(search));
    if(fromDate) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) >= fromDate);
    if(toDate) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) <= toDate);
    if(statusFilter === 'attention') rows = rows.filter(r => isAttentionRow(r, hydrantStatusMap));
    else if(statusFilter === 'good') rows = rows.filter(r => r.condition === 'good');
    else if(statusFilter === 'damaged') rows = rows.filter(r => hydrantStatusMap.get(r.hydrant_id) === 'damaged');
    else if(statusFilter === 'oos') rows = rows.filter(r => hydrantStatusMap.get(r.hydrant_id) === 'oos');
    else if(statusFilter === 'wet') rows = rows.filter(r => r.wet_dry === 'wet');
    else if(statusFilter === 'dry') rows = rows.filter(r => r.wet_dry === 'dry');
    else if(statusFilter === 'cleared') rows = rows.filter(r => r.snow_cleared_status === 'cleared');
    else if(statusFilter === 'not_cleared') rows = rows.filter(r => r.snow_cleared_status === 'not_cleared');

    document.getElementById('logList').innerHTML = rows.length ? rows.map(r => `
      <div class="entry" data-id="${r.id}">
        <div class="entry-top"><span>${esc(r.hydrants?.hydrant_number || '—')} · ${esc(r.hydrants?.address||'')}</span><span>${fmtDate(r.tested_at)}</span></div>
        ${r.condition ? `<span class="tag ${r.condition==='good'?'tag-good':'tag-bad'}">${r.condition==='good'?'Good':(r.condition==='repair'?'Needs Repair':'Out of Service')}</span>` : ''}
        ${r.wet_dry ? `<span class="tag ${r.wet_dry==='dry'?'tag-good':'tag-bad'}">${r.wet_dry==='dry'?'Dry':'Wet'}</span>` : ''}
        ${r.snow_cleared_status ? `<span class="tag ${r.snow_cleared_status==='cleared'?'tag-good':'tag-bad'}">${r.snow_cleared_status==='cleared'?'Cleared':'Not Cleared'}</span>` : ''}
        ${r.snow_condition_flag ? `<span class="tag tag-bad">${esc(r.snow_condition_flag)}</span>` : ''}
        <div style="margin-top:6px;font-size:13px;">${r.static_psi!=null ? `Static ${r.static_psi} · Residual ${r.residual_psi} · Flow ${r.flow_gpm??'—'} gpm · @20psi ${r.flow_at_20psi??'—'} gpm${r.gauge_flow_gpm!=null ? ` · Gauge ${r.gauge_flow_gpm} gpm` : ''}` : ''}</div>
        ${r.notes ? `<div style="font-size:12.5px;font-style:italic;color:var(--steel);margin-top:4px;">"${esc(r.notes)}"</div>` : ''}
      </div>`).join('') : '<div class="card">No matching entries.</div>';

    document.querySelectorAll('.entry').forEach(el=>{
      el.onclick = ()=> openEditLogEntryModal(el.dataset.id, load);
    });
  }
  ['filt_company','filt_status'].forEach(id => document.getElementById(id).addEventListener('change', load));
  document.getElementById('filt_search').addEventListener('input', load);
  ['filt_from','filt_to'].forEach(id => document.getElementById(id).addEventListener('change', load));
  attachDatePicker('filt_from'); attachDatePicker('filt_to');
  load();
}

async function openEditLogEntryModal(entryId, onSaved){
  const { data: row } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number,address), sessions(activity_type)').eq('id', entryId).single();
  if(!row){ toast('Entry not found'); return; }
  const activityType = row.sessions?.activity_type || 'flow_test';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  let bodyHtml = '';
  if(activityType === 'snow_removal'){
    bodyHtml = `
      <div class="field"><label>Cleared?</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn ${row.snow_cleared_status==='cleared'?'active good':''}" data-cleared="cleared">Cleared</button>
          <button type="button" class="toggle-btn ${row.snow_cleared_status==='not_cleared'?'active bad':''}" data-cleared="not_cleared">Not Cleared</button>
        </div>
      </div>
      <div class="field"><label>Flag</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn ${row.snow_condition_flag==='damaged'?'active bad':''}" data-flag="damaged">Damaged</button>
          <button type="button" class="toggle-btn ${row.snow_condition_flag==='oos'?'active bad':''}" data-flag="oos">OOS</button>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="e_notes">${esc(row.notes||'')}</textarea></div>
    `;
  } else if(activityType === 'condition_check'){
    bodyHtml = `
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px;">
        <input type="checkbox" id="e_wet" style="width:auto;" ${row.wet_dry==='wet'?'checked':''}> Wet? <span class="hint" style="margin:0;">(assumed dry unless checked)</span>
      </label>
      <div class="field"><label>Condition</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn ${row.condition==='good'?'active good':''}" data-cond="good">Good</button>
          <button type="button" class="toggle-btn ${row.condition==='repair'?'active bad':''}" data-cond="repair">Needs Repair</button>
          <button type="button" class="toggle-btn ${row.condition==='oos'?'active bad':''}" data-cond="oos">OOS</button>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="e_notes">${esc(row.notes||'')}</textarea></div>
    `;
  } else {
    bodyHtml = `
      <div class="row3">
        <div class="field"><label>Static</label><input type="number" id="e_static" value="${row.static_psi??''}"></div>
        <div class="field"><label>Residual</label><input type="number" id="e_residual" value="${row.residual_psi??''}"></div>
        <div class="field"><label>Pitot</label><input type="number" id="e_pitot" value="${row.pitot_psi??''}"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Outlet</label><input type="number" id="e_orifice" value="${row.orifice_diameter??2.5}"></div>
        <div class="field"><label>Coef.</label><input type="number" id="e_coeff" value="${row.discharge_coeff??0.9}"></div>
        <div class="field"><label># Outlets</label><input type="number" id="e_outlets" value="${row.num_outlets??1}"></div>
      </div>
      <div class="field"><label>Condition</label>
        <select id="e_condition"><option value="good" ${row.condition==='good'?'selected':''}>Good</option><option value="repair" ${row.condition==='repair'?'selected':''}>Needs Repair</option><option value="oos" ${row.condition==='oos'?'selected':''}>OOS</option></select>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0 12px;">
        <input type="checkbox" id="e_wet" style="width:auto;" ${row.wet_dry==='wet'?'checked':''}> Wet? <span class="hint" style="margin:0;">(assumed dry unless checked)</span>
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px;">
        <input type="checkbox" id="e_unable" style="width:auto;" ${row.unable_to_test?'checked':''}> Unable to Test
      </label>
      <div class="field"><label>Notes</label><textarea id="e_notes">${esc(row.notes||'')}</textarea></div>
    `;
  }

  let chiefActionsHtml = '';
  if(state.isChief){
    const { data: allTestsForHydrant } = await sb.from('hydrant_tests').select('condition, snow_condition_flag, session_id, tested_at').eq('hydrant_id', row.hydrant_id);
    const currentStatus = computeHydrantStatus(allTestsForHydrant || []).status;
    if(currentStatus !== 'good'){
      chiefActionsHtml = `
        <div class="field" style="background:#f1efe8;border-radius:6px;padding:10px;margin-top:4px;">
          <label>Chief Actions — Hydrant Status</label>
          <div class="btn-row">
            ${currentStatus !== 'damaged' ? `<button type="button" class="small" style="border-color:#8a5a10;color:#8a5a10;" id="quickSetDamaged">Set Damaged</button>` : ''}
            ${currentStatus !== 'oos' ? `<button type="button" class="small danger" id="quickSetOos">Set OOS</button>` : ''}
            <button type="button" class="small ok" id="quickMarkRepaired">Mark Repaired</button>
          </div>
        </div>`;
    }
  }

  overlay.innerHTML = `
    <div class="card modal-card">
      <h3 style="margin-top:0;">Edit Entry — ${esc(row.hydrants?.hydrant_number)}</h3>
      <div class="hint" style="margin-bottom:10px;">${esc(row.hydrants?.address||'')} · ${esc(ACTIVITY_LABELS[activityType])} · ${fmtDate(row.tested_at)}</div>
      ${bodyHtml}
      ${chiefActionsHtml}
      <button class="primary" id="saveEditBtn">Save Changes</button>
      <button class="secondary" id="cancelEditBtn">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cancelEditBtn').onclick = ()=> overlay.remove();
  ['quickSetDamaged','quickSetOos','quickMarkRepaired'].forEach(id=>{
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.onclick = async ()=>{
      const newCondition = id === 'quickSetDamaged' ? 'repair' : id === 'quickSetOos' ? 'oos' : 'good';
      if(newCondition === 'good' && !confirm('Confirm this hydrant has been repaired and is back in service?')) return;
      await updateHydrantCondition(row.hydrant_id, newCondition, null);
      overlay.remove();
      if(onSaved) onSaved();
    };
  });

  let editCleared = row.snow_cleared_status, editFlag = row.snow_condition_flag;
  let editCond = row.condition;
  overlay.querySelectorAll('[data-cleared]').forEach(btn=>{
    btn.onclick = ()=>{ editCleared = btn.dataset.cleared; overlay.querySelectorAll('[data-cleared]').forEach(b=>{b.classList.toggle('active',b===btn);b.classList.remove('good','bad');}); btn.classList.add(editCleared==='cleared'?'good':'bad'); };
  });
  overlay.querySelectorAll('[data-flag]').forEach(btn=>{
    btn.onclick = ()=>{ editFlag = (editFlag===btn.dataset.flag)?null:btn.dataset.flag; overlay.querySelectorAll('[data-flag]').forEach(b=>b.classList.remove('active','bad')); if(editFlag) btn.classList.add('active','bad'); };
  });
  if(activityType === 'condition_check'){
    overlay.querySelectorAll('[data-cond]').forEach(btn=>{
      btn.onclick = ()=>{ editCond = btn.dataset.cond; overlay.querySelectorAll('[data-cond]').forEach(b=>{b.classList.toggle('active',b===btn);b.classList.remove('good','bad');}); btn.classList.add(editCond==='good'?'good':'bad'); };
    });
  }

  document.getElementById('saveEditBtn').onclick = async ()=>{
    let updatePayload = { notes: document.getElementById('e_notes').value || null };
    if(activityType === 'snow_removal'){
      updatePayload.snow_cleared_status = editCleared;
      updatePayload.snow_condition_flag = editFlag;
    } else if(activityType === 'condition_check'){
      updatePayload.wet_dry = document.getElementById('e_wet').checked ? 'wet' : 'dry';
      updatePayload.condition = editCond;
    } else {
      const P = parseFloat(document.getElementById('e_pitot').value);
      const d = parseFloat(document.getElementById('e_orifice').value);
      const C = parseFloat(document.getElementById('e_coeff').value) || 0.9;
      const n = parseFloat(document.getElementById('e_outlets').value) || 1;
      const hs = parseFloat(document.getElementById('e_static').value);
      const hr = parseFloat(document.getElementById('e_residual').value);
      let flow=null, drop=null, flow20=null;
      if(!isNaN(P) && !isNaN(d) && P>0 && d>0) flow = 29.83 * C * d*d * Math.sqrt(P) * n;
      if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
      if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
      updatePayload = {
        ...updatePayload,
        static_psi: document.getElementById('e_static').value || null,
        residual_psi: document.getElementById('e_residual').value || null,
        pitot_psi: document.getElementById('e_pitot').value || null,
        orifice_diameter: document.getElementById('e_orifice').value || null,
        discharge_coeff: document.getElementById('e_coeff').value || null,
        num_outlets: document.getElementById('e_outlets').value || null,
        flow_gpm: flow!==null ? Math.round(flow) : null,
        drop_pct: drop!==null ? drop.toFixed(1) : null,
        flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
        condition: document.getElementById('e_condition').value,
        wet_dry: document.getElementById('e_wet').checked ? 'wet' : 'dry',
        unable_to_test: document.getElementById('e_unable').checked,
      };
    }
    const { error } = await sb.from('hydrant_tests').update(updatePayload).eq('id', entryId);
    if(error){ toast('Error: ' + error.message); return; }
    toast('Entry updated');
    overlay.remove();
    if(onSaved) onSaved();
  };
}

let lastOverdueList = [];

function companyShorthand(name){
  const m = name.match(/^(Engine|Ladder)\s+(\d+)/i);
  if(m) return m[1][0].toUpperCase() + m[2];
  return name.replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();
}

function periodStats(sessions, tests, from){
  const s = sessions.filter(x => new Date(x.started_at) >= from);
  const minutes = s.reduce((sum,x)=>sum+(x.total_minutes||0),0);
  const manMinutes = s.reduce((sum,x)=>{
    const people = (x.crew_member_ids||[]).length + (x.oic_member_id?1:0);
    return sum + people*(x.total_minutes||0);
  },0);
  const entries = tests.filter(x => new Date(x.tested_at) >= from).length;
  return { shifts: s.length, hours: Math.round(minutes/60), manHours: Math.round(manMinutes/60), entries };
}

      <div class="stat"><div class="n">${stats.manHours}</div><div class="l">Man-Hours</div></div>
      <div class="stat" style="grid-column:1/-1;"><div class="n">${stats.entries}</div><div class="l">Entries Logged</div></div>
    </div>
    <div class="field" style="margin-top:10px;margin-bottom:0;">
      <label>Companies Active (tap to view)</label>
      <div class="chip-grid" data-period-chips="${title}">
        ${companiesActive.length ? companiesActive.map(c=>`<div class="chip" data-companyperiod="${c.id}" data-from="${from.toISOString()}" data-to="${to.toISOString()}">${esc(companyShorthand(c.name))}</div>`).join('') : '<span class="hint">None</span>'}
      </div>
    </div>
  </div>`;
}

async function renderStats(){
  const main = document.getElementById('main');
  main.innerHTML = 'Loading…';
  const [tests, {data: sessions}, {data: hydrants}] = await Promise.all([
    fetchAllHydrantTestsWithSession(),
    sb.from('sessions').select('*'),
    sb.from('hydrants').select('*').eq('active', true),
  ]);
  const t = tests || [], s = sessions || [], h = hydrants || [];
  const now = new Date();
  const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0);
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay()); startOfWeek.setHours(0,0,0,0);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  const today = periodStats(s, t, startOfToday);
  const week = periodStats(s, t, startOfWeek);
  const month = periodStats(s, t, startOfMonth);

  function companiesActiveSince(from){
    const ids = [...new Set(s.filter(x=>new Date(x.started_at)>=from).map(x=>x.company_id))];
    return ids.map(id=>state.companies.find(c=>c.id===id)).filter(Boolean).sort((a,b)=>compareCompanyNames(a.name,b.name));
  }

  const lastTestByHydrant = {};
  t.forEach(x => {
    // Same rule as job completion: an incomplete flow test (missing a
    // reading, not marked Unable to Test) doesn't count as a genuine
    // retest — the hydrant should still show as overdue rather than
    // having its clock quietly reset by an unfinished attempt.
    if(x.sessions?.activity_type === 'flow_test'){
      const complete = x.unable_to_test || (x.static_psi != null && x.residual_psi != null && x.pitot_psi != null);
      if(!complete) return;
    }
    const cur = lastTestByHydrant[x.hydrant_id];
    if(!cur || new Date(x.tested_at) > new Date(cur)) lastTestByHydrant[x.hydrant_id] = x.tested_at;
  });
  const overdue = h.filter(hy => {
    const last = lastTestByHydrant[hy.id];
    if(!last) return true;
    const months = hy.retest_interval_months || 12;
    const dueDate = new Date(last); dueDate.setMonth(dueDate.getMonth() + months);
    return dueDate < now;
  });
  lastOverdueList = [...overdue].sort((a,b)=>{
    const an = state.companies.find(c=>c.id===a.company_id)?.name || '';
    const bn = state.companies.find(c=>c.id===b.company_id)?.name || '';
    return compareCompanyNames(an, bn);
  });
  const overdueByCompany = {};
  overdue.forEach(hy=>{
    const name = state.companies.find(c=>c.id===hy.company_id)?.name || 'Unassigned';
    overdueByCompany[name] = (overdueByCompany[name]||0)+1;
  });
  const overdueRows = Object.entries(overdueByCompany).sort((a,b)=>compareCompanyNames(a[0],b[0]));

  // Incomplete Inspections — hydrants whose MOST RECENT flow test is
  // missing a Static/Residual/Pitot reading (t is already sorted
  // newest-first from fetchAllHydrantTestsWithSession).
  const latestFlowTestByHydrant = {};
  t.forEach(x => {
    if(x.sessions?.activity_type === 'flow_test' && !latestFlowTestByHydrant[x.hydrant_id]){
      latestFlowTestByHydrant[x.hydrant_id] = x;
    }
  });
  const incompleteHydrantIds = Object.keys(latestFlowTestByHydrant).filter(hid => {
    const test = latestFlowTestByHydrant[hid];
    if(test.unable_to_test) return false;
    return test.static_psi == null || test.residual_psi == null || test.pitot_psi == null;
  });
  const incomplete = h.filter(hy => incompleteHydrantIds.includes(hy.id));
  lastIncompleteList = [...incomplete].sort((a,b)=>{
    const an = state.companies.find(c=>c.id===a.company_id)?.name || '';
    const bn = state.companies.find(c=>c.id===b.company_id)?.name || '';
    return compareCompanyNames(an, bn);
  });
  const incompleteByCompany = {};
  incomplete.forEach(hy=>{
    const name = state.companies.find(c=>c.id===hy.company_id)?.name || 'Unassigned';
    incompleteByCompany[name] = (incompleteByCompany[name]||0)+1;
  });
  const incompleteRows = Object.entries(incompleteByCompany).sort((a,b)=>compareCompanyNames(a[0],b[0]));

  const hoursByCompany = {};
  const manHoursByCompany = {};
  s.filter(x=>new Date(x.started_at)>=startOfMonth).forEach(sess => {
    const name = state.companies.find(c=>c.id===sess.company_id)?.name || 'Unknown';
    hoursByCompany[name] = (hoursByCompany[name]||0) + (sess.total_minutes||0);
    const people = (sess.crew_member_ids||[]).length + (sess.oic_member_id?1:0);
    manHoursByCompany[name] = (manHoursByCompany[name]||0) + people*(sess.total_minutes||0);
  });
  const hoursRows = Object.keys(hoursByCompany).sort(compareCompanyNames).map(name=>[name, hoursByCompany[name], manHoursByCompany[name]||0]);
  const grandTotalMins = Object.values(hoursByCompany).reduce((a,b)=>a+b,0);
  const grandTotalManMins = Object.values(manHoursByCompany).reduce((a,b)=>a+b,0);

  // Hours/Man-Hours per open campaign
  const { data: openCampaigns } = await sb.from('campaigns').select('*').eq('status','open');
  const campaignRows = [];
  for(const camp of (openCampaigns||[])){
    const { data: jobs } = await sb.from('jobs').select('id').eq('campaign_id', camp.id);
    const jobIds = (jobs||[]).map(j=>j.id);
    if(!jobIds.length){ campaignRows.push([camp.name, 0, 0]); continue; }
    const campSessions = s.filter(sess => jobIds.includes(sess.job_id));
    const mins = campSessions.reduce((sum,x)=>sum+(x.total_minutes||0),0);
    const manMins = campSessions.reduce((sum,x)=>{
      const people = (x.crew_member_ids||[]).length + (x.oic_member_id?1:0);
      return sum + people*(x.total_minutes||0);
    },0);
    campaignRows.push([camp.name, mins, manMins]);
  }

  main.innerHTML = `
    ${statCard('Today', today, companiesActiveSince(startOfToday), startOfToday, now)}
    ${statCard('This Week', week, companiesActiveSince(startOfWeek), startOfWeek, now)}
    ${statCard('This Month', month, companiesActiveSince(startOfMonth), startOfMonth, now)}
    <div class="card">
      <h3 style="margin-top:0;">Hours &amp; Man-Hours by Company (this month)</h3>
      ${hoursRows.length ? `<table class="report"><thead><tr><th>Company</th><th>Hours</th><th>Man-Hours</th></tr></thead><tbody>${hoursRows.map(([name,mins,manMins])=>`<tr><td>${esc(name)}</td><td>${(mins/60).toFixed(1)}</td><td>${(manMins/60).toFixed(1)}</td></tr>`).join('')}<tr style="font-weight:700;"><td>All Companies</td><td>${(grandTotalMins/60).toFixed(1)}</td><td>${(grandTotalManMins/60).toFixed(1)}</td></tr></tbody></table>` : '<div class="hint">No shifts logged this month yet.</div>'}
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Hours &amp; Man-Hours by Campaign (open campaigns)</h3>
      ${campaignRows.length ? `<table class="report"><thead><tr><th>Campaign</th><th>Hours</th><th>Man-Hours</th></tr></thead><tbody>${campaignRows.map(([name,mins,manMins])=>`<tr><td>${esc(name)}</td><td>${(mins/60).toFixed(1)}</td><td>${(manMins/60).toFixed(1)}</td></tr>`).join('')}</tbody></table>` : '<div class="hint">No open campaigns.</div>'}
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Overdue for Retest</h3>
      <div style="font-size:20px;font-weight:700;" class="${overdue.length?'overdue':''}">${overdue.length} total</div>
      ${overdueRows.length ? `<table class="report" style="margin-top:8px;"><thead><tr><th>Company</th><th>Outstanding</th></tr></thead><tbody>${overdueRows.map(([name,count])=>`<tr><td>${esc(name)}</td><td>${count}</td></tr>`).join('')}</tbody></table>` : ''}
      ${overdue.length ? '<button class="secondary" id="overduePdfBtn">Download Full List (PDF)</button>' : ''}
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Incomplete Inspections</h3>
      <div class="hint" style="margin-bottom:8px;">Hydrants whose most recent flow test is missing a Static, Residual, or Pitot reading — including any saved with "Save Incomplete."</div>
      <div style="font-size:20px;font-weight:700;" class="${incomplete.length?'overdue':''}">${incomplete.length} total</div>
      ${incompleteRows.length ? `<table class="report" style="margin-top:8px;"><thead><tr><th>Company</th><th>Incomplete</th></tr></thead><tbody>${incompleteRows.map(([name,count])=>`<tr><td>${esc(name)}</td><td>${count}</td></tr>`).join('')}</tbody></table>` : '<div class="hint">None right now.</div>'}
      ${incomplete.length ? '<button class="secondary" id="incompletePdfBtn">Download Full List (PDF)</button>' : ''}
    </div>
  `;
  document.querySelectorAll('[data-companyperiod]').forEach(chip=>{
    chip.onclick = ()=> renderCompanyPeriodHydrants(chip.dataset.companyperiod, chip.dataset.from, chip.dataset.to, renderStats);
  });
  const pdfBtn = document.getElementById('overduePdfBtn');
  if(pdfBtn) pdfBtn.onclick = ()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text('Overdue Hydrants for Retest', 14, 16);
    doc.setFontSize(10); doc.text('Generated ' + fmtDate(new Date()), 14, 23);
    const body = lastOverdueList.map(hy => [hy.hydrant_number, hy.address||'', state.companies.find(c=>c.id===hy.company_id)?.name || '']);
    doc.autoTable({ head: [['Hydrant','Address','Company']], body, startY: 28, styles:{fontSize:9}, headStyles:{fillColor:[26,26,26]} });
    doc.save('overdue-hydrants-'+new Date().toISOString().slice(0,10)+'.pdf');
    toast('PDF downloaded');
  };
  const incompletePdfBtn = document.getElementById('incompletePdfBtn');
  if(incompletePdfBtn) incompletePdfBtn.onclick = ()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(16); doc.text('Incomplete Flow Test Inspections', 14, 16);
    doc.setFontSize(10); doc.text('Generated ' + fmtDate(new Date()), 14, 23);
    const body = lastIncompleteList.map(hy => [hy.hydrant_number, hy.address||'', state.companies.find(c=>c.id===hy.company_id)?.name || '']);
    doc.autoTable({ head: [['Hydrant','Address','Company']], body, startY: 28, styles:{fontSize:9}, headStyles:{fillColor:[26,26,26]} });
    doc.save('incomplete-inspections-'+new Date().toISOString().slice(0,10)+'.pdf');
    toast('PDF downloaded');
  };
}

let campaignYearFilter = '';
let campaignActivityFilter = '';

async function closeCampaignWithComputedEndDate(campaignId){
  const { data: campaign } = await sb.from('campaigns').select('*').eq('id', campaignId).single();
  const cutoff = new Date(campaign.created_at);
  const { data: tests } = await sb.from('hydrant_tests').select('tested_at, sessions(activity_type)');
  const relevant = (tests||[]).filter(t => t.sessions && t.sessions.activity_type === campaign.activity_type && new Date(t.tested_at) >= cutoff);
  let endDate = new Date().toISOString();
  if(relevant.length){
    endDate = relevant.reduce((max,t)=> new Date(t.tested_at) > new Date(max) ? t.tested_at : max, relevant[0].tested_at);
  }
  await sb.from('campaigns').update({ status:'closed', closed_at: endDate }).eq('id', campaignId);
}

async function computeCampaignQuickStats(campaign, allTests){
  const cutoff = new Date(campaign.created_at);
  const eligibleCompanyIds = (campaign.company_ids && campaign.company_ids.length) ? new Set(campaign.company_ids) : null;
  const totalHydrants = state.hydrants.filter(h => h.company_id && h.block && (!eligibleCompanyIds || eligibleCompanyIds.has(h.company_id))).length;
  const relevant = allTests.filter(t => t.sessions && t.sessions.activity_type === campaign.activity_type && new Date(t.tested_at) >= cutoff);
  const doneIds = new Set(relevant.map(t=>t.hydrant_id));
  const pct = totalHydrants ? Math.round(doneIds.size / totalHydrants * 100) : 0;
  const damaged = relevant.filter(t=>t.snow_condition_flag==='damaged').length;
  const oos = relevant.filter(t=>t.condition==='oos' || t.snow_condition_flag==='oos').length;
  return { pct, damaged, oos, total: totalHydrants, done: doneIds.size };
}

function openCampaignFormModal(existingCampaign, onSaved){
  const isEdit = !!existingCampaign;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  let selectedAll = isEdit ? !(existingCampaign.company_ids && existingCampaign.company_ids.length) : true;
  let selectedIds = new Set(isEdit && existingCampaign.company_ids ? existingCampaign.company_ids : state.companies.map(c=>c.id));

  overlay.innerHTML = `
    <div class="card modal-card">
      <h3 style="margin-top:0;">${isEdit ? 'Edit Campaign' : 'Create Campaign'}</h3>
      <div class="field"><label>Name ${isEdit?'':'(optional — auto-generated if blank)'}</label><input type="text" id="cf_name" value="${isEdit ? esc(existingCampaign.name) : ''}"></div>
      <div class="field"><label>Activity</label>
        <select id="cf_activity" ${isEdit ? 'disabled' : ''}>
          <option value="flow_test" ${(isEdit?existingCampaign.activity_type:'flow_test')==='flow_test'?'selected':''}>Flow Test</option>
          <option value="condition_check" ${isEdit && existingCampaign.activity_type==='condition_check'?'selected':''}>Condition Check</option>
          <option value="snow_removal" ${isEdit && existingCampaign.activity_type==='snow_removal'?'selected':''}>Snow Removal</option>
        </select>
        ${isEdit ? '<div class="hint">Activity type cannot change once jobs are linked to this campaign.</div>' : ''}
      </div>
      <div class="field"><label>Companies (defaults to all)</label>
        <div class="chip-grid" id="cf_companies">
          <div class="chip ${selectedAll?'active':''}" data-cf-all="1">All Companies</div>
          ${state.companies.map(c=>`<div class="chip ${selectedIds.has(c.id)?'active':''}" data-cf-company="${c.id}">${esc(c.name)}</div>`).join('')}
        </div>
      </div>
      <button class="primary" id="cfSaveBtn">${isEdit ? 'Save Changes' : 'Create Campaign'}</button>
      <button class="secondary" id="cfCancelBtn">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cfCancelBtn').onclick = ()=> overlay.remove();

  overlay.querySelectorAll('[data-cf-all]').forEach(el=>{
    el.onclick = ()=>{
      selectedAll = true; selectedIds = new Set(state.companies.map(c=>c.id));
      overlay.querySelectorAll('#cf_companies .chip').forEach(c=>c.classList.add('active'));
    };
  });
  overlay.querySelectorAll('[data-cf-company]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.cfCompany;
      if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
      selectedAll = selectedIds.size === state.companies.length;
      el.classList.toggle('active', selectedIds.has(id));
      overlay.querySelector('[data-cf-all]').classList.toggle('active', selectedAll);
    };
  });

  document.getElementById('cfSaveBtn').onclick = async ()=>{
    const activityType = document.getElementById('cf_activity').value;
    let name = document.getElementById('cf_name').value.trim();
    if(!name) name = ACTIVITY_LABELS[activityType] + ' — started ' + new Date().toLocaleDateString([], {month:'long', year:'numeric'});
    const companyIds = selectedAll ? null : Array.from(selectedIds);
    if(isEdit){
      const { error } = await sb.from('campaigns').update({ name, company_ids: companyIds }).eq('id', existingCampaign.id);
      if(error){ toast('Error: ' + error.message); return; }
      toast('Campaign updated');
    } else {
      const { error } = await sb.from('campaigns').insert({ name, activity_type: activityType, status:'open', company_ids: companyIds });
      if(error){ toast('Error: ' + error.message); return; }
      toast('Campaign created');
    }
    overlay.remove();
    if(onSaved) onSaved();
  };
}
