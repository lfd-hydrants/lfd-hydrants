<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LFD Hydrant Testing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --ink:#1a1a1a; --paper:#f6f5f1; --card:#fff; --red:#b3231c; --red-deep:#7d1712;
    --steel:#3c4c55; --line:#d8d5cc; --ok:#2f6b3a; --warn:#a8631b; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
  header{background:var(--ink);color:var(--paper);padding:16px;border-bottom:4px solid var(--red);
    position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;}
  header h1{font-size:18px;margin:0;}
  header .who{font-size:12px;opacity:.7;}
  header button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 10px;border-radius:5px;font-size:12px;}
  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:9;overflow-x:auto;}
  .tab{flex:1;min-width:80px;text-align:center;padding:11px 4px;font-size:12.5px;font-weight:600;color:#8a8378;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
  .tab.active{color:var(--red-deep);border-bottom-color:var(--red);}
  main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--steel);margin-bottom:4px;letter-spacing:.03em;}
  input,select,textarea{width:100%;padding:10px;font-size:15px;border:1.5px solid var(--line);border-radius:5px;font-family:inherit;}
  textarea{min-height:60px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  button.primary{width:100%;background:var(--red);color:#fff;font-weight:700;padding:13px;border:none;border-radius:6px;font-size:15px;cursor:pointer;}
  button.secondary{width:100%;background:#fff;border:1.5px solid var(--line);color:var(--steel);padding:10px;border-radius:6px;font-weight:600;cursor:pointer;margin-top:8px;}
  button.small{background:#fff;border:1.5px solid var(--line);color:var(--steel);padding:8px 10px;border-radius:5px;font-weight:600;cursor:pointer;font-size:12.5px;}
  button.small.danger{border-color:var(--red);color:var(--red-deep);}
  button.small.ok{border-color:var(--ok);color:var(--ok);}
  button.small.neutral{border-color:var(--steel);}
  .calc-box{background:#f1efe8;border:1px dashed var(--line);border-radius:6px;padding:10px;margin-top:8px;font-size:13.5px;}
  .calc-row{display:flex;justify-content:space-between;padding:3px 0;}
  .calc-row .v{font-family:'Courier New',monospace;font-weight:700;}
  .entry{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px;background:var(--card);}
  .entry-top{display:flex;justify-content:space-between;font-size:13px;color:#9a9488;margin-bottom:4px;}
  .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-right:4px;}
  .tag-good{background:#e4efe6;color:var(--ok);} .tag-repair{background:#f5e9dd;color:var(--warn);} .tag-oos{background:#f5e0de;color:var(--red-deep);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:#f1efe8;border-radius:6px;padding:12px;text-align:center;}
  .stat .n{font-size:24px;font-weight:700;font-family:'Courier New',monospace;}
  .stat .l{font-size:11px;color:var(--steel);text-transform:uppercase;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .login-wrap{max-width:360px;margin:60px auto;padding:20px;}
  .hint{font-size:12px;color:#9a9488;margin-top:6px;}
  .overdue{color:var(--red-deep);font-weight:700;}
  .choice-btn{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:6px;
    padding:14px;margin-bottom:10px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;}
  .choice-btn:active{background:#f1efe8;}
  .job-row{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px;}
  .job-row .jt{font-weight:700;font-size:14px;}
  .job-row .jm{font-size:12px;color:var(--steel);margin:3px 0 8px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-row button{flex:1;min-width:100px;}
  .shift-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .shift-actions button{width:100%;}
  .toggle-group{display:flex;gap:8px;margin-bottom:12px;}
  .toggle-btn{flex:1;padding:12px 6px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font-weight:700;font-size:13px;color:var(--steel);cursor:pointer;}
  .toggle-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .toggle-btn.active.good{background:var(--ok);border-color:var(--ok);}
  .toggle-btn.active.warn{background:var(--warn);border-color:var(--warn);}
  .toggle-btn.active.bad{background:var(--red-deep);border-color:var(--red-deep);}
  .checklist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .checklist-row.done{color:#9a9488;}
  .checkmark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .checkmark.done{background:var(--ok);border-color:var(--ok);color:#fff;}
  .search-results{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:5px;margin-top:6px;}
  .search-result-item{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;}
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:active{background:#f1efe8;}
  .search-result-item small{display:block;color:#9a9488;font-size:11px;margin-top:1px;}
  .subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
  .subtab{flex-shrink:0;padding:7px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--steel);cursor:pointer;}
  .subtab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  table.report{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.report th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap;color:var(--steel);text-transform:uppercase;font-size:10.5px;}
  table.report td{padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .progress-bar{background:#e6e3da;border-radius:6px;height:10px;overflow:hidden;margin:6px 0;}
  .progress-bar .fill{background:var(--ok);height:100%;}
</style>

}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function attachDatePicker(id){

async function init(){
  const { data: sessionData } = await sb.auth.getSession();
  if(!sessionData.session){
    const { error } = await sb.auth.signInAnonymously();

async function loadRefData(){
  const [c, d, m, h, s] = await Promise.all([
    sb.from('companies').select('*').order('name'),

    sb.from('hydrants').select('*').eq('active', true).order('hydrant_number'),
    sb.from('app_settings').select('*'),
  ]);

  state.divisions = d.data || [];
  state.members = m.data || [];
  state.hydrants = h.data || [];
  state.settings = {};
  (s.data || []).forEach(row => state.settings[row.key] = row.value);
}

function renderCompanyLogin(){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="card">

        <div class="field"><label>Company</label>

          <datalist id="companyDatalist">${state.companies.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>

      render();

    toast('Incorrect login');

function clearLogin(){

  localStorage.removeItem('lfd_company'); localStorage.removeItem('lfd_division');
  localStorage.removeItem('lfd_super_admin'); localStorage.removeItem('lfd_active_session_id');
}

function render(){
  if(state.superAdmin){ state.isChief = true; renderChiefShell(); return; }
  if(!state.company){ renderCompanyLogin(); return; }
  const companyRow = state.companies.find(c => c.id === state.company.id);
  if(companyRow && companyRow.is_chief){ state.isChief = true; renderChiefShell(); return; }
  state.isChief = false;
  if(!state.division){ renderDivisionSelect(); return; }
  renderCompanyShell();
}

async function routeHomeTab(){
  const cachedId = localStorage.getItem('lfd_active_session_id');
  if(cachedId){
    const { data, error } = await sb.from('sessions').select('*').eq('id', cachedId).single();
    if(!error && data && data.status === 'open'){
      state.activeSession = data;

      if(job && job.status === 'open'){ state.activeJob = job; renderHydrantEntry(); return; }
    }
    localStorage.removeItem('lfd_active_session_id');
  }
  renderCompanyHome();
}

// ============================================================
// TYPEAHEAD (searchable member picker)
// ============================================================
function typeaheadHtml(id, placeholder){
  return `
    <div style="position:relative;">
      <input type="text" id="${id}_text" placeholder="${esc(placeholder)}" autocomplete="off">
      <input type="hidden" id="${id}_value">
      <div class="search-results" id="${id}_results" style="display:none;position:absolute;left:0;right:0;background:#fff;z-index:5;"></div>
    </div>`;
}
function wireTypeahead(id, items, onSelect){
  const textInput = document.getElementById(id+'_text');
  const hiddenInput = document.getElementById(id+'_value');
  const results = document.getElementById(id+'_results');
  textInput.addEventListener('focus', showAll);
  textInput.addEventListener('input', ()=>{
    const q = textInput.value.trim().toLowerCase();
    const matches = q ? items.filter(m=>m.name.toLowerCase().includes(q)) : items;
    renderList(matches);
  });
  document.addEventListener('click', (e)=>{
    if(!textInput.contains(e.target) && !results.contains(e.target)) results.style.display='none';
  });
  function showAll(){ renderList(items); }
  function renderList(matches){
    if(!matches.length){ results.style.display='none'; return; }
    results.innerHTML = matches.slice(0,30).map(m=>`<div class="search-result-item" data-id="${m.id}">${esc(m.name)}</div>`).join('');
    results.style.display = 'block';
    results.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        const m = items.find(x=>x.id===el.dataset.id);
        textInput.value = m.name; hiddenInput.value = m.id;
        results.style.display = 'none';
        if(onSelect) onSelect(m);
      };
    });
  }
}

// COMPANY HOME

async function renderCompanyHome(){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const fourteenDaysAgo = new Date(Date.now() - 14*24*60*60*1000).toISOString();

  const [{ data: openJobs }, { data: closedJobs }] = await Promise.all([
    sb.from('jobs').select('*').eq('company_id', state.company.id).eq('division_id', state.division.id).eq('status','open').order('created_at', {ascending:false}),
    sb.from('jobs').select('*').eq('company_id', state.company.id).eq('division_id', state.division.id).eq('status','closed').gte('closed_at', fourteenDaysAgo).order('closed_at', {ascending:false}),
  ]);

  const jobRows = [];
  for(const job of (openJobs||[])){
    const { data: shifts } = await sb.from('sessions').select('*').eq('job_id', job.id).order('started_at', {ascending:false});
    const openShift = (shifts||[]).find(s => s.status === 'open');
    const recentClosedShifts = (shifts||[]).filter(s => s.status === 'closed').slice(0,3);
    const { pending, total } = await computeJobPending(job);
    jobRows.push({ job, openShift, recentClosedShifts, pendingCount: pending.length, total });
  }

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Open Work</h3>
      ${jobRows.length === 0 ? '<div class="hint">Nothing open right now.</div>' : jobRows.map(r => `
        <div class="job-row">
          <div class="jt">${esc(ACTIVITY_LABELS[r.job.activity_type])}</div>
          <div class="jm">${r.total - r.pendingCount} of ${r.total} hydrants complete · opened ${esc(new Date(r.job.created_at).toLocaleDateString([], {month:'short', day:'numeric'}))}${r.openShift ? ' · shift in progress' : ''}</div>
          <div class="shift-actions">
            <button class="small" data-resume="${r.job.id}">Resume</button>
            ${r.openShift ? `<button class="small danger" data-endshift="${r.openShift.id}">End Shift</button>` : '<span></span>'}
          </div>
          <button class="small danger" style="width:100%;margin-top:8px;" data-closejob="${r.job.id}">Close Job Permanently</button>
          ${r.recentClosedShifts.length ? `<div class="hint" style="margin-top:8px;">Recently ended shifts: ${r.recentClosedShifts.map(cs=>`<button class="small ok" data-reopenshift="${cs.id}" style="margin:4px 4px 0 0;">Reopen ${esc(new Date(cs.started_at).toLocaleDateString([], {month:'short', day:'numeric'}))}</button>`).join('')}</div>` : ''}
        </div>
      `).join('')}
    </div>
    <div class="card">
      <button class="primary" id="startNewBtn">Start New Job</button>
      <button class="secondary" id="checklistBtn">District Hydrant Checklist</button>
    </div>
    ${closedJobs && closedJobs.length ? `
    <div class="card">
      <h3 style="margin-top:0;">Recently Closed (tap to reopen)</h3>
      ${closedJobs.map(j => `
        <div class="job-row">
          <div class="jt">${esc(ACTIVITY_LABELS[j.activity_type])}</div>
          <div class="jm">Closed ${esc(new Date(j.closed_at).toLocaleDateString([], {month:'short', day:'numeric'}))}</div>
          <button class="small ok" data-reopenjob="${j.id}">Reopen Job</button>
        </div>
      `).join('')}
    </div>` : ''}
  `;

  document.getElementById('startNewBtn').onclick = renderActivityPicker;
  document.getElementById('checklistBtn').onclick = renderDistrictChecklist;

  main.querySelectorAll('[data-resume]').forEach(btn=>{
    btn.onclick = async ()=>{
      const jobId = btn.dataset.resume;
      const { data: job } = await sb.from('jobs').select('*').eq('id', jobId).single();
      const { data: openShift } = await sb.from('sessions').select('*').eq('job_id', jobId).eq('status','open').maybeSingle();
      state.activeJob = job;
      if(openShift){
        state.activeSession = openShift;
        localStorage.setItem('lfd_active_session_id', openShift.id);
        renderHydrantEntry();
      } else {
        renderStartShift({ job }, null);
      }
    };
  });
  main.querySelectorAll('[data-endshift]').forEach(btn=>{
    btn.onclick = async ()=>{
      const { data: sessionRow } = await sb.from('sessions').select('*').eq('id', btn.dataset.endshift).single();
      const { data: job } = await sb.from('jobs').select('*').eq('id', sessionRow.job_id).single();
      state.activeSession = sessionRow; state.activeJob = job;
      openEndShiftModal();
    };
  });
  main.querySelectorAll('[data-closejob]').forEach(btn=>{
    btn.onclick = async ()=>{

async function getOrCreateCampaign(activityType){
  const { data: existing } = await sb.from('campaigns').select('*')
    .eq('activity_type', activityType).eq('status','open')
    .order('created_at', {ascending:false}).limit(1).maybeSingle();
  if(existing) return existing;
  const label = ACTIVITY_LABELS[activityType] + ' — started ' + new Date().toLocaleDateString([], {month:'long', year:'numeric'});
  const { data: newCampaign } = await sb.from('campaigns').insert({ name: label, activity_type: activityType, status:'open' }).select().single();
  return newCampaign;
}

function renderStartShift(prefill, editingSession){
  const main = document.getElementById('main');
  const isEdit = !!editingSession;
  sessionCrew = isEdit
    ? (editingSession.crew_member_ids || []).map(id => state.members.find(m=>m.id===id)).filter(Boolean).map(m=>({id:m.id, name:m.name}))
    : [];
  const today = new Date().toISOString().slice(0,10);
  const activityType = isEdit ? state.activeJob.activity_type : (prefill.job ? prefill.job.activity_type : prefill.activityType);

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">${isEdit ? 'Shift Settings' : 'Start Shift'}</h3>
      <div class="hint" style="margin-bottom:12px;">${esc(state.company.name)} · ${esc(ACTIVITY_LABELS[activityType])}</div>
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${isEdit ? editingSession.session_date : today}"></div>
      <div class="field"><label>Division</label>
        <select id="f_division">${state.divisions.map(d=>`<option value="${d.id}" ${(isEdit ? editingSession.division_id===d.id : state.division.id===d.id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>OIC</label>${typeaheadHtml('f_oic', 'Type a name…')}</div>
      <div class="field"><label>Crew</label>
        <div class="row2">
          <div>${typeaheadHtml('f_crew_pick', 'Type a name…')}</div>
          <button type="button" class="secondary" id="addCrewBtn" style="margin-top:0;">Add</button>
        </div>
        <div id="crewList" style="margin-top:10px;"></div>
      </div>
      <button class="primary" id="startBtn">${isEdit ? 'Save Changes' : 'Start Shift'}</button>
      <button class="secondary" id="backBtn">← Back</button>
    </div>`;
  attachDatePicker('f_date');

  wireTypeahead('f_oic', state.members);
  if(isEdit && editingSession.oic_member_id){
    const m = state.members.find(x=>x.id===editingSession.oic_member_id);
    if(m){ document.getElementById('f_oic_text').value = m.name; document.getElementById('f_oic_value').value = m.id; }
  }
  wireTypeahead('f_crew_pick', state.members);

  function renderCrewList(){
    const list = document.getElementById('crewList');
    if(sessionCrew.length === 0){ list.innerHTML = '<div class="hint">No crew added yet.</div>'; return; }
    list.innerHTML = sessionCrew.map(m => `
      <div style="display:flex;justify-content:space-between;align-items:center;background:#f1efe8;border-radius:5px;padding:7px 10px;margin-bottom:6px;font-size:13.5px;">
        <span>${esc(m.name)}</span>
        <button type="button" data-id="${m.id}" class="removeCrewBtn" style="background:none;border:none;color:var(--red-deep);font-weight:700;cursor:pointer;font-size:15px;">×</button>
      </div>`).join('');
    list.querySelectorAll('.removeCrewBtn').forEach(btn=>{
      btn.onclick = ()=>{ sessionCrew = sessionCrew.filter(m => m.id !== btn.dataset.id); renderCrewList(); };
    });
  }
  renderCrewList();

  document.getElementById('addCrewBtn').onclick = ()=>{
    const id = document.getElementById('f_crew_pick_value').value;
    if(!id){ toast('Pick a crew member first'); return; }
    if(sessionCrew.some(m => m.id === id)){ toast('Already added'); return; }
    const member = state.members.find(m => m.id === id);
    sessionCrew.push({ id: member.id, name: member.name });
    document.getElementById('f_crew_pick_text').value = '';
    document.getElementById('f_crew_pick_value').value = '';
    renderCrewList();
  };

  document.getElementById('backBtn').onclick = ()=> isEdit ? renderHydrantEntry() : renderCompanyHome();

  document.getElementById('startBtn').onclick = async ()=>{
    const oic = document.getElementById('f_oic_value').value;
    const divisionId = document.getElementById('f_division').value;
    if(!oic){ toast('Select an OIC'); return; }

    const payload = {
      session_date: document.getElementById('f_date').value,
      division_id: divisionId,
      oic_member_id: oic,
      crew_member_ids: sessionCrew.map(m => m.id),
    };

    if(isEdit){
      const { data, error } = await sb.from('sessions').update(payload).eq('id', editingSession.id).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      state.activeSession = data;
      toast('Shift updated');
      renderHydrantEntry();
    } else {
      let job = prefill.job;
      if(!job){
        const campaign = await getOrCreateCampaign(prefill.activityType);
        const { data: newJob, error: jobErr } = await sb.from('jobs').insert({
          company_id: state.company.id, division_id: state.division.id,
          activity_type: prefill.activityType, status: 'open',
          campaign_id: campaign ? campaign.id : null,
        }).select().single();
        if(jobErr){ toast('Error: ' + jobErr.message); return; }
        job = newJob;
      }
      const { data, error } = await sb.from('sessions').insert({
        ...payload, company_id: state.company.id, activity_type: job.activity_type,
        job_id: job.id, started_at: new Date().toISOString(), status: 'open',
      }).select().single();
      if(error){ toast('Error: ' + error.message); return; }
      localStorage.setItem('lfd_active_session_id', data.id);
      state.activeJob = job; state.activeSession = data;
      toast('Shift started');
      renderHydrantEntry();
    }
  };
}

let selectedHydrantId = null;

async function computeJobPending(job){
  const companyDivisionHydrants = state.hydrants.filter(h => h.company_id === job.company_id && h.division_id === job.division_id);
  const ids = companyDivisionHydrants.map(h=>h.id);
  if(ids.length === 0) return { pending: [], total: 0, completedCount: 0 };
  const { data } = await sb.from('hydrant_tests').select('hydrant_id, tested_at, sessions(activity_type)').in('hydrant_id', ids);
  const cutoff = new Date(job.created_at);
  const doneIds = new Set((data||[])
    .filter(r => r.sessions && r.sessions.activity_type === job.activity_type && new Date(r.tested_at) >= cutoff)
    .map(r=>r.hydrant_id));
  const pending = companyDivisionHydrants.filter(h => !doneIds.has(h.id));
  return { pending, total: companyDivisionHydrants.length, completedCount: companyDivisionHydrants.length - pending.length };
}

function hydrantPickerHtml(pending){
  return `
    <div class="field"><label>Hydrant Number ${pending.length===0 ? '— all done for this job!' : ''}</label>
      <select id="f_hydrant"><option value="">${pending.length ? 'Select hydrant…' : 'No hydrants remaining'}</option>${pending.map(h=>`<option value="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')}</option>`).join('')}</select>
    </div>
    <div class="field">
      <label>Hydrant not on the list?</label>
      <select id="manualDropdown"><option value="">Browse all hydrants…</option>${[...state.hydrants].sort((a,b)=>a.hydrant_number.localeCompare(b.hydrant_number,undefined,{numeric:true})).map(h=>{
        const comp = state.companies.find(c=>c.id===h.company_id)?.name || '—';
        const div = state.divisions.find(d=>d.id===h.division_id)?.name || '—';
        return `<option value="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')} (${esc(comp)} · ${esc(div)})</option>`;
      }).join('')}</select>
      <input type="text" id="manualSearch" placeholder="…or search by number or address" style="margin-top:6px;">
      <div class="search-results" id="manualResults" style="display:none;"></div>
    </div>
  `;
}
function wireHydrantPicker(afterPick){
  const dropdown = document.getElementById('manualDropdown');
  dropdown.addEventListener('change', ()=>{
    if(dropdown.value){ selectedHydrantId = dropdown.value; afterPick(selectedHydrantId); }
  });
  const input = document.getElementById('manualSearch');
  const results = document.getElementById('manualResults');
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.style.display='none'; results.innerHTML=''; return; }
    const matches = state.hydrants.filter(h => h.hydrant_number.toLowerCase().includes(q) || (h.address||'').toLowerCase().includes(q)).slice(0, 8);
    results.style.display = matches.length ? 'block' : 'none';
    results.innerHTML = matches.map(h => {
      const comp = state.companies.find(c=>c.id===h.company_id)?.name || '—';
      const div = state.divisions.find(d=>d.id===h.division_id)?.name || '—';
      return `<div class="search-result-item" data-id="${h.id}">${esc(h.hydrant_number)} — ${esc(h.address||'')}<small>${esc(comp)} · ${esc(div)}</small></div>`;
    }).join('');
    results.querySelectorAll('.search-result-item').forEach(el=>{
      el.onclick = ()=>{
        selectedHydrantId = el.dataset.id;
        input.value = state.hydrants.find(h=>h.id===el.dataset.id).hydrant_number;
        results.style.display = 'none';
        afterPick(selectedHydrantId);
      };
    });
  });
}

async function checkDuplicateToday(hydrantId, activityType){
  if(!hydrantId) return [];
  const today = new Date().toISOString().slice(0,10);
  const { data } = await sb.from('hydrant_tests').select('*, sessions(company_id, session_date, activity_type)').eq('hydrant_id', hydrantId);
  if(!data) return [];
  return data.filter(t => t.sessions && t.sessions.session_date === today && t.sessions.activity_type === activityType);
}
function dupWarningHtml(){ return '<div id="dupWarning"></div>'; }
async function wireDupWarning(hydrantId, activityType){
  const box = document.getElementById('dupWarning');
  if(!box) return;
  box.innerHTML = '';
  const dups = await checkDuplicateToday(hydrantId, activityType);
  if(dups.length){
    const d = dups[0];

function renderFlowTestForm(main, headerHtml, pending, s, job){
  main.innerHTML = headerHtml + `
    <div class="card">
      ${hydrantPickerHtml(pending)}
      ${dupWarningHtml()}
      <div class="row3">
        <div class="field"><label>Static (psi)</label><input type="number" id="f_static"></div>
        <div class="field"><label>Residual (psi)</label><input type="number" id="f_residual"></div>
        <div class="field"><label>Pitot (psi)</label><input type="number" id="f_pitot"></div>
      </div>
      <div class="row3">
        <div class="field"><label>Outlet Size (in)</label><input type="number" id="f_orifice" value="2.5"></div>
        <div class="field"><label>Discharge Coef.</label><input type="number" id="f_coeff" value="${state.settings.default_discharge_coeff || '0.9'}"></div>
        <div class="field"><label># Outlets</label><input type="number" id="f_outlets" value="1"></div>
      </div>
      <div class="calc-box">
        <div class="calc-row"><span>Flow at test</span><span class="v" id="c_flow">— gpm</span></div>
        <div class="calc-row"><span>% Drop</span><span class="v" id="c_drop">—%</span></div>
        <div class="calc-row"><span>Flow @ 20 psi</span><span class="v" id="c_flow20">— gpm</span></div>
      </div>
      <div class="row2" style="margin-top:12px;">
        <div class="field"><label>Condition</label>
          <select id="f_condition"><option value="good">Good</option><option value="repair">Needs Repair</option><option value="oos">Out of Service</option></select>
        </div>
        <div class="field"><label>Wet / Dry</label>
          <select id="f_wetdry"><option value="dry" selected>Dry</option><option value="wet">Wet</option></select>
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes" placeholder="Leaks, missing cap, obstructed, etc."></textarea></div>
      <button class="primary" id="saveBtn">Save &amp; Continue</button>
    </div>`;

  document.getElementById('f_hydrant').addEventListener('change', (e)=>{ selectedHydrantId = e.target.value; wireDupWarning(selectedHydrantId, 'flow_test'); });
  wireHydrantPicker((id)=> wireDupWarning(id, 'flow_test'));

  function calc(){
    const P = parseFloat(document.getElementById('f_pitot').value);
    const d = parseFloat(document.getElementById('f_orifice').value);
    const C = parseFloat(document.getElementById('f_coeff').value) || 0.9;
    const n = parseFloat(document.getElementById('f_outlets').value) || 1;
    const hs = parseFloat(document.getElementById('f_static').value);
    const hr = parseFloat(document.getElementById('f_residual').value);
    let flow=null, drop=null, flow20=null;
    if(!isNaN(P) && !isNaN(d) && P>0 && d>0) flow = 29.83 * C * d*d * Math.sqrt(P) * n;
    if(!isNaN(hs) && !isNaN(hr) && hs>0) drop = ((hs-hr)/hs)*100;
    if(flow!==null && !isNaN(hs) && !isNaN(hr) && hs>20 && (hs-hr)>0) flow20 = flow * Math.pow((hs-20)/(hs-hr), 0.54);
    document.getElementById('c_flow').textContent = flow!==null ? Math.round(flow)+' gpm' : '— gpm';
    document.getElementById('c_drop').textContent = drop!==null ? drop.toFixed(1)+'%' : '—%';
    document.getElementById('c_flow20').textContent = flow20!==null ? Math.round(flow20)+' gpm' : '— gpm';
    return {flow, drop, flow20};
  }
  ['f_pitot','f_orifice','f_coeff','f_outlets','f_static','f_residual'].forEach(id=>{
    document.getElementById(id).addEventListener('input', calc);
  });

  document.getElementById('saveBtn').onclick = async ()=>{
    const hydrantId = selectedHydrantId || document.getElementById('f_hydrant').value;
    if(!hydrantId){ toast('Select a hydrant'); return; }
    const {flow, drop, flow20} = calc();
    const { error } = await sb.from('hydrant_tests').insert({
      session_id: s.id, hydrant_id: hydrantId,
      static_psi: document.getElementById('f_static').value || null,
      residual_psi: document.getElementById('f_residual').value || null,
      pitot_psi: document.getElementById('f_pitot').value || null,
      orifice_diameter: document.getElementById('f_orifice').value || null,
      discharge_coeff: document.getElementById('f_coeff').value || null,
      num_outlets: document.getElementById('f_outlets').value || null,
      flow_gpm: flow!==null ? Math.round(flow) : null,
      drop_pct: drop!==null ? drop.toFixed(1) : null,
      flow_at_20psi: flow20!==null ? Math.round(flow20) : null,
      condition: document.getElementById('f_condition').value,
      wet_dry: document.getElementById('f_wetdry').value,
      notes: document.getElementById('f_notes').value || null,
    });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Saved — ready for next one');
    renderHydrantEntry();
  };
}

  wireHydrantPicker((id)=> wireDupWarning(id, 'snow_removal'));

  function updateNotesVisibility(){
    document.getElementById('notesWrap').style.display = (clearedStatus==='not_cleared' || conditionFlag) ? 'block' : 'none';
  }
  main.querySelectorAll('[data-cleared]').forEach(btn=>{
    btn.onclick = ()=>{
      clearedStatus = btn.dataset.cleared;
      main.querySelectorAll('[data-cleared]').forEach(b=>{ b.classList.toggle('active', b===btn); b.classList.remove('good','warn'); });
      if(clearedStatus==='cleared') btn.classList.add('good'); else btn.classList.add('warn');
      updateNotesVisibility();
    };
  });
  main.querySelectorAll('[data-flag]').forEach(btn=>{
    btn.onclick = ()=>{
      conditionFlag = (conditionFlag === btn.dataset.flag) ? null : btn.dataset.flag;
      main.querySelectorAll('[data-flag]').forEach(b=>{ b.classList.remove('active','bad'); });
      if(conditionFlag){ btn.classList.add('active','bad'); }
      updateNotesVisibility();
    };
  });

  document.getElementById('saveBtn').onclick = async ()=>{
    const hydrantId = selectedHydrantId || document.getElementById('f_hydrant').value;
    if(!hydrantId){ toast('Select a hydrant'); return; }
    if(!clearedStatus){ toast('Select Cleared or Not Cleared'); return; }
    const { error } = await sb.from('hydrant_tests').insert({
      session_id: s.id, hydrant_id: hydrantId,
      snow_cleared_status: clearedStatus, snow_condition_flag: conditionFlag,
      notes: document.getElementById('f_notes') ? (document.getElementById('f_notes').value || null) : null,
    });
    if(error){ toast('Error: ' + error.message); return; }
    toast('Saved — ready for next one');
    renderHydrantEntry();
  };
}

function openEndShiftModal(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const overlay = document.createElement('div');
  overlay.style = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;';
  overlay.innerHTML = `
    <div class="card" style="max-width:360px;width:100%;margin:0;">
      <h3 style="margin-top:0;">End Shift</h3>
      <div class="hint" style="margin-bottom:10px;">This saves and pauses — the job stays open for the next crew.</div>
      <div class="field"><label>Current Time</label><input type="time" id="endTimeInput" value="${hh}:${mm}"></div>
      <div class="field" style="display:flex;align-items:flex-start;gap:8px;">
        <input type="checkbox" id="endConfirmCheck" style="width:auto;margin-top:3px;">
        <label for="endConfirmCheck" style="text-transform:none;font-weight:400;font-size:13.5px;color:var(--ink);">I confirm all hydrant data for this shift has been recorded.</label>
      </div>
      <button class="primary" id="confirmEndBtn">Confirm &amp; End Shift</button>
      <button class="secondary" id="cancelEndBtn">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  attachDatePicker('endTimeInput');
  document.getElementById('cancelEndBtn').onclick = ()=> overlay.remove();
  document.getElementById('confirmEndBtn').onclick = async ()=>{
    if(!document.getElementById('endConfirmCheck').checked){ toast('Please confirm all data has been recorded'); return; }
    const timeVal = document.getElementById('endTimeInput').value;
    const [h, m] = timeVal.split(':').map(Number);
    const endedAt = new Date(); endedAt.setHours(h, m, 0, 0);
    const s = state.activeSession;
    const startedAt = new Date(s.started_at);
    const totalMinutes = Math.max(0, Math.round((endedAt - startedAt) / 60000));
    const { error } = await sb.from('sessions').update({ ended_at: endedAt.toISOString(), status:'closed', total_minutes: totalMinutes }).eq('id', s.id);
    if(error){ toast('Error: ' + error.message); return; }
    localStorage.removeItem('lfd_active_session_id');
    state.activeSession = null; state.activeJob = null;
    overlay.remove();
    toast('Shift ended — job still open for the next crew');
    renderCompanyHome();
  };
}

async function renderStats(){
  const main = document.getElementById('main');
  main.innerHTML = 'Loading…';
  const [{data: tests}, {data: sessions}, {data: hydrants}] = await Promise.all([
    sb.from('hydrant_tests').select('*'),
    sb.from('sessions').select('*'),
    sb.from('hydrants').select('*').eq('active', true),
  ]);
  const t = tests || [], s = sessions || [], h = hydrants || [];
  const totalMinutes = s.reduce((sum,x)=> sum + (x.total_minutes||0), 0);
  const goodCount = t.filter(x=>x.condition==='good' || x.snow_cleared_status==='cleared').length;
  const attentionCount = t.filter(x=>x.condition==='repair'||x.condition==='oos'||x.snow_cleared_status==='not_cleared'||x.snow_condition_flag).length;
  const now = new Date();
  const lastTestByHydrant = {};
  t.forEach(x => {
    const cur = lastTestByHydrant[x.hydrant_id];
    if(!cur || new Date(x.tested_at) > new Date(cur)) lastTestByHydrant[x.hydrant_id] = x.tested_at;
  });
  const overdue = h.filter(hy => {
    const last = lastTestByHydrant[hy.id];
    if(!last) return true;
    const months = hy.retest_interval_months || 12;
    const dueDate = new Date(last); dueDate.setMonth(dueDate.getMonth() + months);
    return dueDate < now;
  });
  main.innerHTML = `
    <div class="card"><div class="stat-grid">
      <div class="stat"><div class="n">${t.length}</div><div class="l">Entries Logged</div></div>
      <div class="stat"><div class="n">${s.length}</div><div class="l">Shifts</div></div>
      <div class="stat"><div class="n">${Math.round(totalMinutes/60)}</div><div class="l">Total Hours</div></div>
      <div class="stat"><div class="n overdue">${overdue.length}</div><div class="l">Hydrants Overdue</div></div>
      <div class="stat"><div class="n">${goodCount}</div><div class="l">Good / Cleared</div></div>
      <div class="stat"><div class="n">${attentionCount}</div><div class="l">Needs Attention</div></div>
    </div></div>
    ${overdue.length ? `<div class="card"><b>Overdue for retest:</b><br>${overdue.map(hy=>esc(hy.hydrant_number)).join(', ')}</div>` : ''}`;
}

async function renderCampaignDetail(campaignId){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="card">Loading…</div>';
  const { data: campaign } = await sb.from('campaigns').select('*').eq('id', campaignId).single();
  const { data: jobs } = await sb.from('jobs').select('*').eq('campaign_id', campaignId);

  let totalHydrants = 0, totalDone = 0;
  const rows = [];
  for(const job of (jobs||[])){
    const { pending, total, completedCount } = await computeJobPending(job);
    totalHydrants += total; totalDone += completedCount;
    const compName = state.companies.find(c=>c.id===job.company_id)?.name || '—';
    const divName = state.divisions.find(d=>d.id===job.division_id)?.name || '—';
    rows.push({ compName, divName, total, completedCount, pct: total ? Math.round(completedCount/total*100) : 0, status: job.status });
  }
  rows.sort((a,b)=> a.compName.localeCompare(b.compName) || a.divName.localeCompare(b.divName));
  const overallPct = totalHydrants ? Math.round(totalDone/totalHydrants*100) : 0;

  const jobIds = (jobs||[]).map(j=>j.id);
  const { data: sessionIds } = jobIds.length ? await sb.from('sessions').select('id').in('job_id', jobIds) : { data: [] };
  const sIds = (sessionIds||[]).map(s=>s.id);
  const sevenDaysAgo = new Date(Date.now() - 7*24*60*60*1000).toISOString();
  const { data: recentTests } = sIds.length ? await sb.from('hydrant_tests').select('hydrant_id, tested_at').in('session_id', sIds).gte('tested_at', sevenDaysAgo) : { data: [] };
  const thisWeekCount = new Set((recentTests||[]).map(r=>r.hydrant_id)).size;

  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">${esc(campaign.name)}</h3>
      <div class="hint">${esc(ACTIVITY_LABELS[campaign.activity_type])} · ${campaign.status === 'open' ? 'Open' : 'Closed'}</div>
      <div class="progress-bar"><div class="fill" style="width:${overallPct}%;"></div></div>
      <div style="font-size:14px;font-weight:700;">${overallPct}% complete (${totalDone} of ${totalHydrants} hydrants) · ${thisWeekCount} tested this week</div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="small" id="renameBtn">Rename</button>
        ${campaign.status==='open' ? '<button class="small danger" id="closeCampBtn">Close Campaign</button>' : '<button class="small ok" id="reopenCampBtn">Reopen Campaign</button>'}
        <button class="small neutral" id="backBtn">← Back</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">By Company / Division</h3>
      <table class="report"><thead><tr><th>Company</th><th>Division</th><th>Complete</th><th>%</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${esc(r.compName)}</td><td>${esc(r.divName)}</td><td>${r.completedCount}/${r.total}</td><td>${r.pct}%</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table>
    </div>`;

  document.getElementById('backBtn').onclick = renderCampaignsTab;
  document.getElementById('renameBtn').onclick = async ()=>{
    const newName = prompt('Campaign name:', campaign.name);
    if(newName && newName.trim()){
      await sb.from('campaigns').update({ name: newName.trim() }).eq('id', campaignId);
      renderCampaignDetail(campaignId);
    }
  };
  const closeBtn = document.getElementById('closeCampBtn');
  if(closeBtn) closeBtn.onclick = async ()=>{
    if(!confirm('Close this campaign?')) return;
    await sb.from('campaigns').update({ status:'closed', closed_at: new Date().toISOString() }).eq('id', campaignId);
    renderCampaignDetail(campaignId);
  };
  const reopenBtn = document.getElementById('reopenCampBtn');
  if(reopenBtn) reopenBtn.onclick = async ()=>{
    await sb.from('campaigns').update({ status:'open', closed_at:null }).eq('id', campaignId);
    renderCampaignDetail(campaignId);
  };
}

async function loadReportTable(){
  const container = document.getElementById('reportTable');
  container.innerHTML = 'Loading…';
  let hydrants = state.hydrants.filter(h => h.company_id === reportCompanyId);
  if(reportDivisionId) hydrants = hydrants.filter(h => h.division_id === reportDivisionId);
  const ids = hydrants.map(h=>h.id);
  const { data: tests } = ids.length ? await sb.from('hydrant_tests').select('*').in('hydrant_id', ids).order('tested_at', {ascending:false}) : { data: [] };

  const latestByHydrant = {};
  (tests||[]).forEach(t => { if(!latestByHydrant[t.hydrant_id]) latestByHydrant[t.hydrant_id] = t; });

  let rows = hydrants.map(h => {
    const t = latestByHydrant[h.id];
    const divName = state.divisions.find(d=>d.id===h.division_id)?.name || '—';
    const flagged = t && (t.condition==='repair' || t.condition==='oos' || t.snow_condition_flag);
    return {
      hydrant_number: h.hydrant_number, address: h.address||'', division: divName,
      condition: t?.condition || '', wet_dry: t?.wet_dry || '', snow: t?.snow_cleared_status || '',
      flag: t?.snow_condition_flag || '', flow: t?.flow_gpm ?? '', static_psi: t?.static_psi ?? '',
      residual: t?.residual_psi ?? '', last_tested: t?.tested_at ? t.tested_at.slice(0,10) : 'Never',
      flagged,
    };
  });
  if(reportFlaggedOnly) rows = rows.filter(r => r.flagged);
  rows.sort((a,b)=>{
    const av = a[reportSort.field], bv = b[reportSort.field];
    const cmp = String(av).localeCompare(String(bv), undefined, {numeric:true});
    return reportSort.dir === 'asc' ? cmp : -cmp;
  });

  const cols = [
    ['hydrant_number','Hydrant'], ['address','Address'], ['division','Division'],
    ['condition','Condition'], ['wet_dry','Wet/Dry'], ['snow','Snow'], ['flag','Flag'],
    ['flow','Flow'], ['static_psi','Static'], ['residual','Residual'], ['last_tested','Last Tested'],
  ];
  container.innerHTML = `
    <table class="report"><thead><tr>${cols.map(([f,l])=>`<th data-sort="${f}">${esc(l)}${reportSort.field===f ? (reportSort.dir==='asc'?' ▲':' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(([f])=>`<td>${esc(r[f])}</td>`).join('')}</tr>`).join('')}</tbody></table>
    ${rows.length===0 ? '<div class="hint">No hydrants for this company/division.</div>' : ''}
  `;
  container.querySelectorAll('[data-sort]').forEach(th=>{
    th.onclick = ()=>{
      if(reportSort.field === th.dataset.sort) reportSort.dir = reportSort.dir === 'asc' ? 'desc' : 'asc';
      else { reportSort.field = th.dataset.sort; reportSort.dir = 'asc'; }
      loadReportTable();
    };
  });
}

async function generateCustomCsv(){
  const from = document.getElementById('csv_from').value;
  const to = document.getElementById('csv_to').value;
  const companyId = document.getElementById('csv_company').value;
  const divisionId = document.getElementById('csv_division').value;
  const activityType = document.getElementById('csv_activity').value;
  const wetDry = document.getElementById('csv_wetdry').value;
  const status = document.getElementById('csv_status').value;

  const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number, address, company_id, division_id), sessions(activity_type, session_date, company_id, division_id)');
  let rows = data || [];
  if(from) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) >= from);
  if(to) rows = rows.filter(r => r.tested_at && r.tested_at.slice(0,10) <= to);
  if(companyId) rows = rows.filter(r => r.hydrants?.company_id === companyId);
  if(divisionId) rows = rows.filter(r => r.hydrants?.division_id === divisionId);
  if(activityType) rows = rows.filter(r => r.sessions?.activity_type === activityType);
  if(wetDry) rows = rows.filter(r => r.wet_dry === wetDry);
  if(status) rows = rows.filter(r => r.condition === status || r.snow_cleared_status === status || r.snow_condition_flag === status);

  if(!rows.length){ toast('No matching data'); return; }

  const headers = ['Hydrant','Address','Company','Division','Activity','Date','Static','Residual','Pitot','Flow','Drop%','Flow@20psi','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
  const out = rows.map(r => {
    const compName = state.companies.find(c=>c.id===r.hydrants?.company_id)?.name || '';
    const divName = state.divisions.find(d=>d.id===r.hydrants?.division_id)?.name || '';
    return [
      r.hydrants?.hydrant_number, r.hydrants?.address, compName, divName,
      ACTIVITY_LABELS[r.sessions?.activity_type] || '', r.tested_at?.slice(0,10),
      r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.drop_pct, r.flow_at_20psi,
      r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes,
    ];
  });
  const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [headers.join(','), ...out.map(r=>r.map(esc2).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hydrant-report-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV downloaded');
}

function renderSettingsTab(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Testing Settings</h3>
      <div class="field"><label>Default Retest Interval (months)</label><input id="s_retest" type="number" value="${state.settings.default_retest_interval_months || 12}"></div>
      <div class="field"><label>Default Discharge Coefficient</label><input id="s_coeff" type="number" step="0.01" value="${state.settings.default_discharge_coeff || 0.9}"></div>
      <button class="primary" id="saveSettings">Save Settings</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Company Login Codes</h3>
      <div class="hint" style="margin-bottom:10px;">The shared password each company uses to sign in.</div>
      ${state.companies.map(c => `<div class="field"><label>${esc(c.name)}${c.is_chief?' (Chief)':''}</label><input type="text" class="companyCodeInput" data-company="${c.id}" value="${esc(c.access_code||'')}"></div>`).join('')}
      <button class="primary" id="saveCodesBtn">Save Login Codes</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Chief-Level Access</h3>
      <div class="hint" style="margin-bottom:10px;">These logins see all companies' data instead of their own hydrant list.</div>
      ${state.companies.map(c => `<label style="display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px;"><input type="checkbox" class="chiefFlag" data-company="${c.id}" style="width:auto;" ${c.is_chief?'checked':''}> ${esc(c.name)}</label>`).join('')}
      <button class="primary" id="saveChiefBtn">Save Chief Access</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Export</h3>
      <button class="secondary" id="exportBtn">Download Full Backup (CSV)</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Roster (read-only preview)</h3>
      <div style="font-size:13px;">${state.hydrants.length} hydrants · ${state.members.length} members · ${state.companies.length} companies</div>
    </div>`;

  document.getElementById('saveSettings').onclick = async ()=>{
    await sb.from('app_settings').upsert([
      { key:'default_retest_interval_months', value: document.getElementById('s_retest').value },
      { key:'default_discharge_coeff', value: document.getElementById('s_coeff').value },
    ]);
    toast('Settings saved'); loadRefData();
  };
  document.getElementById('saveCodesBtn').onclick = async ()=>{
    const updates = Array.from(document.querySelectorAll('.companyCodeInput')).map(input => ({ id: input.dataset.company, access_code: input.value }));
    for(const u of updates) await sb.from('companies').update({ access_code: u.access_code }).eq('id', u.id);
    toast('Login codes saved'); loadRefData();
  };
  document.getElementById('saveChiefBtn').onclick = async ()=>{
    const updates = Array.from(document.querySelectorAll('.chiefFlag')).map(cb => ({ id: cb.dataset.company, is_chief: cb.checked }));
    for(const u of updates) await sb.from('companies').update({ is_chief: u.is_chief }).eq('id', u.id);
    toast('Chief access saved'); loadRefData();
  };
  document.getElementById('exportBtn').onclick = async ()=>{
    const { data } = await sb.from('hydrant_tests').select('*, hydrants(hydrant_number,address)');
    if(!data || !data.length){ toast('No data yet'); return; }
    const headers = ['Hydrant','Address','Date','Static','Residual','Pitot','Flow','Drop%','Flow@20psi','Condition','SnowCleared','SnowFlag','WetDry','Notes'];
    const rows = data.map(r=>[r.hydrants?.hydrant_number, r.hydrants?.address, r.tested_at?.slice(0,10), r.static_psi, r.residual_psi, r.pitot_psi, r.flow_gpm, r.drop_pct, r.flow_at_20psi, r.condition, r.snow_cleared_status, r.snow_condition_flag, r.wet_dry, r.notes]);
    const esc2 = v => { const s=(v??'').toString(); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const csv = [headers.join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'hydrant-backup-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
}

init();
